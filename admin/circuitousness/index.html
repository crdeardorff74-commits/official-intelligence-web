                out.innerHTML = `<div style="color:#888;padding:5px;">Network error: ${escapeHtml(e.message || e)}</div>`;
            }
        }
        function renderReturning(data) {
            const out = document.getElementById('returningResults');
            if (!out) return;
            const players = (data && data.players) || [];
            // Played on a prior day but only LOADED today — no play evidence.
            // Counted as returning until 2026-08-28. Listed rather than
            // dropped: the exclusion is the kind of thing that should be
            // checkable by eye, since that is how it got noticed.
            const visitOnly = (data && data.visit_only_players) || [];
            const summary = `<div style="margin-bottom:8px;">
                <span style="color:var(--primary);font-size:14px;">${data.returning}</span>
                <span style="color:var(--text-dim);"> returning of ${data.unique_visitors} unique browsers (${data.pct_returning}%)</span>`
                + (visitOnly.length
                    ? `<div style="font-size:11px;color:var(--text-dim);margin-top:3px;" title="These browsers played on an earlier day, but today they only loaded the page — no puzzle started, no play time, no session opened. A visit row is minted per page load without waiting for the page to be visible, so a restored pinned tab writes one with nobody there. They are listed below, excluded from the count above.">+${visitOnly.length} played before but only loaded today — not counted</div>`
                    : '')
                + `</div>`;
            if (players.length === 0 && visitOnly.length === 0) {
                out.innerHTML = summary + '<div style="color:#666;padding:5px;">No returning players that day.</div>';
                return;
            }
            // Badge per prior-day mode. The back end now sends what the
            // player DID rather than which table proved it, so these are the
            // in-game mode names (see MODE_LABELS) — plus `played`, the
            // catch-all for a started visit that predates puzzle_results and
            // so cannot be attributed to a mode.
            //
            // ⚠ `surge` here covers BOTH the DB's `surge` and `marathon`
            // rows. They are the same gameplay, and the first-run/voluntary
            // split that separates them matters to the first-run funnel, not
            // to "what has this person played before". The By-mode table in
            // Engagement keeps them apart.
            //
            // Colours match the Modes Played chart so a mode reads the same
            // everywhere on the page.
            const srcColor = { surge: '#ffaa00', potd: '#00aaff', zen: '#888', played: '#666' };
            const srcLabel = { surge: 'surge', potd: 'potd', zen: 'zen', played: 'played' };
            const tableFor = (list, dim) => {
            let html = '';
            html += `<table style="width:100%;border-collapse:collapse;font-size:12px;${dim ? 'opacity:0.6;' : ''}">`;
            html += '<tr style="border-bottom:1px solid var(--primary);">'
                 +  '<th style="text-align:left;padding:4px;">First seen</th>'
                 +  '<th style="text-align:left;padding:4px;" title="What this browser played on an EARLIER day. surge / potd / zen are the in-game mode names, read from puzzle_results plus the per-mode session tables. surge covers both DB keys `surge` (the first-run pitch run) and `marathon` (any later voluntary run) — same gameplay, and that split belongs to the first-run funnel, not here. `played` means the visit started something but predates puzzle_results, so the mode is unknowable — it is not a mode name.">Played before via</th>'
                 +  '<th style="text-align:left;padding:4px;">Session</th>'
                 +  '<th style="text-align:left;padding:4px;" title="Leaderboard handle this BROWSER last submitted a score under (Marathon or PotD), matched on session_id. Browser-level and retroactive: it labels every row from that browser, including loads from before the name was first typed and loads where nothing was submitted. Blank = this browser has never submitted under a name (or submitted as Anonymous, or arrived with no session_id). The same person on a second device stays blank there until they submit from it too.">Player</th>'
                 +  '<th style="text-align:left;padding:4px;">Device</th>'
                 +  '<th style="text-align:left;padding:4px;">Lang</th>'
                 +  '<th style="text-align:left;padding:4px;">Returned (CT)</th>'
                 +  '</tr>';
            list.forEach(p => {
                const sid = p.session_id || '';
                const sidShort = sid.length > 12 ? sid.slice(0, 12) + '…' : sid;
                const badges = (p.sources || []).map(s =>
                    `<span style="display:inline-block;border:1px solid ${srcColor[s] || '#888'};color:${srcColor[s] || '#888'};border-radius:3px;padding:0 5px;margin-right:4px;font-size:10px;">${escapeHtml(srcLabel[s] || s)}</span>`
                ).join('');
                html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.1);">

            };

            let html = summary;

        // ── First-time-player funnel ──

        async function loadFirstRunStats() {

                    if (res.status === 404) { el.style.display = 'none'; el.innerHTML = ''; return; }

            }
        }
        function renderFirstRun() {
            const el = document.getElementById('visitFirstRun');
            if (!el || !cachedFirstRun) return;
            const w = cachedFirstRun.windows[currentWindow] || cachedFirstRun.windows.lifetime || {};
            const winLabel = currentWindow === 'lifetime' ? 'since 2026-07-28' : 'first visit in last ' + currentWindow;
            const sub = (txt) => `<div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${txt}</div>`;
            // Denominator for every rate: ENGAGED players (≥1 initial-run
            // solve) — 0-puzzle bouncers are tracked (players card sub-line
            // + the red 0 bucket below) but excluded from all averages and
            // percentages (user call 2026-07-29: a player who never solves
            // puzzle 1 is a lost cause and shouldn't dilute the signals).
            // Falls back to `players` until the back-end redeploys with the
            // engaged/bounced fields.
            const eng = (w.engaged !== undefined) ? w.engaged : (w.players || 0);
            const newPlayersSub = (w.engaged !== undefined)
                ? sub(eng + ' engaged · ' + (w.bounced || 0) + ' bounced (0 puzzles)')
                : '';
            // Avg-puzzles sub-line carries the ≥3 average beside the card's
            // ≥1 one. The two bars aren't comparable, and the ladder table
            // below uses ≥3 — without both figures on the card its 3.53
            // reads as contradicting variant rows of 5-7 (user, 2026-07-31).
            // Omitted (not shown as 0) until the back-end ships the field.
            const avgSub = (w.avg_initial_puzzles_3plus !== undefined)
                ? sub('≥1 solve · <strong>' + w.avg_initial_puzzles_3plus
                      + '</strong> at ≥3 (' + (w.engaged_3plus || 0) + ' players)')
                : sub('engaged only');
            el.style.display = '';
            // ── The first session, as one descending funnel ──
            // Rewritten 2026-08-07 for the practice → pitch → Surge
            // sequence that replaced the Zen drop-in on 2026-08-06. Every
            // rate on this row is over ALL new players, so the four cards
            // read straight across as "how far down the sequence did they
            // get". The older cards below keep their engaged-only
            // denominators, which is why they're a separate row.
            const ladder = (w.practice_any_rate !== undefined);
            let html = `
                <h3 style="margin-bottom: 6px; color: var(--primary);">> First-Time Players</h3>
                <div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;">
                    One row per new browser, opened when their first session commits a puzzle action (<strong>${escapeHtml(winLabel)}</strong>).
                    The first session is three <strong>practice</strong> puzzles → a <strong>pitch</strong> screen → a real <strong>Surge</strong> run.
                    "Outside the run" = any later voluntary play — menu Marathon, resumes, PotD — same sitting or any later day.
                </div>`;
            if (ladder) {
                // Retry rate is the one to watch: the entire premise of the
                // redesign is that a run which ENDS, with a score, makes a
                // player want another go. If it sits near zero the premise
                // is dead, and no amount of practice-phase polish fixes it.
                const retryColor = (w.retried || 0) === 0 ? '#ff5050'
                    : (w.retry_rate >= 30 ? '#00ff64' : '#ffaa00');
                html += `<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px;">
                    <div class="stat-card"><div class="stat-value">${w.players || 0}</div><div class="stat-label">New players</div>${sub('landed and touched a tile')}</div>
                    <div class="stat-card"><div class="stat-value">${w.practice_any_rate || 0}%</div><div class="stat-label">Solved a practice puzzle</div>${sub((w.practice_any || 0) + ' of ' + (w.players || 0))}</div>
                    <div class="stat-card"><div class="stat-value">${w.pitch_rate || 0}%</div><div class="stat-label">Reached the pitch</div>${sub((w.reached_pitch || 0) + ' — finished all three')}</div>
                    <div class="stat-card"><div class="stat-value" style="color:${w.surge_rate >= 50 ? '#00ff64' : '#ffaa00'};">${w.surge_rate || 0}%</div><div class="stat-label">Started Surge</div>${sub((w.surge_started || 0) + ' of ' + (w.players || 0) + ' · ' + Math.max(0, (w.reached_pitch || 0) - (w.surge_started || 0)) + ' saw the pitch and passed')}</div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px;">
                    <div class="stat-card"><div class="stat-value" style="color:${retryColor};">${w.retry_rate || 0}%</div><div class="stat-label">Took Try Again</div>${sub((w.retried || 0) + ' of ' + (w.surge_started || 0) + ' Surge starters · ' + (w.avg_retries || 0) + ' avg')}</div>
                    <div class="stat-card"><div class="stat-value">${w.avg_initial_puzzles || 0}</div><div class="stat-label">Avg Surge solves</div>${avgSub}</div>
                    <div class="stat-card"><div class="stat-value">${w.outside_start_rate || 0}%</div><div class="stat-label">Started outside the run</div>${sub((w.outside_started || 0) + ' of ' + eng + ' engaged')}</div>
                    <div class="stat-card"><div class="stat-value">${w.outside_solve_rate || 0}%</div><div class="stat-label">Solved outside the run</div>${sub((w.outside_solved || 0) + ' of ' + (w.outside_started || 0) + ' starters')}</div>

            }
            // Menu-surface discovery + the engaged/bounced split. Same

            html += `<div style="display:grid;grid-template-columns:repeat(${ladder ? 5 : 8},minmax(0,1fr));gap:10px;">
                    ${ladder ? '' : `<div class="stat-card"><div class="stat-value">${w.players || 0}</div><div class="stat-label">New players</div>${newPlayersSub}</div>
                    <div class="stat-card"><div class="stat-value">${w.avg_initial_puzzles || 0}</div><div class="stat-label">Avg puzzles, first run</div>${avgSub}</div>

                    <div class="stat-card"><div class="stat-value">${eng}</div><div class="stat-label">Engaged / bounced</div>${newPlayersSub || sub('≥1 Surge solve')}</div>
                    <div class="stat-card"><div class="stat-value">${w.howto_rate || 0}%</div><div class="stat-label">Opened How-to-Solve</div>${sub((w.howto_clicked || 0) + ' of ' + eng)}</div>
                    <div class="stat-card"><div class="stat-value">${w.tutorial_rate || 0}%</div><div class="stat-label">Watched it through</div>${sub((w.tutorial_completed || 0) + ' of ' + (w.howto_clicked || 0) + ' openers')}</div>
                    <div class="stat-card"><div class="stat-value">${w.nudge_rate || 0}%</div><div class="stat-label">PotD nudge clicked</div>${sub((w.potd_nudge_clicked || 0) + ' of ' + eng)}</div>
                    <div class="stat-card"><div class="stat-value">${w.daily_rate || 0}%</div><div class="stat-label">Daily &amp; More clicked</div>${sub((w.daily_more_clicked || 0) + ' of ' + eng)}</div>
                </div>`;
            // The A/B/C/D ladder-experiment table lived here until
            // 2026-08-07. It was retired with the experiment: the first
            // session is now one fixed sequence for everyone (practice →
            // pitch → Surge), so there are no arms to compare and the table
            // was reporting on an assignment nobody receives. The back end
            // no longer sends `variants`; this block only renders if some
            // older deploy still does, and can be deleted outright once
            // nothing does.
            const vmap = cachedFirstRun.variants && cachedFirstRun.variants[currentWindow];
            if (vmap) {
                const VLABELS = {
                    fast:     'Fast track (3/2/2/2 + quad)',
                    standard: 'Standard (4 per tier)',
                    extended: 'Extended (6 per tier)',
                    single:   'Single-path only',
                    pre:      '(pre-experiment)'
                };
                const order = ['fast', 'standard', 'extended', 'single', 'pre'];
                html += `<div style="margin-top:14px;">
                    <div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;">Ladder experiment — which first-run variant engages best. Stats here count only runs with <strong>≥3 initial-run solves</strong>: the four ladders are identical through puzzle 3, so shallower runs can't distinguish them. The <strong>&lt;3</strong> figure's parenthetical is how many of those discarded players never came back — the rest returned on a later visit and started playing again.</div>
                    <table style="width:100%;border-collapse:collapse;font-size:12px;">
                    <tr style="border-bottom:1px solid var(--primary);">
                        <th style="text-align:left;padding:4px;">Variant</th>
                        <th style="text-align:right;padding:4px;">Players</th>
                        <th style="text-align:right;padding:4px;" title="reached the divergence point (3+ initial-run solves) / didn't. The number in parentheses is how many of the &lt;3 group never returned: a later visit where they started playing again counts as a return, so the parenthetical is the genuinely-lost count.">3+ / &lt;3 (lost)</th>
                        <th style="text-align:right;padding:4px;">Avg puzzles</th>
                        <th style="text-align:right;padding:4px;">How-to</th>
                        <th style="text-align:right;padding:4px;" title="of How-to openers">Tutorial</th>
                        <th style="text-align:right;padding:4px;">Nudge</th>
                        <th style="text-align:right;padding:4px;">Daily&amp;More</th>
                        <th style="text-align:right;padding:4px;">Out. started</th>
                        <th style="text-align:right;padding:4px;" title="of outside starters">Out. solved</th>
                    </tr>`;
                order.forEach((k) => {
                    const v = vmap[k];
                    if (!v) return;
                    // "(lost)" = discarded players who never came back to play
                    // on a later visit. Omitted entirely (not shown as 0) when
                    // the back-end predates the field, so a stale API can't

                    // bounced, where it would just be noise.
                    const bounced = v.bounced || 0;
                    const lost    = (v.bounced_lost !== undefined) ? v.bounced_lost : null;
                    const lostTxt = (lost !== null && bounced > 0)
                        ? ` <span title="${bounced - lost} of these ${bounced} came back on a later visit and started playing again">(${lost})</span>`
                        : '';
                    html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.1);">
                        <td style="padding:4px;color:var(--text-dim);">${escapeHtml(VLABELS[k] || k)}</td>
                        <td style="text-align:right;padding:4px;">${v.players || 0}</td>
                        <td style="text-align:right;padding:4px;color:var(--text-dim);">${v.engaged || 0} / ${bounced}${lostTxt}</td>
                        <td style="text-align:right;padding:4px;">${v.avg_initial_puzzles || 0}</td>
                        <td style="text-align:right;padding:4px;">${v.howto_rate || 0}%</td>
                        <td style="text-align:right;padding:4px;">${v.tutorial_rate || 0}%</td>
                        <td style="text-align:right;padding:4px;">${v.nudge_rate || 0}%</td>
                        <td style="text-align:right;padding:4px;">${v.daily_rate || 0}%</td>

            // Initial-run depth histogram — how many puzzles each new
            // player's first run lasted. Lifetime-only (the API doesn't
            // window it), labeled so the tab mismatch can't mislead.
            const dist = cachedFirstRun.initial_puzzles_distribution || {};
            // Per-bucket stuck-or-bored split; {} against a back-end that
            // predates it, which just omits the annotation.
            const abandon = cachedFirstRun.abandon_split || {};
            // Bucket order is PROGRESSION, not numeric value: nothing →
            // the practice puzzles → Surge puzzles. 'p1'..'p3' are practice
            // solves and sort BETWEEN "finished nothing" and the first real
            // puzzle. ('-2' / '-1' are the retired warm-up keys from before
            // 2026-08-07, kept in the sort so a stale back-end still
            // renders in the right order.)
            const rank = (k) => {
                if (k === '0')  return -9;
                if (k === '-2' || k === 'p1') return -8;
                if (k === '-1' || k === 'p2') return -7;
                if (k === 'p3') return -6;
                if (k === '15+') return 1e9;
                return parseInt(k, 10);
            };
            const keys = Object.keys(dist).sort((a, b) => rank(a) - rank(b));
            if (keys.length > 0) {
                const total = keys.reduce((s, k) => s + dist[k], 0);
                html += `<div style="margin-top:14px;">
                    <div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;">Where first sessions end (lifetime). Practice solves first, then puzzles solved in the Surge run itself:</div>`;
                // Practice buckets are counts of PRE-SURGE solves, so they
                // need their own labels — "1 puzzle" would collide with the
                // Surge column. ('-2' / '-1' are the retired warm-up keys.)
                const WARMUP_LABELS = {
                    'p1': 'practice 1 of 3',
                    'p2': 'practice 2 of 3',
                    'p3': 'practice 3 of 3 (no Surge solve)',
                    '-2': 'warm-up −2 (3×3, retired)',
                    '-1': 'warm-up −1 (4×3, retired)',
                };
                keys.forEach(k => {
                    const count = dist[k];
                    const pct = total > 0 ? (count / total * 100).toFixed(1) : '0.0';
                    // Drop-off gradient: 0 (solved nothing at all) is the
                    // hard red; the two warm-up buckets are a lighter red —
                    // still a first session that never reached a real
                    // puzzle, but further along than 0. Real puzzles green,
                    // deep runs (15+) amber.
                    const color = k === '0' ? '#ff5050'
                        : (WARMUP_LABELS[k] ? '#ff8c50'
                        : (k === '15+' ? '#ffaa00' : '#00ff64'));
                    const label = WARMUP_LABELS[k] || (k === '0'
                        ? 'nothing solved'
                        : `Surge: ${k} solve${k === '1' ? '' : 's'}`);
                    // STUCK-OR-BORED split. Of the players in this bucket
                    // whose session we can actually speak for (rows created
                    // after the column shipped — older ones sit at 0, which
                    // would read as "left satisfied" without our knowing),
                    // how many walked away from a board they never solved?
                    // Denominator is the measurable subset, NOT the bar
                    // height, so this can't quietly imply coverage it
                    // doesn't have. Omitted entirely until there's data.
                    const ab = abandon[k];

                    if (ab && ab.measured > 0) {
                        const sPct = (ab.stalled / ab.measured * 100).toFixed(0);
                        stuckTxt = ` <span style="color:#ff8c50;" title="${ab.stalled} of ${ab.measured} measurable players in this bucket left mid-puzzle rather than after a solve; median ${ab.median_secs}s on that board">· ${sPct}% stuck (${ab.median_secs}s)</span>`;
                    }

                        <span class="chart-label">${escapeHtml(label)}</span>
                        <div class="chart-bar-bg">
                            <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                        </div>
                        <span class="chart-count">${count} (${pct}%)${stuckTxt}</span>
                    </div>`;
                });
                html += '</div>';
            }
            el.innerHTML = html;
        }

        // ── Engagement panel ──
        // GET /api/admin/engagement. Everything here comes from the
        // instrumentation added 2026-08-07 (page_loads, puzzle_results, and
        // the clock columns on page_visits), so it is empty until a build
        // carrying analytics.js has been deployed AND played.
        //
        // Driven by the LIFETIME/24H/7D/30D tab picker at the top of the
        // page (user call 2026-08-07 — it had its own 7/30/90/lifetime row
        // and TANTЯO ties both to one control). Because this panel
        // aggregates SERVER-side it must RE-FETCH on a tab change rather
        // than re-render off a cache, which is why setWindow calls
        // loadEngagement() directly. Keep this map in step with the tabs;
        // days=0 is lifetime, matching the endpoint's ?days= contract.
        // (The old 90d option is gone with the separate row — nothing to
        // recover, since the top picker tops out at 30d and every window
        // returns the same rows until this instrumentation has 90 days of
        // history.)
        const ENGAGEMENT_DAYS = { lifetime: 0, '24h': 1, '7d': 7, '30d': 30 };
        function fmtSecs(v) {
            if (v === null || v === undefined) return '—';
            const s = Math.round(v);
            if (s < 60) return s + 's';
            const m = Math.floor(s / 60), r = s % 60;
            if (m < 60) return m + 'm' + (r ? ' ' + r + 's' : '');
            return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
        }
        function pctOf(n, d) { return d > 0 ? (n / d * 100).toFixed(1) + '%' : '—'; }

        async function loadEngagement() {
            const out = document.getElementById('visitEngagement');
            if (!out) return;
            const days = ENGAGEMENT_DAYS[currentWindow] !== undefined ? ENGAGEMENT_DAYS[currentWindow] : 30;
            try {
                const res = await fetch(`${GAME_API_URL}/admin/engagement?days=${days}&_=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const body = await res.text();
                let data = null;
                try { data = JSON.parse(body); } catch (_) { /* HTML error page */ }
                if (!res.ok || !data || !data.by_device) {
                    out.innerHTML = '<h3 style="margin-bottom:6px;color:var(--primary);">> Engagement</h3>'
                        + `<div style="color:#888;padding:5px;">${res.status === 404
                            ? 'Endpoint not live yet — redeploy the back-end (GET /api/admin/engagement).'
                            : 'Failed to load: ' + escapeHtml((data && data.error) || res.status)}</div>`;
                    return;
                }
                cachedEngagement = data;
                renderEngagement();
            } catch (e) {
                out.innerHTML = '<h3 style="margin-bottom:6px;color:var(--primary);">> Engagement</h3>'
                    + `<div style="color:#888;padding:5px;">Network error: ${escapeHtml(e.message || e)}</div>`;
            }
        }

        function renderEngagement() {
            const out = document.getElementById('visitEngagement');
            if (!out || !cachedEngagement) return;
            const data = cachedEngagement;
            const devices = data.by_device || {};
            const all = devices.all;
            // Label the ACTIVE TAB, not data.days — the server echoes 24h
            // back as days=1, which would read "last 1d".
            const winLabel = currentWindow === 'lifetime' ? 'lifetime' : 'last ' + currentWindow;
            let html = '<h3 style="margin-bottom:6px;color:var(--primary);">> Engagement '
                + `<span style="font-size:12px;color:var(--text-dim);">(${winLabel})</span></h3>`;

            if (!all || !all.sessions) {
                out.innerHTML = html + '<div style="color:#666;padding:5px;">No engagement rows yet for this window. '
                    + 'They start landing once a front-end build carrying analytics.js is deployed and played.</div>';
                return;
            }

            // Delivery health FIRST, on purpose: if beacons are being lost,
            // every rate below it is under-counted and must not be read as
            // player behaviour.
            const d = all.delivery || {};
            const landed = d.pct_landed;
            const healthColor = landed === null ? '#888' : landed >= 95 ? '#52B788' : landed >= 85 ? '#FFD93D' : '#FF6B6B';
            html += `<div style="font-size:11px;color:var(--text-dim);margin-bottom:10px;">
                Delivery health:
                <span style="color:${healthColor};">${d.rows_landed || 0} of ${d.client_puzzles_started || 0} started puzzles recorded (${landed === null ? '—' : landed + '%'})</span>
                · ${d.stuck_in_progress || 0} rows never got a closing beacon.
                Read this before believing anything below it.
                <br>${escapeHtml(data.note || '')}</div>`;

            // Impression-level conversion. The older start rate (in the
            // funnel above) divides by VISITS, which only exist after real
            // engagement — so it silently omits everyone who loaded and
            // left. Both are shown together so the gap between them is
            // visible rather than surprising.
            const lf = data.load_funnel || {};
            if (lf.all && lf.all.loads) {
                html += '<div style="margin-bottom:10px;border:1px solid rgba(255,255,255,0.15);padding:0.6rem;">';
                html += '<div style="color:var(--primary);margin-bottom:4px;">CONVERSION FROM PAGE LOAD</div>';
                html += '<table style="width:100%;border-collapse:collapse;font-size:12px;">'
                     +  '<tr style="border-bottom:1px solid rgba(255,255,255,0.2);">'
                     +  '<th style="text-align:left;padding:3px;"></th>'
                     +  '<th style="text-align:right;padding:3px;">Loads</th>'
                     +  '<th style="text-align:right;padding:3px;" title="loads that produced a real interaction (a page_visits row)">Interacted</th>'
                     +  '<th style="text-align:right;padding:3px;" title="started a puzzle, as a share of ALL loads — the platform-comparable number">Started / load</th>'
                     +  '<th style="text-align:right;padding:3px;" title="started a puzzle, as a share of INTERACTED loads — the historical start rate">Started / interacted</th></tr>';
                ['all', 'desktop', 'phone', 'tablet'].filter(k => lf[k] && lf[k].loads).forEach(k => {
                    const b = lf[k];
                    const f = v => (v === null || v === undefined) ? '—' : v + '%';
                    html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.1);">
                        <td style="padding:3px;color:var(--text-dim);">${k.toUpperCase()}</td>
                        <td style="padding:3px;text-align:right;">${b.loads}</td>
                        <td style="padding:3px;text-align:right;">${b.interacted} <span style="color:var(--text-dim);font-size:10px;">(${f(b.pct_interacted)})</span></td>
                        <td style="padding:3px;text-align:right;color:#FFD93D;">${f(b.pct_started)}</td>
                        <td style="padding:3px;text-align:right;color:var(--text-dim);">${f(b.pct_started_of_interacted)}</td></tr>`;
                });
                html += '</table>';
                html += '<div style="font-size:11px;color:var(--text-dim);margin-top:4px;">'
                     +  'The last column is the old start rate — computed over people who already engaged. '
                     +  'The gap between the two columns IS the pre-interaction bounce, invisible before page_loads existed. '
                     +  'These rows are noisier than visits by construction: requiring an interaction is what kept '
                     +  'JS-executing crawlers out, and only the user-agent blocklist protects this table.</div>';
                html += '</div>';
            }

            // One block per device. Desktop and mobile are never averaged
            // together — this game plays very differently under a fingertip,
            // and the platforms score them separately anyway.
            const order = ['all', 'desktop', 'phone', 'tablet', 'unknown'];
            const present = order.filter(k => devices[k] && devices[k].sessions);
            html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:1rem;">';

            present.forEach(key => {
                const t = devices[key];
                const ec = t.end_cause || {};
                const ecTotal = (ec.solved || 0) + (ec.failed || 0) + (ec.abandoned || 0) + (ec.in_progress || 0);

                // Header counts three different units, in widening order:
                // visitors (browsers) < sessions (visits — one player can
                // reload all day) < puzzles. Visitors is the people number;
                // everything below the header is per-session or per-puzzle
                // and must not be read as a headcount.
                const vis = t.visitors;
                const visTitle = vis === undefined ? ''
                    : `distinct browsers (localStorage id)${t.anon_visits ? `, incl. ${t.anon_visits} visit(s) with no id, each counted as its own visitor` : ''}`
                      + (t.visits_per_visitor ? ` — ${t.visits_per_visitor} visits per visitor` : '');
                html += `<div style="border:1px solid rgba(255,255,255,0.15);padding:0.6rem;">`;
                html += `<div style="color:var(--primary);margin-bottom:6px;">${key.toUpperCase()}
                    <span style="color:var(--text-dim);font-size:11px;">${vis === undefined ? ''
                        : `· <span title="${visTitle}" style="color:#FFD93D;">${vis} visitors</span>`}
                    · <span title="page visits — one player who reloads or comes back later produces several">${t.sessions} sessions</span>
                    · ${t.puzzles} puzzles</span></div>`;

                const rows = [
                    ['Median session (visible)', fmtSecs(t.median_session_seconds)],
                    ['Median play time', fmtSecs(t.median_play_seconds)],
                    ['Mean play time', fmtSecs(t.mean_play_seconds)],
                    ['Median puzzle', fmtSecs(t.median_puzzle_seconds)],
                    ['Median 1st puzzle', fmtSecs(t.median_first_puzzle_seconds)],
                    ['Median moves/puzzle', t.median_moves === null ? '—' : t.median_moves],
                    ['Load → first puzzle', fmtSecs(t.median_time_to_first_start_seconds)]
                ];
                html += '<div style="font-size:12px;">';
                rows.forEach(r => {
                    html += `<div style="display:flex;justify-content:space-between;gap:0.5rem;">
                        <span style="color:var(--text-dim);">${r[0]}</span><span>${r[1]}</span></div>`;
                });
                html += '</div>';

                // How puzzles end. `abandoned` and `in_progress` are the
                // SAME player behaviour — leaving a board — and differ only
                // in whether the exit beacon survived (closing the whole
                // browser, rather than the tab, kills an in-flight beacon).
                // Labelled as one behaviour with a confidence split, and
                // totalled, so the split is never mistaken for two different
                // things players did. `failed` is genuinely different: the
                // Surge clock ran out.
                const leftMid = (ec.abandoned || 0) + (ec.in_progress || 0);
                html += '<div style="margin-top:8px;font-size:12px;color:var(--primary);">How puzzles end</div>';
                [['solved', 'Solved it', '#52B788'],
                 ['failed', 'Ran out of time', '#FFD93D'],
                 ['abandoned', 'Walked away (confirmed)', '#FF6B6B'],
                 ['in_progress', 'Walked away (beacon lost)', '#777']].forEach(([k, label, color]) => {
                    const n = ec[k] || 0;
                    const w = ecTotal > 0 ? (n / ecTotal * 100) : 0;
                    html += `<div class="chart-row">
                        <span class="chart-label" style="font-size:11px;">${label}</span>
                        <div class="chart-bar-bg"><div style="height:100%;width:${w.toFixed(1)}%;background:${color};opacity:0.6;"></div></div>
                        <span class="chart-count">${n} (${pctOf(n, ecTotal)})</span></div>`;
                });
                html += `<div style="font-size:11px;color:var(--text-dim);margin-top:4px;">
                    Walked away either way: <span style="color:#FF6B6B;">${leftMid} (${pctOf(leftMid, ecTotal)})</span>.
                    The two rows are the same act, split by whether the exit beacon survived —
                    a lost beacon leaves the duration as a lower bound.</div>`;

                // Duration histogram. Iterate the ORDERED label list from
                // the API, never Object.keys() — jsonify sorts dict keys and
                // would hand back "0-14s, 1-2m, 10m+, 15-29s…".
                const buckets = data.duration_buckets || [];
                const hist = t.duration_hist || {};
                const histTotal = buckets.reduce((s, b) => s + (hist[b] || 0), 0);
                if (histTotal > 0) {
                    html += '<div style="margin-top:8px;font-size:12px;color:var(--primary);">How long a puzzle takes</div>';
                    buckets.forEach(b => {
                        const n = hist[b] || 0;
                        const w = histTotal > 0 ? (n / histTotal * 100) : 0;
                        html += `<div class="chart-row">
                            <span class="chart-label" style="font-size:11px;">${escapeHtml(b)}</span>
                            <div class="chart-bar-bg"><div style="height:100%;width:${w.toFixed(1)}%;background:#00ff64;opacity:0.5;"></div></div>
                            <span class="chart-count">${n}</span></div>`;
                    });
                }

                // Per-mode split. The practice → Surge sequence is the whole
                // first-session bet, so seeing those two side by side with
                // Marathon and PotD is the fastest read on whether it works.
                const modes = data.mode_order || [];
                const ms = t.mode_split || {};
                const modeKeys = modes.filter(m => ms[m] && ms[m].puzzles)
                    .concat(Object.keys(ms).filter(m => modes.indexOf(m) < 0 && ms[m].puzzles));
                if (modeKeys.length) {
                    html += '<div style="margin-top:8px;font-size:12px;color:var(--primary);">By mode</div>'
                         +  '<table style="width:100%;border-collapse:collapse;font-size:11px;">'
                         +  '<tr style="color:var(--text-dim);"><th style="text-align:left;padding:2px;">Mode</th>'
                         +  '<th style="text-align:right;padding:2px;">Puzzles</th>'
                         +  '<th style="text-align:right;padding:2px;">Solved</th>'
                         +  '<th style="text-align:right;padding:2px;">Median</th></tr>';
                    modeKeys.forEach(m => {
                        const b = ms[m];
                        // Raw key in the title so the DB value is still reachable.
                        html += `<tr><td style="padding:2px;color:var(--text-dim);" title="${escapeHtml(m)}">${escapeHtml(modeLabel(m))}</td>
                            <td style="text-align:right;padding:2px;">${b.puzzles}</td>
                            <td style="text-align:right;padding:2px;">${b.solved} <span style="color:var(--text-dim);">(${b.pct_solved === null ? '—' : b.pct_solved + '%'})</span></td>
                            <td style="text-align:right;padding:2px;">${fmtSecs(b.median_seconds)}</td></tr>`;
                    });
                    html += '</table>';
                }

                // One-and-done. A short first puzzle followed by nothing is
                // the fingerprint of a board that read as impenetrable —
                // very different from a session that played several and
                // stopped.
                const oad = t.one_and_done || 0, multi = t.multi_puzzle || 0;
                const played = oad + multi;
                if (played > 0) {
                    html += `<div style="margin-top:8px;font-size:11px;color:var(--text-dim);">
                        One-and-done: <strong>${oad}</strong> of ${played} playing sessions (${pctOf(oad, played)}),
                        of which <strong>${t.one_and_done_short_first || 0}</strong> had a first puzzle under
                        ${data.short_first_puzzle_threshold_seconds || 30}s.</div>`;
                }

                // Controls discovery, over PLAYED sessions only — a visitor
                // who never opened a board obviously never rotated a tile,
                // and counting them would bury the signal under the bounce
                // rate. "Played but never rotated" is the controls-failure
                // fingerprint: rotation IS the game.
                const ps = t.played_sessions || 0;
                if (ps > 0) {
                    const ctl = t.controls || {};
                    const nr = t.never_rotated || 0;
                    html += `<div style="margin-top:6px;font-size:11px;color:var(--text-dim);">
                        Controls (of ${ps} playing sessions):
                        rotate <strong>${ctl.act_rot || 0}</strong> ·
                        lock <strong>${ctl.act_lock || 0}</strong> ·
                        hint <strong>${ctl.act_hint || 0}</strong> ·
                        mouse <strong>${ctl.src_mouse || 0}</strong> ·
                        touch <strong>${ctl.src_touch || 0}</strong>
                        <br><span style="color:${nr > ps * 0.2 ? '#FF6B6B' : 'var(--text-dim)'};">Never rotated: ${nr} (${pctOf(nr, ps)})</span>${
                            t.played_no_control_data ? ` · <span title="a client too old to report controls, or a session whose syncs never landed — NOT the same claim as &quot;never rotated&quot;">${t.played_no_control_data} sent no control data</span>` : ''}</div>`;
                }

                // Menu reach — the number this game learned about the hard
                // way (9.2% lifetime, which made everything behind the menu
                // invisible to 90% of players).
                if (t.sessions) {
                    html += `<div style="margin-top:6px;font-size:11px;color:var(--text-dim);">
                        Touched any menu surface: <strong>${t.touched_any_menu || 0}</strong> of ${t.sessions} (${pctOf(t.touched_any_menu || 0, t.sessions)})</div>`;
                }
                html += '</div>';
            });
            html += '</div>';
            out.innerHTML = html;
        }

        // ── Retention panel (forward cohorts) ──
        // GET /api/admin/retention. Of the browsers first seen on day D, how
        // many came back on D+1/3/7 — the direction the platforms grade, and
        // the OPPOSITE question from the Return Players Audit above (which
        // asks "of the browsers here today, how many had been here before").
        // Cohorts too young for a horizon are excluded from that horizon's
        // totals rather than counted as 0%.
        async function loadRetention() {
            const out = document.getElementById('visitRetention');
            if (!out) return;
            try {
                const res = await fetch(`${GAME_API_URL}/admin/retention?days=30&_=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const body = await res.text();
                let data = null;
                try { data = JSON.parse(body); } catch (_) { /* HTML error page */ }
                if (!res.ok || !data || !data.by_device) {
                    out.innerHTML = '<h3 style="margin-bottom:6px;color:var(--primary);">> Retention (D1 / D3 / D7)</h3>'
                        + `<div style="color:#888;padding:5px;">${res.status === 404
                            ? 'Endpoint not live yet — redeploy the back-end (GET /api/admin/retention).'
                            : 'Failed to load: ' + escapeHtml((data && data.error) || res.status)}</div>`;
                    return;
                }
                cachedRetention = data;
                renderRetention();
            } catch (e) {
                out.innerHTML = '<h3 style="margin-bottom:6px;color:var(--primary);">> Retention (D1 / D3 / D7)</h3>'
                    + `<div style="color:#888;padding:5px;">Network error: ${escapeHtml(e.message || e)}</div>`;
            }
        }

        function renderRetention() {
            const out = document.getElementById('visitRetention');
            if (!out || !cachedRetention) return;
            const data = cachedRetention;
            const horizons = data.horizons || [1, 3, 7];
            let html = '<h3 style="margin-bottom:6px;color:var(--primary);">> Retention (forward cohorts)</h3>';
            html += `<div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;">
                Of the browsers FIRST seen on a day, how many came back N days later. This is the direction a
                platform grades; the Return Players Audit above answers the backward question and is not comparable.
                <br>${escapeHtml(data.note || '')}</div>`;

            const devices = data.by_device || {};
            const order = ['all', 'desktop', 'phone', 'tablet', 'unknown'];
            const present = order.filter(k => devices[k]);
            if (!present.length) {
                out.innerHTML = html + '<div style="color:#666;padding:5px;">No cohorts yet.</div>';
                return;
            }

            // Totals per device first — the headline. Percentages are over
            // MATURE cohorts only, so D7 can legitimately quote a smaller
            // base than D1.
            html += '<table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px;">'
                 +  '<tr style="border-bottom:1px solid var(--primary);"><th style="text-align:left;padding:4px;">Device</th>'
                 +  horizons.map(h => `<th style="text-align:right;padding:4px;" title="returned at all / returned AND played, over mature cohorts">D${h}</th>`).join('')
                 +  '<th style="text-align:right;padding:4px;" title="came back on ANY later day, not just the horizon">Ever back</th></tr>';
            present.forEach(k => {
                const dev = devices[k];
                const totals = dev.totals || {};
                const everNum = (dev.cohorts || []).reduce((s, c) => s + (c.ever_returned || 0), 0);
                const everDen = (dev.cohorts || []).reduce((s, c) => s + (c.new_browsers || 0), 0);
                html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.1);">
                    <td style="padding:4px;color:var(--text-dim);">${k.toUpperCase()}</td>`;
                horizons.forEach(h => {
                    const t = totals['d' + h] || {};
                    const p = t.pct;
                    const color = p === null || p === undefined ? '#888' : (p >= 10 ? '#52B788' : p >= 3 ? '#FFD93D' : '#FF6B6B');
                    html += `<td style="text-align:right;padding:4px;color:${color};"
                        title="${t.returned || 0} of ${t.cohort_browsers || 0} browsers across ${t.mature_cohorts || 0} mature cohorts; ${t.returned_played || 0} of them played">
                        ${p === null || p === undefined ? '—' : p + '%'}
                        <span style="color:var(--text-dim);font-size:10px;">(${t.pct_played === null || t.pct_played === undefined ? '—' : t.pct_played + '%'} played)</span></td>`;
                });
                html += `<td style="text-align:right;padding:4px;">${pctOf(everNum, everDen)}</td></tr>`;
            });
            html += '</table>';

            // Per-day cohorts for ALL devices. Ineligible cells read "—"
            // rather than 0%, because tomorrow has not happened yet and a 0
            // there would drag every eyeball average down.
            const cohorts = (devices.all && devices.all.cohorts) || [];
            if (cohorts.length) {
                html += '<div style="font-size:11px;color:var(--text-dim);margin-bottom:4px;">Cohort days (all devices) — "—" means the horizon has not fully elapsed yet:</div>';
                html += '<table style="width:100%;border-collapse:collapse;font-size:11px;">'
                     +  '<tr style="color:var(--text-dim);"><th style="text-align:left;padding:2px;">First seen</th>'
                     +  '<th style="text-align:right;padding:2px;">New</th>'
                     +  horizons.map(h => `<th style="text-align:right;padding:2px;">D${h}</th>`).join('')
                     +  '<th style="text-align:right;padding:2px;">Ever</th></tr>';
                cohorts.forEach(c => {
                    html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.06);">
                        <td style="padding:2px;color:var(--text-dim);">${escapeHtml(c.day)}</td>
                        <td style="text-align:right;padding:2px;">${c.new_browsers}</td>`;
                    horizons.forEach(h => {
                        const cell = c['d' + h] || {};
                        html += `<td style="text-align:right;padding:2px;" title="${cell.returned || 0} returned, ${cell.returned_played || 0} played">${
                            cell.eligible ? (cell.pct === null ? '—' : cell.pct + '%') : '<span style="color:#555;">—</span>'}</td>`;
                    });
                    html += `<td style="text-align:right;padding:2px;">${c.ever_returned}</td></tr>`;
                });
                html += '</table>';
            }
            out.innerHTML = html;
        }

        // Per-stage tabbed breakdown panel — same pattern Tantro uses.
        // `data` shape: { visit: [...], start: [...], finish: [...], share: [...] }
        // where each list item has { count, [labelKey] }.
        function renderStagedBreakdown(elId, title, data, labelKey, colorMap, iconMap, group) {
            if (!data) { document.getElementById(elId).innerHTML = ''; return; }
            const stages = ['visit', 'start', 'finish', 'share'];
            const stageLabels = { visit: 'Visit', start: 'Start', finish: 'Finish', share: 'Share' };
            let html = `<h3 style="margin-bottom: 10px; color: var(--primary);">> ${title}</h3>`;
            html += `<div class="stage-tabs" data-group="${group}">`;
            stages.forEach((s, i) => {
                html += `<button class="stage-tab${i === 0 ? ' active' : ''}" data-stage="${s}" onclick="switchStage(this, '${group}')">${stageLabels[s]}</button>`;
            });
            html += '</div>';
            stages.forEach((stage, i) => {
                const items = data[stage] || [];
                const total = items.reduce((s, x) => s + x.count, 0);
                html += `<div class="stage-panel${i === 0 ? ' active' : ''}" data-group="${group}" data-stage="${stage}">`;
                if (items.length === 0) {
                    html += '<div style="color: #666; padding: 5px;">No data</div>';
                } else {
                    items.sort((a, b) => b.count - a.count);
                    items.forEach(item => {
                        const pct   = total > 0 ? (item.count / total * 100).toFixed(1) : '0.0';
                        const label = item[labelKey] || '';
                        const color = (colorMap && colorMap[label]) || '#888';
                        const icon  = (iconMap  && iconMap[label])  || '';
                        html += `<div class="chart-row">
                            <span class="chart-label">${icon} ${escapeHtml(label)}</span>
                            <div class="chart-bar-bg">
                                <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                            </div>
                            <span class="chart-count">${item.count} (${pct}%)</span>
                        </div>`;
                    });
                }
                html += '</div>';
            });
            document.getElementById(elId).innerHTML = html;
        }
        function switchStage(btn, group) {
            document.querySelectorAll(`.stage-tabs[data-group="${group}"] .stage-tab`).forEach(b => b.classList.remove('active'));
            document.querySelectorAll(`.stage-panel[data-group="${group}"]`).forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            const stage = btn.getAttribute('data-stage');
            document.querySelector(`.stage-panel[data-group="${group}"][data-stage="${stage}"]`).classList.add('active');
        }
        function renderDeviceBreakdown() {
            renderStagedBreakdown('visitDevices', 'Devices', cachedStats.device_breakdown, 'type',
                { desktop: '#0096ff', tablet: '#00ff64', phone: '#ffc800' },
                { desktop: '🖥️', tablet: '📱', phone: '📲' },
                'devices');
        }
        function renderOsBreakdown() {
            renderStagedBreakdown('visitOS', 'Operating Systems', cachedStats.os_breakdown, 'os',
                { Windows: '#0078d4', iOS: '#a2aaad', Android: '#3ddc84', macOS: '#555', Linux: '#f5a623', Other: '#888' },
                null,
                'os');
        }

        // Single-list horizontal bar chart — no per-stage tabs needed.
        function renderFlatBars(elId, title, list, labelKey, colorMap, iconMap) {
            if (!list || list.length === 0) {
                document.getElementById(elId).innerHTML =
                    `<h3 style="margin-bottom: 10px; color: var(--primary);">> ${title}</h3><div style="color: #666; padding: 5px;">No data</div>`;
                return;
            }
            const total = list.reduce((s, x) => s + x.count, 0);
            let html = `<h3 style="margin-bottom: 10px; color: var(--primary);">> ${title}</h3>`;
            list.forEach(item => {
                const pct   = total > 0 ? (item.count / total * 100).toFixed(1) : '0.0';
                const label = item[labelKey] || '';
                const color = (colorMap && colorMap[label]) || '#888';
                const icon  = (iconMap  && iconMap[label])  || '';
                html += `<div class="chart-row">
                    <span class="chart-label">${icon} ${escapeHtml(label)}</span>
                    <div class="chart-bar-bg">
                        <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                    </div>
                    <span class="chart-count">${item.count} (${pct}%)</span>
                </div>`;
            });
            document.getElementById(elId).innerHTML = html;
        }
        function renderShareBreakdown() {
            renderFlatBars('visitShares', 'Share Platforms', cachedStats.share_breakdown, 'platform',
                { twitter: '#1DA1F2', facebook: '#4267B2', reddit: '#FF4500', whatsapp: '#25D366', telegram: '#0088cc', copylink: '#888' },
                { twitter: '𝕏', facebook: 'f', reddit: '⬆', whatsapp: '💬', telegram: '✈', copylink: '🔗' });
        }
        // Share source — which surface a share came from. Window-aware
        // (re-rendered by setWindow). `|| 0` so the panel appears even before
        // the game back-end redeploys with these fields. The three counts are
        // independent visit-counts and CAN overlap (a visit that shared from
        // the popup AND a score card counts in both), so they're shown as raw
        // counts against the window's total_shared rather than a 100% pie.
        // Legacy shares (from before this tracking) sit in `Shared` but
        // none of these. The credits row needs BOTH the game back-end
        // (share_from_credits column) and front-end v0.66+ (kind='credits')
        // deployed; until then it just reads 0.
        function renderShareSource() {
            const el = document.getElementById('visitShareSource');
            if (!el || !cachedStats) return;
            const d = cachedStats;
            const isLifetime = currentWindow === 'lifetime';
            const suffix = '_' + currentWindow;
            const pick = (base) => isLifetime ? (d[base] || 0) : (d[base + suffix] || 0);
            const popup   = pick('shared_popup');
            const score   = pick('shared_score');
            const credits = pick('shared_credits');
            const total = isLifetime ? (d.total_shared || 0) : (d['shared' + suffix] || 0);
            const rows = [
                { label: '🎉 "Enjoying it?" popup',  count: popup,   color: '#00ff64' },
                { label: '🏁 Score / Solved card',   count: score,   color: '#3a7bd5' },
                { label: '🎬 Menu credits popup',    count: credits, color: '#b678ff' },
            ];
            const max = Math.max(1, popup, score, credits);
            let html = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Share Source</h3>';
            rows.forEach(r => {
                const w = (r.count / max * 100).toFixed(1);
                html += `<div class="chart-row">
                    <span class="chart-label" style="min-width: 175px;">${r.label}</span>
                    <div class="chart-bar-bg"><div style="height: 100%; width: ${w}%; background: ${r.color}; opacity: 0.6;"></div></div>
                    <span class="chart-count">${r.count}</span>
                </div>`;
            });
            el.innerHTML = html;
        }
        function renderCreditsBreakdown() {
            renderFlatBars('visitCredits', 'Credits Link Clicks', cachedStats.credits_breakdown, 'link', null, null);
        }
        // Solve audio context — % of puzzle solves with music / SFX audible.
        // Window-aware (re-rendered by setWindow). Two independent pairs
        // (music on/off, sfx on/off); each pair sums to 100% because every
        // solve increments exactly one counter per channel. `|| 0` so the
        // panel appears (all zeros) before the game back-end redeploys with
        // these fields; solves also need front-end v0.67+ to be reported.
        function renderSolveAudio() {
            const el = document.getElementById('visitSolveAudio');
            if (!el || !cachedStats) return;
            const d = cachedStats;
            const isLifetime = currentWindow === 'lifetime';
            const suffix = '_' + currentWindow;
            const pick = (base) => isLifetime ? (d[base] || 0) : (d[base + suffix] || 0);
            const mOn  = pick('solves_music_on'),  mOff = pick('solves_music_off');
            const sOn  = pick('solves_sfx_on'),    sOff = pick('solves_sfx_off');
            const mTot = mOn + mOff, sTot = sOn + sOff;
            const pc = (n, tot) => tot > 0 ? (n / tot * 100).toFixed(1) : '0.0';
            const rows = [
                { label: '🎵 Music on',  count: mOn,  pct: pc(mOn,  mTot), color: '#00ff64' },
                { label: '🔇 Music off', count: mOff, pct: pc(mOff, mTot), color: '#666'    },
                { label: '🔊 SFX on',    count: sOn,  pct: pc(sOn,  sTot), color: '#3a7bd5' },
                { label: '🔕 SFX off',   count: sOff, pct: pc(sOff, sTot), color: '#666'    },
            ];
            // Alternate-route solves (winning route ≠ designed solution) —
            // rides this panel because it shares the per-solve counter
            // denominator (mTot = every solve). Hidden until the back-end
            // redeploys with the field; counted since 2026-07-29, so
            // lifetime % only reflects post-deploy solves.
            if (d.solves_alternate !== undefined) {
                const alt = pick('solves_alternate');
                rows.push({ label: '🔀 Alternate route', count: alt, pct: pc(alt, mTot), color: '#ffaa00' });
            }
            let html = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Solve Audio + Routes</h3>';
            html += `<div style="font-size: 11px; color: var(--text-dim); margin-bottom: 8px;">Of <strong>${mTot}</strong> puzzle solves (${currentWindow}): music / SFX audibility at the solve, and how many won via a route other than the designed solution.</div>`;
            rows.forEach(r => {
                html += `<div class="chart-row">
                    <span class="chart-label" style="min-width: 175px;">${r.label}</span>
                    <div class="chart-bar-bg"><div style="height: 100%; width: ${r.pct}%; background: ${r.color}; opacity: 0.6;"></div></div>
                    <span class="chart-count">${r.count} (${r.pct}%)</span>
                </div>`;
            });
            el.innerHTML = html;
        }
        // ASPCA donation-link clicks. One link, so a headline count (not a
        // multi-row breakdown), shown even at 0 — mirrors the Tantro admin
        // page's panel so the two read identically. `|| 0` means the panel
        // appears as soon as THIS page deploys, even before the game
        // back-end redeploys with the total_donated field.
        function renderDonate() {
            const n = (cachedStats && cachedStats.total_donated) || 0;
            document.getElementById('visitDonate').innerHTML = `
                <h3 style="margin-bottom: 10px; color: var(--primary);">> ASPCA Donations</h3>
                <div class="chart-row">
                    <span class="chart-label" style="width: 150px; min-width: 150px;">🐾 Donate link clicks</span>
                    <div style="flex: 1;"></div>
                    <span class="chart-count">${n}</span>
                </div>`;
        }
        function renderModeBreakdown() {
            // Relabel for display only — see MODE_LABELS. The DB keys are
            // deliberately left alone; renaming those would orphan history.
            const modes = ((cachedStats && cachedStats.mode_breakdown) || []).map(m =>
                ({ ...m, mode: modeLabel(m.mode) }));
            renderFlatBars('visitModes', 'Modes Played', modes, 'mode',
                { Surge: '#ffaa00', 'Surge (1st run)': '#ffd27f',
                  PotD: '#00aaff', Zen: '#888' },
                { Surge: '⚡', 'Surge (1st run)': '⚡', PotD: '📅', Zen: '🧘' });
        }
        function renderGameTypeBreakdown() {
            renderFlatBars('visitGameTypes', 'Game Types Played', cachedStats.game_type_breakdown, 'gameType',
                // s1..s4 cool blues, q1..q4 warm oranges so singular vs
                // quad reads at a glance.
                { s1: '#3a7bd5', s2: '#3d8bdc', s3: '#4099e4', s4: '#43a8eb',
                  q1: '#f5852a', q2: '#f7913a', q3: '#f99e4a', q4: '#fbaa5a' },
                null);
        }

        // ── Live auto-refresh ──
        // Re-pull visit stats every 60s so the dashboard stays current
        // without a manual click. Started only once the admin gate has
        // passed (see checkAdmin). Pauses while the tab is backgrounded or
        // the user is mid-interaction, and restores the open funnel-stage
        // sub-tabs so the view doesn't snap back to "Visit" on each refresh.
        const AUTO_REFRESH_MS = 90000;
        let autoRefreshTimer = null;

        function startAutoRefresh() {
            if (autoRefreshTimer) return;
            autoRefreshTimer = setInterval(autoRefreshTick, AUTO_REFRESH_MS);
        }

        function userIsInteracting() {
            const el = document.activeElement;
            return !!el && ['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName);
        }

        // Capture/restore the open funnel stage per staged panel, keyed off
        // the currently-shown panel (reliable regardless of tab highlighting).
        function captureStageState() {
            const state = {};
            document.querySelectorAll('.stage-panel.active[data-group]').forEach(p => {
                state[p.getAttribute('data-group')] = p.getAttribute('data-stage');
            });
            return state;
        }
        function restoreStageState(state) {
            Object.keys(state).forEach(group => {
                const stage = state[group];
                const tabs = document.querySelector(`.stage-tabs[data-group="${group}"]`);
                if (tabs) tabs.querySelectorAll('.stage-tab').forEach(t =>
                    t.classList.toggle('active', t.getAttribute('data-stage') === stage));
                document.querySelectorAll(`.stage-panel[data-group="${group}"]`).forEach(p =>
                    p.classList.toggle('active', p.getAttribute('data-stage') === stage));
            });
        }

        async function autoRefreshTick() {
            if (document.hidden || userIsInteracting()) return;
            const stageState = captureStageState();
            await loadVisitStats();
            restoreStageState(stageState);
        }

        // Returning to a backgrounded tab refreshes right away rather than
        // waiting out the rest of the interval.
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && autoRefreshTimer) autoRefreshTick();
        });

        checkAdmin();
    </script>
</body>
</html>
