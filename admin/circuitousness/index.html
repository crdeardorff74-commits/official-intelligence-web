<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuitousness Admin - Official Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Cards were sized for a page with far fewer of them (2026-08-28).
           Press Start 2P is a chunky pixel face, so it still reads as the
           dominant element well below the original 16px — and the value is
           usually 1–4 characters, which does not need the room. The 1.8
           line-height cost the most: the start/finish/share card wraps to
           three lines, so it was paying that gap twice for nothing.
           Relative units per universal rule 2; the 1px border is the
           hairline exception. */
        .stat-card {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid var(--primary);
            padding: 0.5rem 0.6rem;
            text-align: center;
        }
        .stat-value {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.75rem;
            color: var(--primary);
            margin-bottom: 0.25rem;
            line-height: 1.4;
        }
        .stat-label {
            font-size: 0.625rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }
        .chart-row {
            margin: 6px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-label {
            min-width: 130px;
            white-space: nowrap;
            color: var(--text-dim);
        }
        .chart-bar-bg {
            flex: 1;
            height: 16px;
            background: rgba(255, 255, 255, 0.05);
        }
        .chart-count {
            min-width: 110px;
            text-align: right;
            color: var(--text-dim);
            white-space: nowrap;
        }
        /* Full-width override — mirrors Tantro admin page so the funnel
           charts have room to breathe. */
        main { max-width: 100% !important; width: 100% !important; padding: 1vw 2vw !important; box-sizing: border-box; }
        .visits-two-col {
            display: flex;
            gap: 2vw;
            margin-top: 20px;
        }
        /* 45:55 split (user call 2026-07-29 — the right column carries the
           denser panels). flex-grow ratios over a 0 basis divide the space
           left after the 2vw gap exactly 45/55; the ≤1200px media query
           still stacks them full-width. */
        .visits-left {
            flex: 45 1 0;
            min-width: 0;
        }
        .visits-right {
            flex: 55 1 0;
            min-width: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-content: start;
        }
        .visits-right > div { min-width: 0; }
        @media (max-width: 1200px) {
            .visits-two-col { flex-direction: column; }
        }
        @media (max-width: 768px) {
            .visits-right { grid-template-columns: 1fr; }
        }
        /* Per-stage tab switcher inside the device / OS panels. Same
           styling as Tantro's so the two admin pages feel related. */
        .stage-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
        }
        .stage-tab {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 4px 10px;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            cursor: pointer;
            opacity: 0.5;
        }
        .stage-tab.active {
            opacity: 1;
            background: rgba(0, 255, 0, 0.15);
        }
        .stage-panel { display: none; }
        .stage-panel.active { display: block; }
        .window-tabs {
            display: flex;
            gap: 8px;
            margin: 15px 0;
        }
        .window-tab {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 14px;
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;
            cursor: pointer;
            opacity: 0.5;
        }
        .window-tab.active {
            opacity: 1;
            background: rgba(0, 255, 0, 0.15);
        }
    </style>
</head>
<body>
    <main>
        <div class="admin-header" style="display: flex; align-items: center; gap: 20px;">
            <h1 style="margin: 0;">> CIRCUITOUSNESS ADMIN</h1>
            <div style="display: flex; gap: 10px; margin-left: auto;">
                <button id="adminRefresh" class="btn btn-primary" style="display: none;" onclick="loadVisitStats()">🔄 REFRESH</button>
                <!-- Mosaic difficulty-calibration corpus (mosaic_solves) as a
                     JSON file — one row per solved designed-mosaic test play;
                     plot movesOverFloor against score to find where the
                     difficulty formula bends. Same admin JWT as everything
                     else on this page. -->
                <button id="mosaicSolvesBtn" class="btn btn-primary" style="display: none;" onclick="downloadMosaicSolves()">⬇ MOSAIC SOLVES</button>
                <a href="/admin/" class="btn btn-primary">← ADMIN HUB</a>
                <a href="/" class="btn btn-primary">← BACK TO SITE</a>
            </div>
        </div>

        <div id="message"></div>

        <div id="notAdmin" class="not-admin" style="display: none;">
            <h2 class="section-header">ACCESS DENIED</h2>
            <p style="margin-top: 20px;">Admin privileges required.</p>
            <a href="/" class="btn btn-primary" style="margin-top: 20px; display: inline-block;">RETURN HOME</a>
        </div>

        <div id="adminContent" style="display: none;">
            <!-- Window picker — lifetime / 24h / 7d / 30d. Re-renders the
                 summary stats cards (the daily chart + breakdowns stay
                 lifetime since they're inherently time-scoped anyway). -->
            <div class="window-tabs">
                <button class="window-tab active" data-window="lifetime" onclick="setWindow(this, 'lifetime')">LIFETIME</button>
                <button class="window-tab"        data-window="24h"      onclick="setWindow(this, '24h')">LAST 24H</button>
                <button class="window-tab"        data-window="7d"       onclick="setWindow(this, '7d')">LAST 7D</button>
                <button class="window-tab"        data-window="30d"      onclick="setWindow(this, '30d')">LAST 30D</button>
                <!-- Show/hide toggle for the On-site Intro Funnel panel.
                     Sticky per-browser (localStorage); label/active state
                     set by applyFunnelToggle() on load. -->
                <button class="window-tab" id="funnelToggle" style="margin-left: auto;" onclick="toggleFunnel()">INTRO FUNNEL</button>
            </div>

            <div class="visits-two-col">
                <div class="visits-left">
                    <div id="visitStats"><div class="loading">Loading visit stats...</div></div>
                    <div id="visitChart"      style="margin-top: 20px;"></div>
                    <div id="visitRecent"     style="margin-top: 20px;"></div>
                    <div id="visitReferrers"  style="margin-top: 20px;"></div>
                    <div id="visitCampaigns"  style="margin-top: 20px;"></div>
                    <div id="visitLanguages"  style="margin-top: 20px;"></div>
                </div>
                <div class="visits-right">
                    <!-- Intro funnel leads the right column (moved from the
                         left 2026-07-23 — it's the intro-restyle verdict
                         panel, so it earns the top slot). display:none is
                         the pre-deploy default; renderOnsiteFunnel un-hides
                         it once the API sends the onsite_* fields. -->
                    <div id="visitOnsite" style="grid-column: 1 / -1; display: none;"></div>
                    <div id="visitReturning" style="grid-column: 1 / -1;">
                        <h3 style="margin-bottom: 6px; color: var(--primary);">> Return Players Audit</h3>
                        <div style="margin-bottom:10px;">
                            <button class="btn btn-primary" style="font-size:9px;padding:2px 12px;" onclick="stepReturning(-1)" title="Previous day" aria-label="Previous day">◀</button>
                            <input type="date" id="returningDate"
                                style="background:#000;color:var(--primary);border:1px solid var(--primary);font-family:'VT323',monospace;font-size:14px;padding:2px 6px;"
                                onchange="loadReturning()">
                            <button class="btn btn-primary" style="font-size:9px;padding:2px 12px;" onclick="stepReturning(1)" title="Next day" aria-label="Next day">▶</button>
                        </div>
                        <div id="returningResults"><div class="loading">Loading return-player audit...</div></div>
                    </div>
                    <!-- First-time-player funnel — the per-NEW-player stats
                         (one row per browser whose FIRST visit post-dates the
                         2026-07-28 feature deploy; fed by first_run_stats).
                         display:none until its separate fetch succeeds, so a
                         pre-deploy back-end just leaves the panel absent. -->
                    <div id="visitFirstRun" style="grid-column: 1 / -1; display: none;"></div>
                    <!-- Engagement (playtime / per-puzzle outcome /
                         abandonment) and Retention (forward D1/D3/D7
                         cohorts), both added 2026-08-07. Engagement follows
                         the tab picker above (re-fetching, since it
                         aggregates server-side); Retention keeps its own
                         picker because it windows by cohort day. Both stay
                         empty until the instrumented front-end build is
                         deployed and played. -->
                    <div id="visitEngagement" style="grid-column: 1 / -1;"></div>
                    <div id="visitRetention" style="grid-column: 1 / -1;"></div>
                    <div id="visitDevices"></div>
                    <div id="visitOS"></div>
                    <div id="visitShares"></div>
                    <div id="visitShareSource"></div>
                    <div id="visitCredits"></div>
                    <div id="visitDonate"></div>
                    <div id="visitModes"></div>
                    <div id="visitGameTypes"></div>
                    <div id="visitSolveAudio"></div>
                    <div id="visitSolves"></div>
                    <div id="visitPlays"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Two API bases:
        //   API_URL      → central OI auth (issues + validates JWTs)
        //   GAME_API_URL → Circuitousness's own back-end (this page's data)
        const API_URL      = 'https://official-intelligence-api.onrender.com';
        const GAME_API_URL = 'https://circuitousness-api.onrender.com/api';
        const token        = localStorage.getItem('oi_token');
        let cachedStats    = null;
        let cachedFirstRun = null;
        // Engagement and Retention each own their query window, so unlike
        // the others these caches exist only to re-render without a
        // re-fetch (window-button clicks re-fetch deliberately).
        let cachedEngagement = null;
        let cachedRetention  = null;
        let currentWindow  = 'lifetime';

        // ── On-site Intro Funnel show/hide toggle ──
        // Sticky per-browser. renderOnsiteFunnel consults funnelHidden, so
        // the panel stays hidden across window-tab switches and the
        // auto-refresh re-renders alike.
        const FUNNEL_HIDE_KEY = 'circ_admin_hideIntroFunnel';
        let funnelHidden = (function () {
            try { return localStorage.getItem(FUNNEL_HIDE_KEY) === '1'; }
            catch (e) { return false; }
        })();
        function applyFunnelToggle() {
            const btn = document.getElementById('funnelToggle');
            if (btn) {
                btn.classList.toggle('active', !funnelHidden);
                btn.textContent = funnelHidden ? 'INTRO FUNNEL: HIDDEN' : 'INTRO FUNNEL: SHOWN';
            }
            renderOnsiteFunnel();
        }
        function toggleFunnel() {
            funnelHidden = !funnelHidden;
            try {
                if (funnelHidden) localStorage.setItem(FUNNEL_HIDE_KEY, '1');
                else localStorage.removeItem(FUNNEL_HIDE_KEY);
            } catch (e) {}
            applyFunnelToggle();
        }
        // Initialize the toggle button's label/active state from the
        // persisted preference (script runs at end of body, DOM is ready;
        // renderOnsiteFunnel inside no-ops until stats arrive).
        applyFunnelToggle();

        function escapeHtml(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ── Mode keys → the names players actually see ───────────────────
        //
        // The DB keys are NOT the in-game names, and two of them are easy to
        // misread (which is how this map came to exist, 2026-08-28):
        //
        //   practice  → Zen. What the mode is called in-game (🧘 mode.practice.name).
        //               Covers BOTH menu-started Zen and the first-run ladder.
        //   surge     → Surge, specifically the run started from the
        //               first-session pitch — the thing the 2026-08-06
        //               redesign is betting on.
        //   marathon  → Surge as well, but any LATER voluntary run.
        //   potd      → PotD.
        //
        // ⚠ `surge` and `marathon` are the same GAMEPLAY under two keys, and
        // the split is deliberate, not legacy drift (see marathon.js
        // pendingPuzzleMeta). Do not merge them here: first-run vs voluntary
        // is exactly the number the redesign is judged on. They are collapsed
        // to one badge in the return audit, where the distinction does not
        // matter — that is a separate, deliberate choice.
        const MODE_LABELS = {
            practice: 'Zen',
            zen:      'Zen',      // defensive: models.py lists it as possible
            surge:    'Surge (1st run)',
            marathon: 'Surge',
            potd:     'PotD',
        };
        // Unknown keys pass through unchanged rather than becoming 'Unknown' —
        // a new mode should be visible as itself, not swallowed.
        function modeLabel(key) {
            return MODE_LABELS[key] || key;
        }

        // The Player cell, shared by the Recent Visits and Returning Players
        // tables (both are lists of browsers, so both take the same column).
        // `player` is the most recent NON-Anonymous name that browser's
        // session_id ever submitted a score under, on either board -- the only
        // human-readable identity an accountless game has. Three things it is
        // NOT: (a) per-visit -- the name is resolved from the browser, so it
        // back-labels every row that browser ever wrote, including loads from
        // before the name existed; (b) cross-device -- one human on phone +
        // desktop is two session_ids, so their second device reads blank until
        // it submits from there too; (c) proof of identity -- anyone can type
        // any handle. Blank is the normal state: most browsers never submit.
        function playerTag(r) {
            if (!r || !r.player) return '<span style="color:var(--text-dim);">—</span>';
            const title = `Leaderboard handle for this browser: ${r.player}`
                        + ` (matched on session_id — applies to all of this browser's rows)`;
            return `<span style="color:var(--text-tertiary);" title="${escapeHtml(title)}">${escapeHtml(r.player)}</span>`;
        }

        // ── User-Agent, compacted ────────────────────────────────────────
        // Mirrors the back end's BOT_UA_PATTERNS (app.py) deliberately —
        // if that tuple gains an entry, add it here too.
        const UA_BOT_PATTERNS = [
            'bot', 'crawl', 'spider', 'slurp', 'feed', 'fetch', 'scrape',
            'lighthouse', 'pagespeed', 'headless', 'phantom', 'selenium',
            'puppeteer', 'playwright', 'wget', 'curl', 'python-requests',
            'go-http-client', 'java/', 'apache-http', 'node-fetch', 'axios',
        ];
        // Most specific product first. Edge, the iOS Chrome/Firefox wrappers
        // and Samsung's browser all carry 'Chrome' and/or 'Safari' tokens of
        // their own, so a naive scan labels every one of them 'Chrome'.
        const UA_PRODUCTS = [
            [/\bEdgi?O?S?A?\/([\d.]+)/,      'Edge'],
            [/\bOPR\/([\d.]+)/,              'Opera'],
            [/\bSamsungBrowser\/([\d.]+)/,   'Samsung'],
            [/\bCriOS\/([\d.]+)/,            'Chrome'],
            [/\bFxiOS\/([\d.]+)/,            'Firefox'],
            [/\bFirefox\/([\d.]+)/,          'Firefox'],
            [/\bChrome\/([\d.]+)/,           'Chrome'],
            [/\bVersion\/([\d.]+).*\bSafari/, 'Safari'],
        ];

        // Compact signature for the User-Agent column: 'Safari 18.7',
        // 'Chrome 137'.
        //
        // The raw string is ~130 characters, the first ~40 of which are
        // boilerplate the Device/OS column already reports, and the cell is
        // nowrap — so it was setting the width of the entire table. Plain
        // truncation is not the fix: 30 characters of a real UA is
        // 'Mozilla/5.0 (Windows NT 10.0; W', which is all prefix and no
        // information. The full string stays in the cell's title, so nothing
        // is actually lost.
        //
        // A bot UA is flagged in amber instead, showing the OFFENDING TOKEN
        // rather than the head of the string. Bots are rejected at
        // POST /api/visit and never create rows, so one appearing here means
        // the filter missed it — being able to see that is the column's whole
        // reason to exist as a backstop, and folding it into a tidy
        // 'Chrome 137' would hide the thing worth catching.
        //
        // Showing the token matters more than it looks: a headless-Chrome UA
        // begins 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36…' and
        // does not reach 'HeadlessChrome' until character 79, so any
        // head-truncated view of it is indistinguishable from a normal
        // desktop visit — the exact confusion the flag exists to prevent.
        //
        // Anything unrecognized falls back to truncated raw text rather than
        // a confident wrong label.
        function uaLabel(ua) {
            const raw = String(ua || '');
            if (!raw) return '<span style="color:#444;">?</span>';
            const lower = raw.toLowerCase();
            const hit = UA_BOT_PATTERNS.find(p => lower.indexOf(p) !== -1);
            if (hit) {
                // Widen the match out to its whole product token, so 'bot'
                // reads as 'Googlebot/2.1' and 'headless' as
                // 'HeadlessChrome/120.0.0.0'. Token bounded the way UAs
                // separate products: whitespace, parens, semicolons, commas.
                const at = lower.indexOf(hit);
                let s = at, e = at + hit.length;
                while (s > 0 && !/[\s(),;]/.test(raw[s - 1])) s--;
                while (e < raw.length && !/[\s(),;]/.test(raw[e])) e++;
                let token = raw.slice(s, e);
                if (token.length > 32) token = token.slice(0, 32) + '…';
                const why = escapeHtml(raw) + '\n\nMatches the back end&apos;s bot filter on &apos;'
                          + escapeHtml(hit) + '&apos; — a bot UA should never have created a row, '
                          + 'so this one got past POST /api/visit.';
                return `<span style="color:#ffaa00;" title="${why}">⚠ ${escapeHtml(token)}</span>`;
            }
            for (const [re, name] of UA_PRODUCTS) {
                const m = re.exec(raw);
                if (!m) continue;
                // First two version segments, minus a pointless trailing .0:
                // Chrome/137.0.0.0 -> '137', Safari Version/18.7 -> '18.7'.
                const parts = m[1].split('.');
                const ver = (parts[1] && parts[1] !== '0')
                    ? parts[0] + '.' + parts[1]
                    : parts[0];
                return escapeHtml(name + ' ' + ver);
            }
            return escapeHtml(raw.length > 24 ? raw.slice(0, 24) + '…' : raw);
        }

        // ── Auth gate ──
        // OI's central auth API authoritatively says whether this token's
        // user is an admin. The game back-end ALSO verifies the same token
        // on /admin/visits/stats with the same SECRET_KEY (it has its own
        // User row with is_admin=true that the token's user_id resolves to),
        // so the actual stats fetch double-checks.
        async function checkAdmin() {
            if (!token) {
                document.getElementById('notAdmin').style.display = 'block';
                return;
            }
            try {
                const res  = await fetch(`${API_URL}/auth/me`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (data.user && data.user.is_admin) {
                    document.getElementById('adminContent').style.display = 'block';
                    document.getElementById('adminRefresh').style.display = '';
                    document.getElementById('mosaicSolvesBtn').style.display = '';
                    loadVisitStats();
                    startAutoRefresh();
                } else {
                    document.getElementById('notAdmin').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('notAdmin').style.display = 'block';
            }
        }

        // ⬇ MOSAIC SOLVES — pull the whole difficulty-calibration corpus
        // (GET /admin/mosaic/solves: one row per solved designed-mosaic
        // test play, prediction + actual + movesOverFloor) and save it as
        // a dated JSON file. Client-side Blob download rather than a link
        // straight at the endpoint, because the admin JWT rides an
        // Authorization header and a plain <a href> can't send one. The
        // button doubles as its own status readout — row count on
        // success, FAILED on error — so no layout is disturbed.
        async function downloadMosaicSolves() {
            const btn = document.getElementById('mosaicSolvesBtn');
            const label = btn.textContent;
            btn.disabled = true;
            btn.textContent = '… FETCHING';
            try {
                const res = await fetch(`${GAME_API_URL}/admin/mosaic/solves?_=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
                const blob = new Blob([JSON.stringify(data, null, 2)],
                                      { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'mosaic_solves-' + new Date().toISOString().slice(0, 10) + '.json';
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 5000);
                btn.textContent = '⬇ ' + data.count + ' ROWS';
            } catch (err) {
                console.error('mosaic solves download failed', err);
                btn.textContent = '✖ FAILED';
            } finally {
                btn.disabled = false;
                setTimeout(() => { btn.textContent = label; }, 2500);
            }
        }

        async function loadVisitStats() {
            try {
                const res = await fetch(`${GAME_API_URL}/admin/visits/stats?_=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (!res.ok) {
                    document.getElementById('visitStats').innerHTML =
                        '<div style="color: #f55;">Failed to load: ' + escapeHtml(data.error || res.status) + '</div>';
                    return;
                }
                cachedStats = data;
                renderSummary();
                renderOnsiteFunnel();
                // "Puzzles Solved" counts real per-puzzle solves (from the
                // per-solve audio counters, collected since the 2026-07-02
                // API deploy). "Games Started" buckets game_type entries —
                // one per RUN in Marathon/Zen (a 10-puzzle run = 1), one
                // per daily puzzle in PotD; it was mislabeled "Puzzles per
                // Session" until 2026-07-16.
                renderPlaysPerSession('visitSolves', 'Puzzles Solved per Session', cachedStats.solves_per_session, 'puzzle');
                renderPlaysPerSession('visitPlays', 'Games Started per Session', cachedStats.plays_per_session, 'game');
                renderDailyChart();
                renderTopReferrers();
                renderCampaigns();
                renderTopLanguages();
                renderRecentVisits();
                renderDeviceBreakdown();
                renderOsBreakdown();
                renderShareBreakdown();
                renderShareSource();
                renderCreditsBreakdown();
                renderDonate();
                renderModeBreakdown();
                renderGameTypeBreakdown();
                renderSolveAudio();
            } catch (e) {
                document.getElementById('visitStats').innerHTML =
                    '<div style="color: #f55;">Network error: ' + escapeHtml(e.message || e) + '</div>';
            } finally {
                // Return-players audit is a separate, date-scoped fetch; run it
                // on every stats load (initial + auto-refresh) so it stays
                // current. Independent of the window tabs above.
                loadReturning();
                // First-time-player funnel is its own endpoint too — refresh
                // it on the same cadence.
                loadFirstRunStats();
                // Engagement follows the window tabs but aggregates
                // server-side, and Retention scopes by cohort day, so both
                // must RE-FETCH rather than re-render off cachedStats.
                loadEngagement();
                loadRetention();
            }
        }

        function setWindow(btn, win) {
            document.querySelectorAll('.window-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentWindow = win;
            if (cachedStats) { renderSummary(); renderOnsiteFunnel(); renderShareSource(); renderSolveAudio(); }
            if (cachedFirstRun) renderFirstRun();
            // Engagement aggregates server-side, so a tab change has to
            // RE-FETCH — there is no windowed field on cachedEngagement to
            // re-render from. Retention is deliberately NOT here: it scopes
            // by cohort day and still owns its own picker.
            loadEngagement();
        }

        function renderSummary() {
            if (!cachedStats) return;
            // Lifetime fields have no suffix; rolling windows are *_24h / *_7d / *_30d.
            const d = cachedStats;
            const isLifetime = currentWindow === 'lifetime';
            const suffix = '_' + currentWindow;
            const v  = isLifetime ? d.total_visits   : d['visits'   + suffix];
            const se = isLifetime ? d.total_sessions : d['sessions' + suffix];
            const st = isLifetime ? d.total_started  : d['started'  + suffix];
            const fi = isLifetime ? d.total_finished : d['finished' + suffix];
            const sh = isLifetime ? d.total_shared   : d['shared'   + suffix];
            // Unique-browser (deduped) started/finished — the per-person count,
            // shown as a sub-line under the per-visit Started/Finished numbers.
            // undefined until the back-end redeploys with the *_uniq fields.
            const stu = isLifetime ? d.total_started_uniq  : d['started_uniq'  + suffix];
            const fiu = isLifetime ? d.total_finished_uniq : d['finished_uniq' + suffix];
            const subBrowsers = (n) => n === undefined ? '' :
                `<div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${n} browser${n===1?'':'s'}</div>`;
            const fr = isLifetime ? d.finish_rate    : d['finish_rate' + suffix];
            const shr= isLifetime ? d.share_rate     : d['share_rate'  + suffix];
            // visit→start, collapsing the intermediate menu stage. The summary
            // cards count ALL visits (including embed loads that platform-
            // redirect.js diverts before the intro), so the visit→menu and
            // menu→start splits live in the On-site Intro Funnel panel below,
            // where they're measured against on-site visits only.
            const sr = isLifetime ? d.start_rate : d['start_rate' + suffix];
            // One combined funnel-chain rate card. Each % is the conversion
            // from the previous stage: visits →(sr)→ start →(fr)→ finish
            // →(shr)→ share.
            document.getElementById('visitStats').innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px;">
                    <div class="stat-card"><div class="stat-value">${v}</div><div class="stat-label">Visits</div><div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${se} session${se===1?'':'s'}</div></div>
                    <div class="stat-card"><div class="stat-value">${st}</div><div class="stat-label">Started</div>${subBrowsers(stu)}</div>
                    <div class="stat-card"><div class="stat-value">${fi}</div><div class="stat-label">Finished</div>${subBrowsers(fiu)}</div>
                    <div class="stat-card"><div class="stat-value">${sh}</div><div class="stat-label">Shared</div></div>
                    <div class="stat-card">
                        <div class="stat-value">${sr}% <span style="white-space:nowrap;">→&nbsp;${fr}%</span> <span style="white-space:nowrap;">→&nbsp;${shr}%</span></div>
                        <div class="stat-label">Start / Finish / Share</div>
                    </div>
                </div>`;
        }

        // On-site intro funnel — the trustworthy version. The summary cards
        // above count ALL visits, including itch-embed mobile loads that
        // platform-redirect.js diverts BEFORE the intro (a handoff, not a
        // rejection). This panel isolates own-origin traffic so the
        // intro-bounce read is real, and shows how much volume is embed
        // handoff noise. Follows the LIFETIME/24H/7D/30D window tabs once
        // the back-end sends the windowed onsite_* fields (falls back to
        // lifetime figures pre-deploy — added so intro-screen changes are
        // measurable instead of drowning in lifetime history).
        function renderOnsiteFunnel() {
            const el = document.getElementById('visitOnsite');
            if (!el) return;
            // Admin toggle wins over everything: when hidden, the panel
            // stays dark even though the API sends the onsite_* fields.
            if (funnelHidden) {
                el.style.display = 'none';
                return;
            }
            if (!cachedStats) return;
            const d = cachedStats;
            // The container ships display:none inline; un-hide only once the
            // back-end actually sends the onsite_* fields. (This flip was
            // missing for a while — the panel rendered its HTML into a
            // hidden div, which read as "funnel stats suppressed".)
            if (d.onsite_visits === undefined) {
                el.innerHTML = '';
                el.style.display = 'none';
                return;
            }
            el.style.display = '';
            // Window-aware field picks. hasWin guards the pre-deploy window
            // where only lifetime fields exist — the panel then shows
            // lifetime numbers regardless of the selected tab, labeled so.
            const isLifetime = currentWindow === 'lifetime';
            const suffix     = '_' + currentWindow;
            const hasWin     = d.onsite_visits_7d !== undefined;
            const winLive    = !isLifetime && hasWin;
            const pick       = (base) => winLive ? (d[base + suffix] || 0) : (d[base] || 0);
            const winLabel   = winLive ? ('last ' + currentWindow) : 'lifetime';

            const onsite = pick('onsite_visits');
            const agreed = pick('onsite_agreed');
            const bounce = onsite - agreed;
            const rate   = pick('onsite_agree_rate');
            const emb    = d.total_embedded || 0;
            const red    = d.total_redirected || 0;

            // Deduped per-browser figures (the trustworthy ones). Undefined
            // until the back-end redeploys with onsite_uniq_* — fall back to
            // the per-load-only layout in that window.
            const hasUniq = d.onsite_uniq_visitors !== undefined;
            const uVis    = pick('onsite_uniq_visitors');
            const uAgr    = pick('onsite_uniq_agreed');
            const uBnc    = uVis - uAgr;
            const uRate   = pick('onsite_uniq_agree_rate');

            const intro = `
                <h3 style="margin-bottom: 6px; color: var(--primary);">> On-site Intro Funnel</h3>
                <div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;">
                    Own-origin traffic only (<strong>${winLabel}</strong>). Embed loads — itch, CrazyGames, etc. (<strong>${emb}</strong>, of which <strong>${red}</strong> were itch mobile redirect handoffs; lifetime counts) — are excluded.
                </div>`;

            // Per-browser (deduped) — the headline. A browser counts as
            // "reached menu" if it dismissed the intro on ANY load, so an
            // engaged player's relaunches no longer read as fresh bounces.
            const uniqBlock = hasUniq ? `
                <div style="font-size:11px;color:var(--primary);margin:4px 0 6px;">Per browser (deduped — the real intro-rejection rate)</div>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:15px;margin-bottom:14px;">
                    <div class="stat-card"><div class="stat-value">${uVis}</div><div class="stat-label">Browsers</div></div>
                    <div class="stat-card"><div class="stat-value">${uAgr}</div><div class="stat-label">Reached menu</div><div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${uRate}%</div></div>
                    <div class="stat-card"><div class="stat-value">${uBnc}</div><div class="stat-label">Left at intro</div></div>
                </div>` : '';

            // Per page-load (raw rows) — kept for comparison. Counts every
            // reload/PWA-relaunch, each of which re-shows the intro, so this
            // over-counts bounces vs the per-browser block above.
            const loadHeader = hasUniq
                ? `<div style="font-size:11px;color:var(--text-dim);margin:4px 0 6px;">Per page-load (counts every reload / relaunch)</div>`
                : '';
            const loadBlock = `
                ${loadHeader}
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:15px;">
                    <div class="stat-card"><div class="stat-value">${onsite}</div><div class="stat-label">On-site loads</div></div>
                    <div class="stat-card"><div class="stat-value">${agreed}</div><div class="stat-label">Reached menu</div><div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${rate}%</div></div>
                    <div class="stat-card"><div class="stat-value">${bounce}</div><div class="stat-label">Left at intro</div></div>
                </div>`;

            el.innerHTML = intro + uniqBlock + loadBlock;
        }

        // Per-session distribution renderer (1/2/3/4/5+), shared by the
        // "Puzzles Solved" and "Games Started" panels. Each bucket's bar
        // width and trailing (x%) are its share of all sessions with >=1
        // of the counted thing, so the column sums to 100%. One page-load
        // session = one "player" (the visit id isn't persisted across
        // reloads), so both read as per-sitting distributions.
        function renderPlaysPerSession(elId, title, list, noun) {
            const el = document.getElementById(elId);
            if (!el) return;
            if (!list || list.length === 0) {
                el.innerHTML = `<h3 style="margin-bottom: 10px; color: var(--primary);">> ${title}</h3><div style="color: #666; padding: 5px;">No data</div>`;
                return;
            }
            const total  = list.reduce((s, x) => s + x.count, 0);
            const colors = { '1': '#777', '2': '#3a7bd5', '3': '#40c4d4', '4': '#00ff64', '5+': '#ffaa00' };
            let html = `<h3 style="margin-bottom: 10px; color: var(--primary);">> ${title}</h3>`;
            list.forEach(item => {
                const pct   = total > 0 ? (item.count / total * 100).toFixed(1) : '0.0';
                const label = item.plays === '5+' ? `5+ ${noun}s` : `${item.plays} ${item.plays === '1' ? noun : noun + 's'}`;
                const color = colors[item.plays] || '#888';
                html += `<div class="chart-row">
                    <span class="chart-label">${label}</span>
                    <div class="chart-bar-bg">
                        <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                    </div>
                    <span class="chart-count">${item.count} (${pct}%)</span>
                </div>`;
            });
            el.innerHTML = html;
        }

        // Stacked horizontal bars per day, last 30 days. Same color
        // palette + ordering as Tantro's admin page so the visual reads
        // the same when you switch between projects.
        function renderDailyChart() {
            // API returns up to 30 days ascending; show only the newest 14.
            const days = ((cachedStats && cachedStats.daily_visits) || []).slice(-14);
            if (days.length === 0) {
                document.getElementById('visitChart').innerHTML = '';
                return;
            }
            const maxVisits = Math.max(...days.map(d => d.visits));
            const bw = maxVisits > 0 ? 100 / maxVisits : 0;
            let html = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Daily Visits (14 days)</h3>';
            html += '<div style="font-family: monospace; font-size: 12px;">';
            // Most-recent day on top (the API returns ascending by date).
            [...days].reverse().forEach(d => {
                const date = d.day.substring(5);
                html += `<div style="margin: 0.1rem 0; display: flex; align-items: center; gap: 8px;">
                    <span style="width: 50px; color: var(--text-dim);">${date}</span>
                    <div style="flex: 1; position: relative; height: 0.75rem; background: rgba(255,255,255,0.05);">
                        <div style="position: absolute; height: 100%; width: ${Math.round(d.visits   * bw)}%; background: rgba(0,150,255,0.4);"></div>
                        <div style="position: absolute; height: 100%; width: ${Math.round(d.started  * bw)}%; background: rgba(255,200,0,0.5);"></div>
                        <div style="position: absolute; height: 100%; width: ${Math.round(d.finished * bw)}%; background: rgba(255,80,80,0.6);"></div>
                        <div style="position: absolute; height: 100%; width: ${Math.round((d.shared || 0) * bw)}%; background: rgba(180,80,255,0.6);"></div>
                    </div>
                    <span style="width: 140px; text-align: right; color: var(--text-dim);">${d.visits}/${d.started}/${d.finished}/${d.shared || 0}</span>
                </div>`;
            });
            html += '</div>';
            html += '<div style="margin-top: 5px; font-size: 11px; color: var(--text-dim);">';
            html += '<span style="color: rgba(0,150,255,0.7);">■</span> Visits &nbsp; ';
            html += '<span style="color: rgba(255,200,0,0.8);">■</span> Started &nbsp; ';
            html += '<span style="color: rgba(255,80,80,0.8);">■</span> Finished &nbsp; ';
            html += '<span style="color: rgba(180,80,255,0.8);">■</span> Shared';
            html += '</div>';
            document.getElementById('visitChart').innerHTML = html;
        }

        function renderTopList(elId, title, rows, valueKey, labelKey) {
            if (!rows || rows.length === 0) {
                document.getElementById(elId).innerHTML = '';
                return;
            }
            let html = `<h3 style="margin-bottom: 10px; color: var(--primary);">> ${title}</h3>`;
            html += '<table style="width: 100%; border-collapse: collapse;">';
            html += '<tr style="border-bottom: 1px solid var(--primary);">';
            html += `<th style="text-align: left; padding: 5px;">${labelKey}</th>`;
            html += '<th style="text-align: right; padding: 5px;">Visits</th>';
            html += '<th style="text-align: right; padding: 5px;">Started</th>';
            html += '<th style="text-align: right; padding: 5px;">Finished</th>';
            html += '<th style="text-align: right; padding: 5px;">Conv%</th>';
            html += '</tr>';
            rows.forEach(r => {
                const conv  = r.visits > 0 ? (r.finished / r.visits * 100).toFixed(1) : '0.0';
                const value = r[valueKey] || r.value || '';
                const short = value.length > 60 ? value.substring(0, 60) + '...' : value;
                html += `<tr style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                    <td style="padding: 5px; color: var(--text-dim); word-break: break-all;">${escapeHtml(short)}</td>
                    <td style="text-align: right; padding: 5px;">${r.visits}</td>
                    <td style="text-align: right; padding: 5px;">${r.started}</td>
                    <td style="text-align: right; padding: 5px;">${r.finished}</td>
                    <td style="text-align: right; padding: 5px;">${conv}%</td>
                </tr>`;
            });
            html += '</table>';
            document.getElementById(elId).innerHTML = html;
        }
        function renderTopReferrers() { renderTopList('visitReferrers',  'Top Referrers',  cachedStats.top_referrers, 'value', 'Referrer'); }
        function renderTopLanguages() { renderTopList('visitLanguages',  'Top Languages',  cachedStats.top_languages, 'value', 'Language'); }

        // Paid campaigns (utm_* from the landing URL). Separate from Top
        // Referrers on purpose: a Brave notification click arrives with NO
        // referrer, so paid traffic hides inside the "(direct)" row there.
        // Loads is the impression count — Loads minus Visits is the paid
        // traffic that landed and left without touching a tile, which is the
        // number a buy lives or dies on. The whole block is hidden when no
        // campaign has ever been tagged (the normal state between buys).
        function renderCampaigns() {
            const el = document.getElementById('visitCampaigns');
            if (!el) return;
            const groups = [
                ['Campaign Source', (cachedStats && cachedStats.campaign_sources) || []],
                ['Campaign',        (cachedStats && cachedStats.campaigns)        || []],
                ['Ad Variant',      (cachedStats && cachedStats.campaign_ads)     || []],
            ].filter(g => g[1].length > 0);
            if (groups.length === 0) { el.innerHTML = ''; return; }
            let html = '';
            groups.forEach(([label, rows]) => {
                html += `<h3 style="margin:0 0 10px;color:var(--primary);">> ${label}</h3>`;
                html += '<table style="width:100%;border-collapse:collapse;margin-bottom:18px;">';
                html += '<tr style="border-bottom:1px solid var(--primary);">'
                     +  `<th style="text-align:left;padding:5px;">${label}</th>`
                     +  '<th style="text-align:right;padding:5px;" title="page loads — impressions, including bounces">Loads</th>'
                     +  '<th style="text-align:right;padding:5px;" title="loads that interacted enough to create a visit row">Visits</th>'
                     +  '<th style="text-align:right;padding:5px;">Started</th>'
                     +  '<th style="text-align:right;padding:5px;">Finished</th>'
                     +  '<th style="text-align:right;padding:5px;" title="loads that never became a visit">Bounce%</th>'
                     +  '<th style="text-align:right;padding:5px;" title="finished / loads">Conv%</th>'
                     +  '</tr>';
                rows.forEach(r => {
                    // Loads is the honest denominator, but rows written before
                    // the impression table carried campaigns can have loads=0
                    // with real visits — fall back rather than divide by zero.
                    const den    = r.loads || r.visits || 0;
                    const bounce = r.loads > 0 ? ((r.loads - r.visits) / r.loads * 100).toFixed(1) : '—';
                    const conv   = den > 0 ? (r.finished / den * 100).toFixed(1) : '0.0';
                    const value  = r.value || '';
                    const short  = value.length > 40 ? value.substring(0, 40) + '…' : value;
                    html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.1);">
                        <td style="padding:5px;color:var(--text-dim);word-break:break-all;">${escapeHtml(short)}</td>
                        <td style="text-align:right;padding:5px;">${r.loads}</td>
                        <td style="text-align:right;padding:5px;">${r.visits}</td>
                        <td style="text-align:right;padding:5px;">${r.started}</td>
                        <td style="text-align:right;padding:5px;">${r.finished}</td>
                        <td style="text-align:right;padding:5px;">${bounce}${bounce === '—' ? '' : '%'}</td>
                        <td style="text-align:right;padding:5px;">${conv}%</td>
                    </tr>`;
                });
                html += '</table>';
            });
            el.innerHTML = html;
        }

        // ── Per-session engagement detail (the ▸ caret) ──
        // Token vocabularies from the front-end's analytics.js / game.js and
        // the back-end's engagement.py MENU_FLAGS — unknown tokens render raw
        // rather than vanish, so a new flag shows up before this map learns it.
        const CONTROL_SOURCES = { src_mouse: 'mouse', src_touch: 'touch', src_key: 'keyboard', src_pad: 'gamepad' };
        // Lit/unlit dots, because the ABSENCE is the finding: a session that
        // played without ever rotating a tile never found the controls.
        const CONTROL_ACTIONS = [['act_rot', 'rotated'], ['act_lock', 'locked'], ['act_hint', 'used hint'], ['act_gate', 'used gate']];
        const FUNNEL_LABELS = {
            menu: 'mode menu', howto: 'How to Solve', lb: 'Leaderboards',
            settings: 'Settings', potd_cal: 'PotD calendar', credits: 'credits',
            daily_more: 'PotD "more puzzles"'
        };

        function toggleVisitDetail(i) {
            const el = document.getElementById('visitDetail' + i);
            const caret = document.getElementById('visitCaret' + i);
            if (!el) return;
            const open = el.style.display !== 'none';
            el.style.display = open ? 'none' : '';
            if (caret) caret.textContent = open ? '▸' : '▾';
        }

        // One session's engagement, read end to end. The aggregate engagement
        // panel cannot do this — it averages a lone interesting session in
        // with everyone else's. Mirrors TANTЯO's; circ's unit is the puzzle.
        function visitDetailHtml(r) {
            // Payloads from a back end that predates these fields have none of
            // them. Say so, rather than rendering every dot red — an absent
            // column and a player who never rotated a tile must not look alike.
            if (r.session_seconds === undefined) {
                return '<div style="padding:6px 10px 8px 22px;color:#ffaa00;font-size:11px;">'
                     + 'No engagement fields in this payload — deploy the back end (recent_visits gained them) and reload.</div>';
            }
            const dim = 'color:var(--text-dim);';
            const dot = b => b ? '<span style="color:#00ff64;">●</span>' : '<span style="color:#ff5050;">○</span>';
            const tokens = s => new Set((s || '').split(',').map(t => t.trim()).filter(Boolean));
            const ctrl = tokens(r.control_flags);
            const funnel = tokens(r.funnel_flags);

            const srcs = Object.keys(CONTROL_SOURCES).filter(k => ctrl.has(k)).map(k => CONTROL_SOURCES[k]);
            const acts = CONTROL_ACTIONS.map(([k, label]) => `${dot(ctrl.has(k))} ${label}`).join(' &nbsp;');
            const opened = Array.from(funnel).map(k => FUNNEL_LABELS[k] || k);

            // puzzles_started is what the CLIENT believes it began;
            // puzzles_recorded is what actually landed. A persistent gap
            // means lost beacons, not a lost player.
            const gap = (r.puzzles_started || 0) > (r.puzzles_recorded || 0);
            const lines = [];
            lines.push(`On page <b>${fmtSecs(r.session_seconds)}</b> &nbsp;·&nbsp; playing <b>${fmtSecs(r.play_seconds)}</b>`
                + ` &nbsp;·&nbsp; landing screen → first puzzle <b>${r.ttfs === null || r.ttfs === undefined ? 'never started one' : fmtSecs(r.ttfs)}</b>`);
            lines.push(`Puzzles: <b>${r.puzzles_started || 0}</b> started / <b>${r.puzzles_recorded || 0}</b> recorded / <b>${r.puzzles_solved || 0}</b> solved`
                + (gap ? ' <span style="color:#ffaa00;">← beacons lost</span>' : '')
                + (r.versions && r.versions.length ? ` &nbsp;·&nbsp; build <b>${escapeHtml(r.versions.join(' → '))}</b>` : ''));
            if (r.puzzles_recorded) {
                lines.push(`Puzzle 1: <b>${fmtSecs(r.first_puzzle_seconds)}</b>, ${escapeHtml(r.first_puzzle_end || '?')}`
                    + `, ${escapeHtml(r.first_puzzle_mode || '?')} ${escapeHtml(r.first_puzzle_dims || '')}`
                    + `, ${r.first_puzzle_moves === null || r.first_puzzle_moves === undefined ? '?' : r.first_puzzle_moves} moves`
                    + ((r.first_puzzle_hints || 0) > 0 ? `, ${r.first_puzzle_hints} hint${r.first_puzzle_hints > 1 ? 's' : ''}` : '')
                    + (r.first_puzzle_resumed ? ' <span style="color:#ffaa00;">(resumed — clock restarted, short is not disengagement)</span>' : '')
                    + (r.puzzles_recorded > 1 ? ` &nbsp;·&nbsp; longest <b>${fmtSecs(r.longest_puzzle_seconds)}</b>` : ''));
            }
            lines.push(`Controls: ${srcs.length ? escapeHtml(srcs.join(' + ')) : '<span style="color:#ff5050;">no input source recorded</span>'} &nbsp;—&nbsp; ${acts}`);
            lines.push(`Menus opened: ${opened.length ? escapeHtml(opened.join(', ')) : 'nothing'}`);
            // Which outbound links THIS session clicked — the aggregate
            // share/credits panels can't attribute, this row can.
            const links = [];
            if (r.share_platform) links.push(`shared: <b>${escapeHtml(r.share_platform)}</b>`);
            if (r.credits_clicks) links.push(`credits links: <b>${escapeHtml(r.credits_clicks)}</b>`);
            if (r.donate) links.push('<b>ASPCA donate clicked</b>');
            lines.push(`Links: ${links.length ? links.join(' &nbsp;·&nbsp; ') : 'none clicked'}`);

            return `<div style="padding:6px 10px 8px 22px;${dim}font-size:11px;line-height:1.7;">${lines.join('<br>')}</div>`;
        }

        // The game's OWN hostname. A referrer on this host means the previous
        // page in that tab was the game itself — a reload or a re-entry, not
        // an arrival. Matched on HOST, never on the whole URL: an itch
        // referral like digeratist.itch.io/circuitousness carries the slug in
        // its PATH and must not be mistaken for a self-referrer.
        const SELF_HOST_RE = /^(?:[a-z0-9-]+\.)*circuitousness\.[a-z0-9.-]+$/i;

        // Why a ○○○ row is NOT an intro rejection.
        //
        // The first dot is `agreed`, which only lights when the intro overlay
        // is DISMISSED (intro.js recordAgreed — the button, Enter or Escape).
        // A returning browser gets the full splash on every load, and a visit
        // row is minted per PAGE LOAD, unconditionally, 500ms after
        // DOMContentLoaded — note tracking.js's recordVisit does NOT wait for
        // the page to be visible, whereas analytics.js's recordPageLoad
        // deliberately does. So an unattended load (iOS Safari evicting a
        // backgrounded tab and reloading it on re-entry) mints a full ○○○ row
        // that no human ever looked at, and it sits in this list looking
        // identical to someone who read the warning and walked away.
        //
        // Returns null when the row really does read as a rejection.
        // Ordered most-decisive first; the first match wins.
        function introBounceExcuse(r, agreedSessions) {
            if (r.agreed) return null;   // nothing to correct — they got past it

            // 1. The dots are simply WRONG. Milestone PATCHes and the
            //    /session beacon are independent delivery paths, so when the
            //    second one reports play the first one lost its writes — the
            //    exact failure tracking.js's delivery-robustness note
            //    describes. Amber: this is a bug in the data, not a reload.
            const played = (r.puzzles_started || 0) > 0
                || (r.puzzles_recorded || 0) > 0
                || (r.play_seconds || 0) > 0;
            if (played) {
                return { tag: 'beacons?', color: '#ffaa00', title:
                    'Dots undercount — this session recorded actual play ('
                    + (r.puzzles_started || 0) + ' started / '
                    + (r.puzzles_recorded || 0) + ' recorded / '
                    + fmtSecs(r.play_seconds) + ' playing) despite ○○○. '
                    + 'The milestone PATCHes were lost, not the player.' };
            }

            // 2. itch mobile redirect handoff. Already tagged ↻itch in Src;
            //    repeated here so the funnel cell agrees with it.
            //
            //    platform-redirect.js has TWO paths and only one shows an
            //    overlay, so the wording must cover both (corrected
            //    2026-08-27 after a row turned up that saw no overlay at all):
            //      Stage 1 — top-level on itch's CDN (itch's fullscreen
            //        launch). location.replace() fires in <head> and the page
            //        just leaves. Nothing is ever painted.
            //      Stage 2 — itch's in-page iframe, where top-navigation is
            //        sandbox-blocked. The "play the full version" overlay
            //        covers the page and the player taps through it.
            //    Either way the INTRO never showed, which is the only thing
            //    this tag actually claims.
            //
            //    Whether a Stage 1 load even produces a row is a RACE:
            //    location.replace() queues a navigation, it does not halt the
            //    document, so recordVisit() (DOMContentLoaded + 500ms) writes
            //    a row only when the timer beats the commit. So the absence of
            //    a ↻itch row next to an arrival proves nothing — read the
            //    ARRIVAL's referrer instead: html-classic.itch.zone/ is
            //    Stage 1, (direct) is Stage 2 (Safari drops the referrer when
            //    a tab is opened from a cross-site iframe).
            if (r.redirected) {
                return { tag: 'handoff', color: '#888', title:
                    'itch mobile redirect handoff — platform-redirect sent this '
                    + 'load to the real origin, either by navigating away on its '
                    + 'own (top-level on itch\'s CDN) or via the "play the full '
                    + 'version" overlay (itch\'s in-page iframe). The intro never '
                    + 'showed, so there was nothing here to reject.' };
            }

            // 3. Self-referrer: the previous page in this tab was the game.
            const refHost = (r.referrer || '').replace(/^https?:\/\//, '').split('/')[0];
            if (SELF_HOST_RE.test(refHost)) {
                return { tag: '↻reload', color: '#888', title:
                    'Referred by the game\'s own host (' + refHost + ') — a reload '
                    + 'or tab re-entry, not a fresh arrival. iOS Safari reloads '
                    + 'evicted background tabs on re-selection, which mints a '
                    + 'visit row nobody attended.' };
            }

            // 4. This browser dismissed the intro on ANOTHER row in this list.
            //    Mirrors the back end's unique-browser funnel dedupe: a
            //    browser that reached the menu even once is not a bounce.
            //    Positive evidence only — the list is the newest 30 rows, so
            //    ABSENCE here proves nothing and is never treated as one.
            if (agreedSessions.has(r.session)) {
                return { tag: '↩seen', color: '#888', title:
                    'This browser dismissed the intro on another row in this '
                    + 'list — it has already seen and accepted the splash, so '
                    + 'this load is a re-open rather than a rejection.' };
            }

            return null;
        }

        // Recent individual visits — spot-check for double-counts (same
        // Session prefix on two rows = one browser reloaded/relaunched) and
        // bots (the User-Agent column). M/S/F = reached Menu / Started /
        // Finished — but see introBounceExcuse: a bare ○○○ is not
        // automatically an intro rejection, and rows with a known innocent
        // explanation are tagged so they don't read as one.
        // Not window-filtered — always the newest rows overall.
        function renderRecentVisits() {
            const rows = (cachedStats && cachedStats.recent_visits) || [];
            const el = document.getElementById('visitRecent');
            if (!el) return;
            if (rows.length === 0) { el.innerHTML = ''; return; }
            // Count session prefixes so repeats (double-loads) can be flagged.
            const counts = {};
            rows.forEach(r => { counts[r.session] = (counts[r.session] || 0) + 1; });
            // Browsers that dismissed the intro on ANY row here — so a later
            // ○○○ load from one of them reads as a re-open, not a rejection.
            const agreedSessions = new Set(rows.filter(r => r.agreed).map(r => r.session));
            const flag = b => b ? '<span style="color:#00ff64;">●</span>' : '<span style="color:#444;">○</span>';
            // Tag appended to a ○○○ cell when that row has an innocent
            // explanation. Three dim circles otherwise read as "looked at the
            // intro and refused", which for a reloaded background tab is a
            // conclusion about a human who was never there.
            const bounceTag = r => {
                const ex = introBounceExcuse(r, agreedSessions);
                return ex
                    ? `<span style="color:${ex.color};font-size:10px;" title="${escapeHtml(ex.title)}">${escapeHtml(ex.tag)}</span>`
                    : '';
            };
            // The whole M/S/F cell. On a tagged row the tag REPLACES the dots
            // instead of following them: introBounceExcuse only fires when
            // `agreed` is false, and the back end keeps the funnel monotonic
            // (finished ⇒ started ⇒ agreed — record_game_start and the
            // /finished handler both set the flags below them), so a tagged
            // row's dots are always ○○○ — three columns of width carrying no
            // information, on the widest cells in the table.
            //
            // Guarded rather than assumed. If a lit dot ever turns up on a
            // tagged row — a legacy row written before the back end enforced
            // monotonicity, or a future excuse that fires on an agreed row —
            // the dots stay, because that contradiction is exactly what
            // someone reading this table needs to see. Silently dropping a
            // lit dot to save width would be the one unrecoverable mistake
            // here.
            const msfCell = r => {
                const tag = bounceTag(r);
                const dots = flag(r.agreed) + flag(r.started) + flag(r.finished);
                if (!tag) return dots;
                if (!r.agreed && !r.started && !r.finished) return tag;
                return dots + ' ' + tag;
            };
            // A paid arrival and a bookmark both show referrer '(direct)' — the
            // campaign tag is the only thing that tells them apart in this list.
            const campTag = r => r.campaign
                ? ` <span style="color:#ffaa00;" title="paid campaign: ${escapeHtml(r.campaign)}">[${escapeHtml(r.campaign)}]</span>`
                : '';
            // The legend moved from a visible block under the heading into the
            // heading's own tooltip (user's call, 2026-08-28). It had been a
            // paragraph of small print above every load of this panel, and the
            // same explanations already ride each tag's own title at the point
            // of use, which is where they are actually needed.
            //
            // Plain text, not markup: title="" renders no HTML, so the bold
            // and the per-tag colours are gone and the structure has to come
            // from line breaks instead. The heading carries a help cursor and
            // a dotted underline — a tooltip nobody knows to hover for would
            // be worse than the block it replaced.
            const LEGEND =
                  'The first dot in M/S/F = the INTRO SPLASH was dismissed, not gameplay.\n\n'
                + 'A row whose dots are REPLACED by a tag had ○○○ for a known innocent reason:\n\n'
                + '  beacons?   the row recorded real play — the dots lost their writes\n'
                + '  handoff    an itch redirect sent this load to the real origin — the intro never showed\n'
                + '  ↻reload    referred by the game host itself — a reload or tab re-entry\n'
                + '  ↩seen      this browser dismissed the intro on another row here\n\n'
                + 'None of those is an intro rejection. Only an UNTAGGED ○○○ is.';
            let html = `<h3 style="margin-bottom: 10px; color: var(--primary);">`
                 +  `<span title="${escapeHtml(LEGEND)}" style="border-bottom:1px dotted var(--text-dim);cursor:help;">> Recent Visits</span>`
                 +  ` <span style="font-size:11px;color:var(--text-dim);">(newest ${rows.length} — repeated Session = same browser)</span></h3>`;
            html += '<table style="width:100%;border-collapse:collapse;font-size:12px;">';
            html += '<tr style="border-bottom:1px solid var(--primary);">'
                 +  '<th style="padding:4px;" title="Expand for this session\'s engagement detail"></th>'
                 +  '<th style="text-align:left;padding:4px;">Time</th>'
                 +  '<th style="text-align:left;padding:4px;">Referrer</th>'
                 +  '<th style="text-align:left;padding:4px;">Session</th>'
                 +  '<th style="text-align:left;padding:4px;" title="Leaderboard handle this BROWSER last submitted a score under (Marathon or PotD), matched on session_id. Browser-level and retroactive: it labels every row from that browser, including loads from before the name was first typed and loads where nothing was submitted. Blank = this browser has never submitted under a name (or submitted as Anonymous, or arrived with no session_id). The same person on a second device stays blank there until they submit from it too.">Player</th>'
                 +  '<th style="text-align:left;padding:4px;">Device</th>'
                 +  '<th style="text-align:left;padding:4px;">Lang</th>'
                 +  '<th style="text-align:left;padding:4px;" title="where the load ran: site = own origin; cg = CrazyGames embed; itch = itch embed; embed = framed on an unknown host; ↻itch = itch mobile redirect handoff: platform-redirect sent this load to the real origin, either by navigating away on its own (top-level on the itch CDN) or via the play-the-full-version overlay (the itch in-page iframe) — either way the intro never showed. Embed platform is inferred from the referrer.">Src</th>'
                 +  '<th style="text-align:center;padding:4px;" title="reached Menu / Started / Finished. The first dot is the INTRO SPLASH being dismissed, not gameplay — so a bare ○○○ only means nobody tapped past the title screen on this load. A tagged row has a known innocent reason, and the tag REPLACES its dots (they are always ○○○ on those rows, so showing them only cost width): beacons? = the row recorded real play and the dots lost their writes; handoff = an itch redirect sent this load to the real origin, so the intro never showed; ↻reload = referred by the game host itself, i.e. a reload or tab re-entry; ↩seen = this browser dismissed the intro on another row here. Untagged ○○○ is the only kind that reads as a real intro rejection. Dots shown ALONGSIDE a tag would mean a row broke the funnel-monotonic rule — worth a look.">M/S/F</th>'
                 +  '<th style="text-align:left;padding:4px;" title="Browser and major version, compacted from the raw user-agent — hover a cell for the full string. A UA matching the back end&apos;s bot filter is shown RAW and in amber instead: bots are rejected at POST /api/visit and should never have created a row at all, so seeing one here means the filter missed it.">User-Agent</th>'
                 +  '<th style="padding:4px;" title="Wipe this browser: deletes ALL its visits (incl. their share-platform + credits-link clicks), puzzle results, page loads and first-run funnel row (test-traffic cleanup)"></th>'
                 +  '</tr>';
            rows.forEach((r, i) => {
                let t = '?';
                if (r.time) { const d = new Date(r.time); t = d.toLocaleString([], {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}); }
                const ref = (r.referrer || '').replace(/^https?:\/\//, '');
                // The referrer budget SHRINKS on a paid row, because the
                // campaign tag shares this cell and the cell is nowrap: a
                // full-path referrer plus a tag ran ~75 chars and pushed the
                // whole table over the panel beside it (2026-09-04, first
                // Google Ads buy). Which half to cut is not a toss-up - on a
                // paid row the campaign is the information and the referrer
                // is almost always '(direct)' or a bare host, because Safari
                // caps cross-site referrers to the origin. Desktop rows are
                // the ones that carry a real path, which is why this only
                // showed up on one row in thirty.
                const refBudget = r.campaign ? 16 : 34;
                const refShort = ref.length > refBudget
                    ? ref.slice(0, refBudget) + '…' : ref;
                const dupe = counts[r.session] > 1;
                const sessStyle = dupe ? 'color:#ffaa00;font-weight:bold;' : '';
                const ua = r.ua || '';
                // Where the load ran. ↻itch (amber) = mobile redirect handoff:
                // platform-redirect sent this load to the real origin — by
                // navigating away on its own (top-level on itch's CDN) or via
                // the overlay (itch's in-page iframe). See introBounceExcuse
                // above for the full two-path note and the row-writing race.
                // The intro never showed either way, so a ○○○ here is NOT an
                // intro rejection. site (blue) = own origin.
                // Embeds: the tracking payload only carries an `embedded`
                // boolean, so the PLATFORM is inferred from the referrer —
                // cg (purple) = CrazyGames, itch (dim) = itch, embed (dim) =
                // framed on an unknown/blank-referrer host.
                let srcTag;
                if (r.redirected) {
                    srcTag = '<span style="color:#ffaa00;" title="itch mobile redirect handoff — platform-redirect sent this load to the real origin, by navigating away on its own (top-level on itch\'s CDN) or via the overlay (itch\'s in-page iframe). The intro never showed either way.">↻itch</span>';
                } else if (!r.embedded) {
                    srcTag = '<span style="color:#3a7bd5;" title="own origin">site</span>';
                } else if (/crazygames\.com/i.test(ref)) {
                    srcTag = '<span style="color:#9b6bd6;" title="CrazyGames embed">cg</span>';
                } else if (/itch\.(io|zone)/i.test(ref)) {
                    srcTag = '<span style="color:#888;" title="itch embed (plays in place)">itch</span>';
                } else {
                    srcTag = '<span style="color:#888;" title="embedded on an unknown or blank-referrer host">embed</span>';
                }
                html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.1);">
                    <td style="padding:4px;"><button id="visitCaret${i}" onclick="toggleVisitDetail(${i})" title="Show this session's engagement detail" style="background:none;border:none;color:var(--primary);cursor:pointer;font-size:11px;padding:0 2px;">▸</button></td>
                    <td style="padding:4px;color:var(--text-dim);white-space:nowrap;">${escapeHtml(t)}</td>
                    <td style="padding:4px;white-space:nowrap;max-width:60ch;overflow:hidden;text-overflow:ellipsis;" title="${escapeHtml(r.referrer || '')}">${escapeHtml(refShort)}${campTag(r)}</td>
                    <td style="padding:4px;${sessStyle}">${escapeHtml(r.session)}</td>
                    <td style="padding:4px;white-space:nowrap;">${playerTag(r)}</td>
                    <td style="padding:4px;color:var(--text-dim);white-space:nowrap;">${escapeHtml(r.device)}/${escapeHtml(r.os)}</td>
                    <td style="padding:4px;color:var(--text-dim);white-space:nowrap;">${escapeHtml(r.lang)}</td>
                    <td style="padding:4px;white-space:nowrap;">${srcTag}</td>
                    <td style="padding:4px;text-align:center;white-space:nowrap;">${msfCell(r)}</td>
                    <td style="padding:4px;color:var(--text-dim);white-space:nowrap;" title="${escapeHtml(ua)}">${uaLabel(ua)}</td>
                    <td style="padding:4px;">${/^[0-9a-fA-F-]{8}$/.test(r.session || '') ? `<button onclick="wipeSession('${escapeHtml(r.session)}')" title="Wipe this browser's rows (visits + share/credits clicks + puzzle results + page loads + first-run row)" style="background:none;border:1px solid rgba(255,80,80,0.4);color:#ff5050;border-radius:3px;cursor:pointer;font-size:10px;padding:1px 5px;">✕</button>` : ''}</td>
                </tr>
                <tr id="visitDetail${i}" style="display:none;border-bottom:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);">
                    <td colspan="11">${visitDetailHtml(r)}</td>
                </tr>`;
            });
            html += '</table>';
            el.innerHTML = html;
        }

        // Wipe one browser's rows (test-traffic cleanup). Dry-run first so
        // the confirm dialog shows exactly what would go — the 8-char prefix
        // shown in the table is what the endpoint keys on, and one browser
        // usually owns several visit rows. Share-platform and credits-link
        // clicks live ON the visit rows (CSV columns), so they're listed in
        // the dialog and vanish from every breakdown with the wipe — no
        // separate scrub. Refreshes the whole stats panel afterwards so every
        // derived number (funnel, share/credits breakdowns, engagement,
        // retention) re-reads without the wiped rows. Mirrors TANTЯO's admin
        // page; the endpoint here is the open dev one, no auth needed, but
        // the Bearer header is sent anyway for symmetry.
        // Parse a response that SHOULD be JSON but may be an HTML error page
        // (a 429 from the rate limiter surfaces as "Unexpected token '<' ...
        // is not valid JSON" otherwise). Always yields an object with .error
        // on failure so callers can alert something readable.
        async function jsonOrError(res) {
            const text = await res.text();
            try { return JSON.parse(text); }
            catch (e) { return { error: `HTTP ${res.status}${res.status === 429 ? ' (rate limited — wait a minute and retry)' : ''}` }; }
        }

        async function wipeSession(prefix) {
            if (!prefix) return;
            try {
                const dryRes = await fetch(`${GAME_API_URL}/admin/wipe-session-visits`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionPrefix: prefix, dryRun: true })
                });
                const dry = await jsonOrError(dryRes);
                if (!dryRes.ok) { alert(`Dry-run failed: ${dry.error || dryRes.status}`); return; }
                const msg = `Wipe browser ${prefix}?\n\n` +
                    `Visits: ${dry.wouldDelete}\n` +
                    `Puzzle results: ${dry.wouldDeletePuzzleResults}\n` +
                    `Page loads: ${dry.wouldDeletePageLoads}\n` +
                    `First-run rows: ${dry.wouldDeleteFirstRun}\n` +
                    `Share clicks removed with them: ${dry.shareClicks}\n` +
                    `Credits-link clicks removed with them: ${dry.creditsClicks}\n\n` +
                    `This cannot be undone.`;
                if (!confirm(msg)) return;
                const res = await fetch(`${GAME_API_URL}/admin/wipe-session-visits`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionPrefix: prefix })
                });
                const data = await jsonOrError(res);
                if (!res.ok) { alert(`Wipe failed: ${data.error || res.status}`); return; }
                alert(`Wiped ${prefix}: ${data.deleted} visits ` +
                    `(carrying ${data.shareClicks} share clicks + ${data.creditsClicks} credits clicks), ` +
                    `${data.puzzleResultsDeleted} puzzle results, ${data.pageLoadsDeleted} page loads, ` +
                    `${data.firstRunDeleted} first-run rows.`);
                loadVisitStats();
            } catch (e) {
                alert(`Wipe failed: ${e.message || e}`);
            }
        }

        // ── Return-players audit ──
        // Drill-down for the daily email's "Return players" number: lists each
        // returning browser for one CT day, which prior-day table it matched,
        // and when it was first seen. Date-scoped (one CT day), independent of
        // the window tabs above. Mirrors build_daily_summary's detection, so
        // the count here equals the email's for the same date. Read-only.
        function defaultReturningDate() {
            // Today's date in CT, as YYYY-MM-DD. en-CA formats as ISO;
            // America/Chicago matches the back-end's day bounds. (Was
            // yesterday — the digest's day — but the panel's live use is
            // "who came back today", so it defaults to the current CT day
            // and the ◀ arrow reaches yesterday in one click.)
            return new Date()
                .toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
        }
        // ◀ / ▶ arrows: step the audit date by ±1 day and reload. Parses the
        // YYYY-MM-DD string at UTC noon so the ±86400s hop can't land on the
        // wrong calendar day (midnight UTC ±1h DST shifts would); the result
        // is read back out of the ISO string, no local-timezone round trip.
        function stepReturning(delta) {
            const input = document.getElementById('returningDate');
            if (!input) return;
            const cur = input.value || defaultReturningDate();
            const d = new Date(cur + 'T12:00:00Z');
            if (isNaN(d)) { input.value = defaultReturningDate(); loadReturning(); return; }
            d.setUTCDate(d.getUTCDate() + delta);
            input.value = d.toISOString().slice(0, 10);
            loadReturning();
        }
        async function loadReturning() {
            const out = document.getElementById('returningResults');
            if (!out) return;
            const input = document.getElementById('returningDate');
            if (input && !input.value) input.value = defaultReturningDate();
            const dateStr = (input && input.value) || defaultReturningDate();
            try {
                const res = await fetch(`${GAME_API_URL}/admin/returning?date=${dateStr}&_=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                // Read as text first and parse defensively: a server 500 returns
                // an HTML error page, and res.json() on that throws an opaque
                // "Unexpected token '<'". This way we surface the real status.
                const body = await res.text();
                let data = null;
                try { data = JSON.parse(body); } catch (_) { /* non-JSON (HTML error page) */ }
                if (!res.ok || !data) {
                    const msg = (data && data.error) ? data.error
                        : res.status === 404
                            ? 'Endpoint not live yet — redeploy the back-end (GET /api/admin/returning).'
                            : `HTTP ${res.status} ${res.statusText} — server error (check Render logs).`;
                    out.innerHTML = `<div style="color:#888;padding:5px;">${escapeHtml(msg)}</div>`;
                    return;
                }
                renderReturning(data);
            } catch (e) {
