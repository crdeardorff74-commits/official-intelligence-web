                if (res.ok) {
                    document.getElementById('bugModalId').textContent = bug.id;
                    document.getElementById('bugModalContent').innerHTML = `
                        <div style="margin-bottom: 20px;">
                            <strong>User:</strong> ${escapeHtml(bug.username)}<br>
                            <strong>Reported:</strong> ${new Date(bug.reported_at).toLocaleString()}<br>
                            <strong>Status:</strong> <span class="bug-status ${bug.status}">${bug.status.toUpperCase()}</span>
                        </div>
                        
                        <div style="margin-bottom: 20px;">
                            <strong>Game State:</strong><br>
                            Difficulty: ${bug.difficulty || 'unknown'} | Skill: ${bug.skill_level || 'unknown'}<br>
                            Mode: ${bug.mode || 'normal'} | Player: ${bug.player_type}<br>
                            Score: ${formatScore(bug.score)} | Level: ${bug.level} | Lines: ${bug.lines}
                        </div>
                        
                        <div style="margin-bottom: 20px;">
                            <strong>Description:</strong>
                            <div style="background: #0a0a1a; padding: 15px; margin-top: 5px; border: 1px solid #333; white-space: pre-wrap;">
${bug.bug_description || '<em>No description provided</em>'}
                            </div>
                        </div>
                        
                        <div>
                            <strong>Debug Log:</strong>
                            <div style="background: #0a0a1a; padding: 15px; margin-top: 5px; border: 1px solid #333; max-height: 400px; overflow: auto; font-family: monospace; font-size: 11px; white-space: pre;">
${bug.debug_log ? escapeHtml(bug.debug_log) : '<em>No debug log</em>'}
                            </div>
                        </div>
                        
                        <div style="margin-top: 20px;">
                            <button class="btn btn-primary" onclick="downloadBugLog(${bug.id})">⬇️ DOWNLOAD LOG</button>
                        </div>
                    `;
                    document.getElementById('bugModal').style.display = 'block';
                }
            } catch (err) {
                showMessage('Failed to load bug report', 'error');
            }
        }
        
        function closeBugModal() {
            document.getElementById('bugModal').style.display = 'none';
        }
        
        async function updateBugStatus(id, status) {
            try {
                const res = await fetch(`${GAME_API_URL}/admin/bug-reports/${id}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status })
                });
                
                if (res.ok) {
                    showMessage('Status updated', 'success');
                    loadBugReports(currentBugsPage);
                } else {
                    showMessage('Failed to update status', 'error');
                }
            } catch (err) {
                showMessage('Failed to update status', 'error');
            }
        }
        
        async function downloadBugLog(id) {
            try {
                const res = await fetch(`${GAME_API_URL}/admin/bug-reports/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const bug = await res.json();
                
                if (res.ok && bug.debug_log) {
                    const filename = `bug_${id}_${bug.username}_log.txt`;
                    const content = `Bug Report #${id}\n` +
                        `User: ${bug.username}\n` +
                        `Reported: ${bug.reported_at}\n` +
                        `Status: ${bug.status}\n` +
                        `Difficulty: ${bug.difficulty}\n` +
                        `Skill: ${bug.skill_level}\n` +
                        `Score: ${bug.score}\n` +
                        `\nDescription:\n${bug.bug_description || 'None'}\n` +
                        `\n${'='.repeat(50)}\nDEBUG LOG:\n${'='.repeat(50)}\n\n` +
                        bug.debug_log;
                    
                    const blob = new Blob([content], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.click();
                    
                    URL.revokeObjectURL(url);
                }
            } catch (err) {
                showMessage('Failed to download log', 'error');
            }
        }
        
        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        
        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => el.innerHTML = '', 3000);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function switchStageTab(btn, group) {
            document.querySelectorAll(`.stage-tab[onclick*="'${group}'"]`).forEach(t => t.classList.remove('active'));
            document.querySelectorAll(`.stage-panel[data-group="${group}"]`).forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            const stage = btn.getAttribute('data-stage');
            document.querySelector(`.stage-panel[data-group="${group}"][data-stage="${stage}"]`).classList.add('active');
        }
        
        function formatScore(score) {
            if (!score) return '₿0.0000';
            const btc = score / 10000000;
            return `₿${btc.toFixed(4)}`;
        }
        
        // Close modal on ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeBugModal();
            }
        });
        
        // ============================================
        // VISIT TRACKING FUNCTIONS
        // ============================================
        
        // Summary stat cards scoped to the selected time window. Lifetime
        // fields have no suffix; rolling windows are *_24h / *_7d / *_30d
        // (the back-end already returns all four sets). Mirrors Circuitousness.
        function renderSummary() {
            if (!cachedStats) return;
            const d = cachedStats;
            const isLifetime = currentWindow === 'lifetime';
            const suffix = '_' + currentWindow;
            const v   = isLifetime ? d.total_visits   : d['visits'      + suffix];
            const st  = isLifetime ? d.total_started  : d['started'     + suffix];
            const fi  = isLifetime ? d.total_finished : d['finished'    + suffix];
            const sh  = isLifetime ? d.total_shared   : d['shared'      + suffix];
            const sr  = isLifetime ? d.start_rate     : d['start_rate'  + suffix];
            const fr  = isLifetime ? d.finish_rate    : d['finish_rate' + suffix];
            const shr = isLifetime ? d.share_rate     : d['share_rate'  + suffix];
            document.getElementById('visitStats').innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px;">
                    <div class="stat-card"><div class="stat-value">${v}</div><div class="stat-label">Total Visits</div></div>
                    <div class="stat-card"><div class="stat-value">${st}</div><div class="stat-label">Started Game</div></div>
                    <div class="stat-card"><div class="stat-value">${fi}</div><div class="stat-label">Finished Game</div></div>
                    <div class="stat-card"><div class="stat-value">${sh}</div><div class="stat-label">Shared Game</div></div>
                    <div class="stat-card">
                        <div class="stat-value">${sr}% <span style="white-space:nowrap;">→&nbsp;${fr}%</span> <span style="white-space:nowrap;">→&nbsp;${shr}%</span></div>
                        <div class="stat-label">Start / Finish / Share Rate</div>
                    </div>
                </div>`;
        }

        function setWindow(btn, win) {
            document.querySelectorAll('.window-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentWindow = win;
            if (cachedStats) renderSummary();
            loadEngagement();   // its own query window — must re-fetch, not re-render
        }

        async function loadVisitStats() {
            // Fired in parallel rather than chained: these panels must still
            // render if the older visits/stats query fails.
            loadEngagement();
            loadRetention();   // own query window (cohort days), not the tabs
            try {
                const res = await fetch(`${GAME_API_URL}/admin/visits/stats?_=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (res.ok) {
                    // Summary stats — windowed via renderSummary (reads currentWindow).
                    cachedStats = data;
                    renderSummary();
                    
                    // Plays-per-session distribution (1/2/3/4/5+). Each
                    // bucket's bar width + trailing (x%) is its share of all
                    // sessions that started >=1 game, so the column sums to
                    // 100%. One page-load session = one "player" (the visit
                    // id isn't persisted across reloads) so this reads as
                    // games-per-sitting.
                    if (data.plays_per_session && data.plays_per_session.length > 0) {
                        const totalPlays  = data.plays_per_session.reduce((s, d) => s + d.count, 0);
                        const playsColors = { '1': '#777', '2': '#45B7D1', '3': '#52B788', '4': '#FFD93D', '5+': '#FF6B6B' };
                        let playsHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Games per Session</h3>';
                        playsHtml += '<div style="font-size: 11px; color: var(--text-dim); margin-bottom: 8px;">Share of sessions (one page-load = one player) by games played. Columns sum to 100%.</div>';
                        data.plays_per_session.forEach(d => {
                            const pct   = totalPlays > 0 ? (d.count / totalPlays * 100).toFixed(1) : '0.0';
                            const label = d.plays === '5+' ? '5+ games' : (d.plays + (d.plays === '1' ? ' game' : ' games'));
                            const color = playsColors[d.plays] || '#888';
                            playsHtml += `<div class="chart-row">
                                <span class="chart-label">${label}</span>
                                <div class="chart-bar-bg">
                                    <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                                </div>
                                <span class="chart-count">${d.count} (${pct}%)</span>
                            </div>`;
                        });
                        document.getElementById('visitPlays').innerHTML = playsHtml;
                    }

                    // Daily chart (text-based bar chart). The API returns up
                    // to 30 days ascending; show only the newest 14.
                    const dailyDays = (data.daily_visits || []).slice(-14);
                    if (dailyDays.length > 0) {
                        const maxVisits = Math.max(...dailyDays.map(d => d.visits));
                        const barWidth = maxVisits > 0 ? 100 / maxVisits : 0;

                        let chartHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Daily Visits (14 days)</h3>';
                        chartHtml += '<div style="font-family: monospace; font-size: 12px;">';
                        // Most-recent day on top (the API returns ascending by date).
                        [...dailyDays].reverse().forEach(d => {
                            const visitBar = Math.round(d.visits * barWidth);
                            const startedBar = Math.round(d.started * barWidth);
                            const finishedBar = Math.round(d.finished * barWidth);
                            const date = d.day.substring(5); // MM-DD
                            chartHtml += `<div style="margin: 2px 0; display: flex; align-items: center; gap: 8px;">
                                <span style="width: 50px; color: var(--text-dim);">${date}</span>
                                <div style="flex: 1; position: relative; height: 16px; background: rgba(255,255,255,0.05);">
                                    <div style="position: absolute; height: 100%; width: ${visitBar}%; background: rgba(0,150,255,0.4);"></div>
                                    <div style="position: absolute; height: 100%; width: ${startedBar}%; background: rgba(255,200,0,0.5);"></div>
                                    <div style="position: absolute; height: 100%; width: ${finishedBar}%; background: rgba(255,80,80,0.6);"></div>
                                    <div style="position: absolute; height: 100%; width: ${Math.round((d.shared || 0) * barWidth)}%; background: rgba(180,80,255,0.6);"></div>
                                </div>
                                <span style="width: 140px; text-align: right; color: var(--text-dim);">${d.visits}/${d.started}/${d.finished}/${d.shared || 0}</span>
                            </div>`;
                        });
                        chartHtml += '</div>';
                        chartHtml += '<div style="margin-top: 5px; font-size: 11px; color: var(--text-dim);"><span style="color: rgba(0,150,255,0.7);">■</span> Visits &nbsp; <span style="color: rgba(255,200,0,0.8);">■</span> Started &nbsp; <span style="color: rgba(255,80,80,0.8);">■</span> Finished &nbsp; <span style="color: rgba(180,80,255,0.8);">■</span> Shared</div>';
                        document.getElementById('visitChart').innerHTML = chartHtml;
                    }
                    
                    // Top referrers
                    if (data.top_referrers && data.top_referrers.length > 0) {
                        let refHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Top Referrers</h3>';
                        refHtml += '<table style="width: 100%; border-collapse: collapse;">';
                        refHtml += '<tr style="border-bottom: 1px solid var(--primary);"><th style="text-align: left; padding: 5px;">Referrer</th><th style="text-align: right; padding: 5px;">Visits</th><th style="text-align: right; padding: 5px;">Started</th><th style="text-align: right; padding: 5px;">Finished</th><th style="text-align: right; padding: 5px;">Conv%</th></tr>';
                        data.top_referrers.forEach(r => {
                            const conv = r.visits > 0 ? (r.finished / r.visits * 100).toFixed(1) : '0.0';
                            // Truncate long referrers
                            const shortRef = r.referrer.length > 60 ? r.referrer.substring(0, 60) + '...' : r.referrer;
                            refHtml += `<tr style="border-bottom: 1px solid rgba(255,255,255,0.1);"><td style="padding: 5px; color: var(--text-dim); word-break: break-all;">${escapeHtml(shortRef)}</td><td style="text-align: right; padding: 5px;">${r.visits}</td><td style="text-align: right; padding: 5px;">${r.started}</td><td style="text-align: right; padding: 5px;">${r.finished}</td><td style="text-align: right; padding: 5px;">${conv}%</td></tr>`;
                        });
                        refHtml += '</table>';
                        document.getElementById('visitReferrers').innerHTML = refHtml;
                    }
                    
                    // Top languages
                    if (data.top_languages && data.top_languages.length > 0) {
                        let langHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Top Languages</h3>';
                        langHtml += '<table style="width: 100%; border-collapse: collapse;">';
                        langHtml += '<tr style="border-bottom: 1px solid var(--primary);"><th style="text-align: left; padding: 5px;">Language</th><th style="text-align: right; padding: 5px;">Visits</th><th style="text-align: right; padding: 5px;">Started</th><th style="text-align: right; padding: 5px;">Finished</th><th style="text-align: right; padding: 5px;">Conv%</th></tr>';
                        data.top_languages.forEach(l => {
                            const conv = l.visits > 0 ? (l.finished / l.visits * 100).toFixed(1) : '0.0';
                            langHtml += `<tr style="border-bottom: 1px solid rgba(255,255,255,0.1);"><td style="padding: 5px;">${escapeHtml(l.language)}</td><td style="text-align: right; padding: 5px;">${l.visits}</td><td style="text-align: right; padding: 5px;">${l.started}</td><td style="text-align: right; padding: 5px;">${l.finished}</td><td style="text-align: right; padding: 5px;">${conv}%</td></tr>`;
                        });
                        langHtml += '</table>';
                        document.getElementById('visitLanguages').innerHTML = langHtml;
                    }

                    // Device type breakdown (per funnel stage)
                    if (data.device_breakdown) {
                        const deviceColors = { desktop: '#0096ff', tablet: '#00ff64', phone: '#ffc800' };
                        const deviceIcons = { desktop: '🖥️', tablet: '📱', phone: '📲' };
                        const stages = ['visit', 'start', 'finish', 'share'];
                        const stageLabels = { visit: 'Visit', start: 'Start', finish: 'Finish', share: 'Share' };
                        let deviceHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Devices</h3>';
                        deviceHtml += '<div class="stage-tabs" data-group="devices">';
                        stages.forEach((s, i) => {
                            deviceHtml += `<button class="stage-tab${i === 0 ? ' active' : ''}" data-stage="${s}" onclick="switchStageTab(this, 'devices')">${stageLabels[s]}</button>`;
                        });
                        deviceHtml += '</div>';
                        stages.forEach((stage, i) => {
                            const items = data.device_breakdown[stage] || [];
                            const total = items.reduce((s, d) => s + d.count, 0);
                            deviceHtml += `<div class="stage-panel${i === 0 ? ' active' : ''}" data-group="devices" data-stage="${stage}">`;
                            if (items.length === 0) {
                                deviceHtml += '<div style="color: #666; padding: 5px;">No data</div>';
                            } else {
                                items.sort((a, b) => b.count - a.count);
                                items.forEach(d => {
                                    const pct = (d.count / total * 100).toFixed(1);
                                    const color = deviceColors[d.type] || '#888';
                                    const icon = deviceIcons[d.type] || '';
                                    deviceHtml += `<div class="chart-row">
                                        <span class="chart-label">${icon} ${d.type}</span>
                                        <div class="chart-bar-bg">
                                            <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                                        </div>
                                        <span class="chart-count">${d.count} (${pct}%)</span>
                                    </div>`;
                                });
                            }
                            deviceHtml += '</div>';
                        });
                        document.getElementById('visitDevices').innerHTML = deviceHtml;
                    }

                    // OS breakdown (per funnel stage)
                    if (data.os_breakdown) {
                        const osColors = { Windows: '#0078d4', iOS: '#a2aaad', Android: '#3ddc84', macOS: '#555', Linux: '#f5a623', Other: '#888' };
                        const stages = ['visit', 'start', 'finish', 'share'];
                        const stageLabels = { visit: 'Visit', start: 'Start', finish: 'Finish', share: 'Share' };
                        let osHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Operating Systems</h3>';
                        osHtml += '<div class="stage-tabs" data-group="os">';
                        stages.forEach((s, i) => {
                            osHtml += `<button class="stage-tab${i === 0 ? ' active' : ''}" data-stage="${s}" onclick="switchStageTab(this, 'os')">${stageLabels[s]}</button>`;
                        });
                        osHtml += '</div>';
                        stages.forEach((stage, i) => {
                            const items = data.os_breakdown[stage] || [];
                            const total = items.reduce((s, o) => s + o.count, 0);
                            osHtml += `<div class="stage-panel${i === 0 ? ' active' : ''}" data-group="os" data-stage="${stage}">`;
                            if (items.length === 0) {
                                osHtml += '<div style="color: #666; padding: 5px;">No data</div>';
                            } else {
                                items.sort((a, b) => b.count - a.count);
                                items.forEach(o => {
                                    const pct = (o.count / total * 100).toFixed(1);
                                    const color = osColors[o.os] || '#888';
                                    osHtml += `<div class="chart-row">
                                        <span class="chart-label">${escapeHtml(o.os)}</span>
                                        <div class="chart-bar-bg">
                                            <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                                        </div>
                                        <span class="chart-count">${o.count} (${pct}%)</span>
                                    </div>`;
                                });
                            }
                            osHtml += '</div>';
                        });
                        document.getElementById('visitOS').innerHTML = osHtml;
                    }

                    // Share platform breakdown
                    if (data.share_breakdown && data.share_breakdown.length > 0) {
                        const totalShares = data.share_breakdown.reduce((s, d) => s + d.count, 0);
                        const shareColors = { twitter: '#1DA1F2', facebook: '#4267B2', reddit: '#FF4500', whatsapp: '#25D366', telegram: '#0088cc', copylink: '#888' };
                        const shareIcons = { twitter: '𝕏', facebook: 'f', reddit: '⬆', whatsapp: '💬', telegram: '✈', copylink: '🔗' };
                        let shareHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Share Platforms</h3>';
                        data.share_breakdown.forEach(d => {
                            const pct = (d.count / totalShares * 100).toFixed(1);
                            const color = shareColors[d.platform] || '#888';
                            const icon = shareIcons[d.platform] || '';
                            shareHtml += `<div class="chart-row">
                                <span class="chart-label">${icon} ${d.platform}</span>
                                <div class="chart-bar-bg">
                                    <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                                </div>
                                <span class="chart-count">${d.count} (${pct}%)</span>
                            </div>`;
                        });
                        document.getElementById('visitShares').innerHTML = shareHtml;
                    }

                    // Suno link click breakdown — list the raw credit-link ID
                    // itself (matches Circuitousness's Credits Link Clicks panel;
                    // no per-ID label/color/icon map to keep in sync).
                    if (data.suno_breakdown && data.suno_breakdown.length > 0) {
                        const totalSuno = data.suno_breakdown.reduce((s, d) => s + d.count, 0);
                        let sunoHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Soundtrack Link Clicks</h3>';
                        data.suno_breakdown.forEach(d => {
                            const pct = (d.count / totalSuno * 100).toFixed(1);
                            sunoHtml += `<div class="chart-row">
                                <span class="chart-label" style="width: 150px; min-width: 150px;">${escapeHtml(d.link)}</span>
                                <div class="chart-bar-bg">
                                    <div style="height: 100%; width: ${pct}%; background: #888; opacity: 0.6;"></div>
                                </div>
                                <span class="chart-count">${d.count} (${pct}%)</span>
                            </div>`;
                        });
                        document.getElementById('visitSunoClicks').innerHTML = sunoHtml;
                    }

                    // ASPCA donation link clicks (single link, so just a headline count)
                    if (data.total_aspca_clicks !== undefined && data.total_aspca_clicks !== null) {
                        document.getElementById('visitDonate').innerHTML = `
                            <h3 style="margin-bottom: 10px; color: var(--primary);">> ASPCA Donations</h3>
                            <div class="chart-row">
                                <span class="chart-label" style="width: 150px; min-width: 150px;">🐾 Donate link clicks</span>
                                <div style="flex: 1;"></div>
                                <span class="chart-count">${data.total_aspca_clicks}</span>
                            </div>`;
                    }

                    // Difficulty breakdown
                    if (data.difficulty_breakdown && data.difficulty_breakdown.length > 0) {
                        const totalDiff = data.difficulty_breakdown.reduce((s, d) => s + d.count, 0);
                        const diffColors = { drizzle: '#52B788', downpour: '#45B7D1', hailstorm: '#FFD93D', blizzard: '#FF6B6B', hurricane: '#C084FC' };
                        const diffIcons = { drizzle: '🌧️', downpour: '⛈️', hailstorm: '🌨️', blizzard: '❄️', hurricane: '🌀' };
                        let diffHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Difficulty</h3>';
                        data.difficulty_breakdown.forEach(d => {
                            const pct = (d.count / totalDiff * 100).toFixed(1);
                            const color = diffColors[d.difficulty] || '#888';
                            const icon = diffIcons[d.difficulty] || '';
                            diffHtml += `<div class="chart-row">
                                <span class="chart-label">${icon} ${d.difficulty}</span>
                                <div class="chart-bar-bg">
                                    <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                                </div>
                                <span class="chart-count">${d.count} (${pct}%)</span>
                            </div>`;
                        });
                        document.getElementById('visitDifficulty').innerHTML = diffHtml;
                    }

                    // Skill level breakdown
                    if (data.skill_breakdown && data.skill_breakdown.length > 0) {
                        const totalSkill = data.skill_breakdown.reduce((s, d) => s + d.count, 0);
                        const skillColors = { breeze: '#52B788', tempest: '#FFD93D', maelstrom: '#FF6B6B' };
                        const skillIcons = { breeze: '🌤️', tempest: '🌪️', maelstrom: '🌀' };
                        let skillHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Skill Level</h3>';
                        data.skill_breakdown.forEach(d => {
                            const pct = (d.count / totalSkill * 100).toFixed(1);
                            const color = skillColors[d.skill_level] || '#888';
                            const icon = skillIcons[d.skill_level] || '';
                            skillHtml += `<div class="chart-row">
                                <span class="chart-label">${icon} ${d.skill_level}</span>
                                <div class="chart-bar-bg">
                                    <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                                </div>
                                <span class="chart-count">${d.count} (${pct}%)</span>
                            </div>`;
                        });
                        document.getElementById('visitSkillLevel').innerHTML = skillHtml;
                    }

                    // Mode breakdown
                    if (data.mode_breakdown && data.mode_breakdown.length > 0) {
                        const totalMode = data.mode_breakdown.reduce((s, d) => s + d.count, 0);
                        const modeColors = { normal: '#45B7D1', challenge: '#FFD93D', ai: '#C084FC', 'ai-challenge': '#FF6B6B' };
                        const modeIcons = { normal: '🎮', challenge: '🏆', ai: '🤖', 'ai-challenge': '🤖🏆' };
                        let modeHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Game Mode</h3>';
                        data.mode_breakdown.forEach(d => {
                            const pct = (d.count / totalMode * 100).toFixed(1);
                            const color = modeColors[d.mode] || '#888';
                            const icon = modeIcons[d.mode] || '';
                            modeHtml += `<div class="chart-row">
                                <span class="chart-label">${icon} ${d.mode}</span>
                                <div class="chart-bar-bg">
                                    <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                                </div>
                                <span class="chart-count">${d.count} (${pct}%)</span>
                            </div>`;
                        });
                        document.getElementById('visitModes').innerHTML = modeHtml;
                    }

                    // Challenge breakdown
                    if (data.challenge_breakdown && data.challenge_breakdown.length > 0) {
                        const totalChal = data.challenge_breakdown.reduce((s, d) => s + d.count, 0);
                        const chalColors = {
                            stranger: '#FF6B6B', dyslexic: '#C084FC', phantom: '#45B7D1',
                            rubber: '#FFD93D', oz: '#52B788', thinner: '#FF8C00', thicker: '#E8596A',
                            carrie: '#DC143C', nokings: '#8B6914', longago: '#B8860B', comingsoon: '#00CED1',
                            nervous: '#FF69B4', sixseven: '#7B68EE', gremlins: '#32CD32',
                            lattice: '#DDA0DD', yesand: '#20B2AA', mercurial: '#CD853F',
                            shadowless: '#708090', sorandom: '#FF1493'
                        };
                        let chalHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Challenges Played</h3>';
                        data.challenge_breakdown.forEach(d => {
                            const pct = (d.count / totalChal * 100).toFixed(1);
                            const color = chalColors[d.challenge] || '#888';
                            chalHtml += `<div class="chart-row">
                                <span class="chart-label">${d.challenge}</span>
                                <div class="chart-bar-bg">
                                    <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                                </div>
                                <span class="chart-count">${d.count} (${pct}%)</span>
                            </div>`;
                        });
                        document.getElementById('visitChallenges').innerHTML = chalHtml;
                    }

                    renderRecentVisits();
                }
            } catch (err) {
                document.getElementById('visitStats').innerHTML = '<p style="color: var(--text-dim);">Failed to load visit stats</p>';
            } finally {
                // Return-players audit is a separate, date-scoped fetch; run it
                // on every stats load (initial + auto-refresh) so it stays
                // current. Independent of the window tabs above.
                loadReturning();
            }
        }

        // Recent individual visits — spot-check for double-counts (same
        // Session prefix on two rows = one browser reloaded/relaunched) and
        // bots (the User-Agent column). M/S/F/Sh = reached Menu / Started /
        // Finished / Shared; Tantro has no intro gate, so the Menu dot is
        // always lit — one dot alone reads "visited but never started".
        // Not window-filtered — always the newest rows overall. Mirrors the
        // Circuitousness admin panel (minus its embed/redirect Src column —
        // Tantro doesn't track embedding).
        function renderRecentVisits() {
            const rows = (cachedStats && cachedStats.recent_visits) || [];
            const el = document.getElementById('visitRecent');
            if (!el) return;
            if (rows.length === 0) { el.innerHTML = ''; return; }
            // Count session prefixes so repeats (double-loads) can be flagged.
            const counts = {};
            rows.forEach(r => { counts[r.session] = (counts[r.session] || 0) + 1; });
            const flag = b => b ? '<span style="color:#00ff64;">●</span>' : '<span style="color:#444;">○</span>';
            let html = `<h3 style="margin-bottom: 10px; color: var(--primary);">> Recent Visits <span style="font-size:11px;color:var(--text-dim);">(newest ${rows.length} — repeated Session = same browser)</span></h3>`;
            html += '<table style="width:100%;border-collapse:collapse;font-size:12px;">';
            html += '<tr style="border-bottom:1px solid var(--primary);">'
                 +  '<th style="text-align:left;padding:4px;">Time</th>'
                 +  '<th style="text-align:left;padding:4px;">Referrer</th>'
                 +  '<th style="text-align:left;padding:4px;">Session</th>'
                 +  '<th style="text-align:left;padding:4px;">Device</th>'
                 +  '<th style="text-align:left;padding:4px;">Lang</th>'
                 +  '<th style="text-align:center;padding:4px;" title="reached Menu / Started / Finished / Shared — Tantro has no intro gate, so every visit reaches the menu and the first dot is always lit">M/S/F/Sh</th>'
                 +  '<th style="text-align:left;padding:4px;">User-Agent</th>'
                 +  '</tr>';
            rows.forEach(r => {
                let t = '?';
                if (r.time) { const d = new Date(r.time); t = d.toLocaleString([], {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}); }
                const ref = (r.referrer || '').replace(/^https?:\/\//, '');
                const refShort = ref.length > 34 ? ref.slice(0, 34) + '…' : ref;
                const dupe = counts[r.session] > 1;
                const sessStyle = dupe ? 'color:#ffaa00;font-weight:bold;' : '';
                const ua = r.ua || '';
                const uaShort = ua.length > 52 ? ua.slice(0, 52) + '…' : ua;
                html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.1);">
                    <td style="padding:4px;color:var(--text-dim);white-space:nowrap;">${escapeHtml(t)}</td>
                    <td style="padding:4px;word-break:break-all;" title="${escapeHtml(r.referrer || '')}">${escapeHtml(refShort)}</td>
                    <td style="padding:4px;${sessStyle}">${escapeHtml(r.session)}</td>
                    <td style="padding:4px;color:var(--text-dim);white-space:nowrap;">${escapeHtml(r.device)}/${escapeHtml(r.os)}</td>
                    <td style="padding:4px;color:var(--text-dim);">${escapeHtml(r.lang)}</td>
                    <td style="padding:4px;text-align:center;white-space:nowrap;">${flag(true)}${flag(r.started)}${flag(r.finished)}${flag(r.shared)}</td>
                    <td style="padding:4px;color:var(--text-dim);" title="${escapeHtml(ua)}">${escapeHtml(uaShort)}</td>
                </tr>`;
            });
            html += '</table>';
            el.innerHTML = html;
        }

        // ── Return-players audit ──
        // Drill-down for the daily email's "Return players" number: lists each
        // returning browser for one CT day, and when it was first seen playing.
        // Date-scoped (one CT day), independent of the window tabs above.
        // Mirrors build_daily_summary's detection (a prior-day page-visit that
        // started a game), so the count here equals the email's for the same
        // date. Read-only.
        function defaultReturningDate() {
            // Today's date in CT, as YYYY-MM-DD. en-CA formats as ISO;
            // America/Chicago matches the back-end's day bounds. The panel's
            // live use is "who came back today", so it defaults to the current
            // CT day and the ◀ arrow reaches yesterday (the digest's day) in
            // one click.
            return new Date()
                .toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
        }
        // ◀ / ▶ arrows: step the audit date by ±1 day and reload. Parses the
        // YYYY-MM-DD string at UTC noon so the ±86400s hop can't land on the
        // wrong calendar day (midnight UTC ±1h DST shifts would); the result
        // is read back out of the ISO string, no local-timezone round trip.
        function stepReturning(delta) {
            const input = document.getElementById('returningDate');
            if (!input) return;
            const cur = input.value || defaultReturningDate();
            const d = new Date(cur + 'T12:00:00Z');
            if (isNaN(d)) { input.value = defaultReturningDate(); loadReturning(); return; }
            d.setUTCDate(d.getUTCDate() + delta);
            input.value = d.toISOString().slice(0, 10);
            loadReturning();
        }
        async function loadReturning() {
            const out = document.getElementById('returningResults');
            if (!out) return;
            const input = document.getElementById('returningDate');
            if (input && !input.value) input.value = defaultReturningDate();
            const dateStr = (input && input.value) || defaultReturningDate();
            try {
                const res = await fetch(`${GAME_API_URL}/admin/returning?date=${dateStr}&_=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                // Read as text first and parse defensively: a server 500 returns
                // an HTML error page, and res.json() on that throws an opaque
                // "Unexpected token '<'". This way we surface the real status.
                const body = await res.text();
                let data = null;
                try { data = JSON.parse(body); } catch (_) { /* non-JSON (HTML error page) */ }
                if (!res.ok || !data) {
                    const msg = (data && data.error) ? data.error
                        : res.status === 404
                            ? 'Endpoint not live yet — redeploy the back-end (GET /api/admin/returning).'
                            : `HTTP ${res.status} ${res.statusText} — server error (check Render logs).`;
                    out.innerHTML = `<div style="color:#888;padding:5px;">${escapeHtml(msg)}</div>`;
                    return;
                }
                renderReturning(data);
            } catch (e) {
                out.innerHTML = `<div style="color:#888;padding:5px;">Network error: ${escapeHtml(e.message || e)}</div>`;
            }
        }
        function renderReturning(data) {
            const out = document.getElementById('returningResults');
            if (!out) return;
            const players = (data && data.players) || [];
            const summary = `<div style="margin-bottom:8px;">
                <span style="color:var(--primary);font-size:14px;">${data.returning}</span>
                <span style="color:var(--text-dim);"> returning of ${data.unique_visitors} unique browsers (${data.pct_returning}%)</span></div>`;
            if (players.length === 0) {
                out.innerHTML = summary + '<div style="color:#666;padding:5px;">No returning players that day.</div>';
                return;
            }
            // Badge per prior-day source. Tantro only has one (a prior
            // page-visit that started a game); kept as a badge column so the
            // panel reads the same as Circuitousness's.
            const srcColor = { page_visits: '#ffaa00' };
            const srcLabel = { page_visits: 'visit' };
            let html = summary;
            html += '<table style="width:100%;border-collapse:collapse;font-size:12px;">';
            html += '<tr style="border-bottom:1px solid var(--primary);">'
                 +  '<th style="text-align:left;padding:4px;">First seen</th>'
                 +  '<th style="text-align:left;padding:4px;" title="which prior-day record proves they played before">Played before via</th>'
                 +  '<th style="text-align:left;padding:4px;">Session</th>'
                 +  '<th style="text-align:left;padding:4px;">Device</th>'
                 +  '<th style="text-align:left;padding:4px;">Lang</th>'
                 +  '<th style="text-align:left;padding:4px;">Returned (CT)</th>'
                 +  '</tr>';
            players.forEach(p => {
                const sid = p.session_id || '';
                const sidShort = sid.length > 12 ? sid.slice(0, 12) + '…' : sid;
                const badges = (p.sources || []).map(s =>
                    `<span style="display:inline-block;border:1px solid ${srcColor[s] || '#888'};color:${srcColor[s] || '#888'};border-radius:3px;padding:0 5px;margin-right:4px;font-size:10px;">${escapeHtml(srcLabel[s] || s)}</span>`
                ).join('');
                html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.1);">
                    <td style="padding:4px;color:var(--text-dim);white-space:nowrap;" title="${escapeHtml(p.first_seen_ct || '')}">${escapeHtml(p.first_seen_date || '?')}</td>
                    <td style="padding:4px;">${badges}</td>
                    <td style="padding:4px;color:var(--text-dim);" title="${escapeHtml(sid)}">${escapeHtml(sidShort)}</td>
                    <td style="padding:4px;color:var(--text-dim);white-space:nowrap;">${escapeHtml(p.device || '?')}/${escapeHtml(p.os || '?')}</td>
                    <td style="padding:4px;color:var(--text-dim);">${escapeHtml(p.language || '?')}</td>
                    <td style="padding:4px;color:var(--text-dim);white-space:nowrap;">${escapeHtml(p.today_first_visit_ct || '?')}</td>
                </tr>`;
            });
            html += '</table>';
            out.innerHTML = html;
        }
        
        // ── Engagement panel ──
        // Playtime, per-game outcome and abandonment: the three CrazyGames
        // scoring dimensions plus the diagnostics that say where players are
        // lost. Backed by GET /api/admin/engagement, which reads the
        // game_results table and the timing columns on page_visits.
        //
        // Deliberately few charts: at trial volume (~500 plays) a finer
        // breakdown puts a handful of humans in each cell, and reading
        // four-person differences as signal is the trap that burned
        // Circuitousness (see CRAZYGAMES.md §6).
        const ENGAGEMENT_DAYS = { lifetime: 0, '24h': 1, '7d': 7, '30d': 30 };

        function fmtSecs(s) {
            if (s === null || s === undefined) return '—';
            s = Math.round(s);
            if (s < 60) return s + 's';
            const m = Math.floor(s / 60);
            return m + 'm ' + String(s % 60).padStart(2, '0') + 's';
        }

        function pct(n, d) {
            return d > 0 ? (n / d * 100).toFixed(1) + '%' : '—';
        }

        async function loadEngagement() {
            const out = document.getElementById('visitEngagement');
            if (!out) return;
            const days = ENGAGEMENT_DAYS[currentWindow] !== undefined ? ENGAGEMENT_DAYS[currentWindow] : 30;
            try {
                const res = await fetch(`${GAME_API_URL}/admin/engagement?days=${days}&_=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                // Same defensive parse as loadReturning: a 500 returns an HTML
                // error page and res.json() would throw an opaque parse error.
                const body = await res.text();
                let data = null;
                try { data = JSON.parse(body); } catch (_) { /* HTML error page */ }
                if (!res.ok || !data) {
                    const msg = (data && data.error) ? data.error
                        : res.status === 404
                            ? 'Endpoint not live yet — redeploy the back-end (GET /api/admin/engagement).'
                            : `HTTP ${res.status} ${res.statusText} — server error (check Render logs).`;
                    out.innerHTML = `<h3 style="margin-bottom:6px;color:var(--primary);">> Engagement</h3>`
                        + `<div style="color:#888;padding:5px;">${escapeHtml(msg)}</div>`;
                    return;
                }
                renderEngagement(data);
            } catch (e) {
                out.innerHTML = `<div style="color:#888;padding:5px;">Network error: ${escapeHtml(e.message || e)}</div>`;
            }
        }

        function renderEngagement(data) {
            const out = document.getElementById('visitEngagement');
            if (!out) return;
            const devices = data.by_device || {};
            const all = devices.all;
            if (!all || !all.sessions) {
                out.innerHTML = '<h3 style="margin-bottom:6px;color:var(--primary);">> Engagement</h3>'
                    + '<div style="color:#666;padding:5px;">No engagement rows yet for this window. '
                    + 'They start landing once a build with analytics.js is deployed and played.</div>';
                return;
            }

            // Delivery health first, on purpose: if beacons are being lost,
            // every rate below it is under-counted and must not be read as
            // player behaviour.
            const d = all.delivery || {};
            const landed = d.pct_landed;
            const healthColor = landed === null ? '#888' : landed >= 95 ? '#52B788' : landed >= 85 ? '#FFD93D' : '#FF6B6B';
            let html = '<h3 style="margin-bottom:6px;color:var(--primary);">> Engagement'
                + `<span style="font-size:12px;color:var(--text-dim);"> (${data.days ? 'last ' + data.days + 'd' : 'lifetime'})</span></h3>`;
            html += `<div style="font-size:11px;color:var(--text-dim);margin-bottom:10px;">
                Delivery health:
                <span style="color:${healthColor};">${d.rows_landed || 0} of ${d.client_games_started || 0} started games recorded (${landed === null ? '—' : landed + '%'})</span>
                · ${d.stuck_in_progress || 0} rows never got a closing beacon.
                Read this before believing anything below it.
                <br>${escapeHtml(data.note || '')}</div>`;

            // One block per device. Desktop and Mobile are scored as separate
            // 15-point cards, so they are never averaged together here.
            const order = ['all', 'desktop', 'phone', 'tablet', 'unknown'];
            const present = order.filter(k => devices[k] && devices[k].sessions);
            html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:1rem;">';

            present.forEach(key => {
                const t = devices[key];
                const ec = t.end_cause || {};
                const ecTotal = (ec.game_over || 0) + (ec.abandoned || 0) + (ec.in_progress || 0);
                const fec = t.first_game_end_cause || {};
                const fecTotal = (fec.game_over || 0) + (fec.abandoned || 0) + (fec.in_progress || 0);

                html += `<div style="border:1px solid rgba(255,255,255,0.15);padding:0.6rem;">`;
                html += `<div style="color:var(--primary);margin-bottom:6px;">${key.toUpperCase()}
                    <span style="color:var(--text-dim);font-size:11px;">· ${t.sessions} sessions · ${t.games} games</span></div>`;

                const rows = [
                    ['Median session (visible)', fmtSecs(t.median_session_seconds)],
                    ['Median play time', fmtSecs(t.median_play_seconds)],
                    ['Mean play time', fmtSecs(t.mean_play_seconds)],
                    ['Median game', fmtSecs(t.median_game_seconds)],
                    ['Median 1st game', fmtSecs(t.median_first_game_seconds)],
                    ['Median lines/game', t.median_lines === null ? '—' : t.median_lines],
                    ['Intro → first game', fmtSecs(t.median_time_to_first_start_seconds)]
                ];
                html += '<div style="font-size:12px;">';
                rows.forEach(r => {
                    html += `<div style="display:flex;justify-content:space-between;gap:0.5rem;">
                        <span style="color:var(--text-dim);">${r[0]}</span><span>${r[1]}</span></div>`;
                });
                html += '</div>';

                // How games end. TANTЯO has no quit button, so `abandoned`
                // and `in_progress` are the SAME player behaviour — leaving
                // mid-game. They differ only in whether the exit beacon
                // survived (closing the whole browser, rather than the tab,
                // kills an in-flight beacon). Labelled as one behaviour with
                // a confidence split, and totalled, so the split is never
                // mistaken for two different things players did.
                const leftMidGame = (ec.abandoned || 0) + (ec.in_progress || 0);
                html += '<div style="margin-top:8px;font-size:12px;color:var(--primary);">How games end</div>';
                [['game_over', 'Played to game over', '#52B788'],
                 ['abandoned', 'Left mid-game (confirmed)', '#FF6B6B'],
                 ['in_progress', 'Left mid-game (beacon lost)', '#777']].forEach(([k, label, color]) => {
                    const n = ec[k] || 0;
                    const w = ecTotal > 0 ? (n / ecTotal * 100) : 0;
                    html += `<div class="chart-row">
                        <span class="chart-label" style="font-size:11px;">${label}</span>
                        <div class="chart-bar-bg"><div style="height:100%;width:${w.toFixed(1)}%;background:${color};opacity:0.6;"></div></div>
                        <span class="chart-count">${n} (${pct(n, ecTotal)})</span></div>`;
                });
                html += `<div style="font-size:11px;color:var(--text-dim);margin-top:4px;">
                    Left mid-game either way: <span style="color:#FF6B6B;">${leftMidGame} (${pct(leftMidGame, ecTotal)})</span>.
                    There is no quit button — the two rows above are the same act, split by whether the
                    exit beacon survived. A lost beacon leaves the duration as a lower bound.</div>`;
                if (fecTotal) {
                    const fecLeft = (fec.abandoned || 0) + (fec.in_progress || 0);
                    html += `<div style="font-size:11px;color:var(--text-dim);margin-top:4px;">
                        First game only: ${pct(fecLeft, fecTotal)} left mid-game (${fecLeft} of ${fecTotal}).</div>`;
                }

                // Duration histogram. Buckets are dense under two minutes
                // because that is where a drop-in arcade audience decides.
                html += '<div style="margin-top:8px;font-size:12px;color:var(--primary);">Game length '
                    + '<span style="color:var(--text-dim);font-size:11px;">(bar = all games, ▸ = first games)</span></div>';
                const hist = t.duration_hist || {};
                const firstHist = t.first_game_hist || {};
                const maxBucket = Math.max(1, ...Object.values(hist));
                Object.keys(hist).forEach(label => {
                    const n = hist[label];
                    const f = firstHist[label] || 0;
                    html += `<div class="chart-row">
                        <span class="chart-label" style="font-size:11px;">${label}</span>
                        <div class="chart-bar-bg"><div style="height:100%;width:${(n / maxBucket * 100).toFixed(1)}%;background:#45B7D1;opacity:0.6;"></div></div>
                        <span class="chart-count">${n} <span style="color:var(--text-dim);">▸${f}</span></span></div>`;
                });

                // Onboarding funnel. The headline is `touched_any_menu`:
                // Circuitousness discovered only 9.2% of its players ever
                // opened a menu, which meant its whole retention hook was
                // invisible to the other 90%. Same question, asked before
                // the trial instead of after.
                const fn = t.funnel || {};
                const touched = t.touched_any_menu || 0;
                if (t.sessions) {
                    html += `<div style="margin-top:8px;font-size:12px;color:var(--primary);">Onboarding funnel</div>
                        <div style="font-size:11px;color:var(--text-dim);margin-bottom:2px;">
                        Opened any menu surface: <span style="color:#FFD93D;">${touched} (${pct(touched, t.sessions)} of sessions)</span>.
                        Anything reachable only from a menu is invisible to the rest.</div>`;
                    const FUNNEL_LABELS = [
                        ['intro_shown', 'First-time intro shown'],
                        ['htp',         'How to Play opened'],
                        ['lb',          'Leaderboards opened'],
                        ['settings',    'Settings opened'],
                        ['skill_open',  'Skill picker opened'],
                        ['skill_set',   '  ↳ skill chosen'],
                        ['diff_open',   'Difficulty picker opened'],
                        ['diff_set',    '  ↳ difficulty chosen'],
                        ['chal_open',   'Challenge picker opened'],
                        ['chal_set',    '  ↳ challenge chosen']
                    ];
                    FUNNEL_LABELS.forEach(([k, label]) => {
                        const n = fn[k] || 0;
                        const w = t.sessions > 0 ? (n / t.sessions * 100) : 0;
                        html += `<div class="chart-row">
                            <span class="chart-label" style="font-size:11px;white-space:pre;">${label}</span>
                            <div class="chart-bar-bg"><div style="height:100%;width:${w.toFixed(1)}%;background:#FFD93D;opacity:0.5;"></div></div>
                            <span class="chart-count">${n} (${pct(n, t.sessions)})</span></div>`;
                    });
                }

                // Does a short first game predict a one-and-done session?
                const od = t.one_and_done || 0, mg = t.multi_game || 0;
                if (od + mg > 0) {
                    html += `<div style="margin-top:8px;font-size:12px;color:var(--primary);">One-and-done</div>
                        <div style="font-size:11px;color:var(--text-dim);">
                        ${od} sessions played exactly one game (${pct(od, od + mg)} of sessions that played at all).<br>
                        First game under ${data.short_first_game_threshold_seconds}s:
                        <span style="color:#FF6B6B;">${pct(t.one_and_done_short_first || 0, od)}</span> of one-and-dones
                        vs <span style="color:#52B788;">${pct(t.multi_game_short_first || 0, mg)}</span> of returners.
                        </div>`;
                }

                html += '</div>';
            });

            html += '</div>';
            out.innerHTML = html;
        }

        // ── Retention panel (forward cohorts) ──
        // Of the browsers first seen on day D, how many came back on D+N.
        // This is the direction CrazyGames grades; the Return Players Audit
        // further down answers the backward question and is NOT comparable
        // to a retention score. Cohorts too young for a horizon are shown
        // greyed and excluded from the totals — otherwise today's cohort
        // would read 0% D1 simply because tomorrow hasn't happened.
        async function loadRetention() {
            const out = document.getElementById('visitRetention');
            if (!out) return;
            try {
                const res = await fetch(`${GAME_API_URL}/admin/retention?days=30&_=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const body = await res.text();
                let data = null;
                try { data = JSON.parse(body); } catch (_) { /* HTML error page */ }
                if (!res.ok || !data) {
                    const msg = (data && data.error) ? data.error
                        : res.status === 404
                            ? 'Endpoint not live yet — redeploy the back-end (GET /api/admin/retention).'
                            : `HTTP ${res.status} ${res.statusText} — server error (check Render logs).`;
                    out.innerHTML = '<h3 style="margin-bottom:6px;color:var(--primary);">> Retention (D1 / D3 / D7)</h3>'
                        + `<div style="color:#888;padding:5px;">${escapeHtml(msg)}</div>`;
                    return;
                }
                renderRetention(data);
            } catch (e) {
                out.innerHTML = `<div style="color:#888;padding:5px;">Network error: ${escapeHtml(e.message || e)}</div>`;
            }
        }

        function renderRetention(data) {
            const out = document.getElementById('visitRetention');
            if (!out) return;
            const devices = data.by_device || {};
            const horizons = data.horizons || [1, 3, 7];
            let html = '<h3 style="margin-bottom:6px;color:var(--primary);">> Retention (forward cohorts)</h3>';
            if (!devices.all) {
                out.innerHTML = html + '<div style="color:#666;padding:5px;">No cohorts yet.</div>';
                return;
            }
            html += `<div style="font-size:11px;color:var(--text-dim);margin-bottom:10px;">
                Of the browsers FIRST seen on a day, how many came back exactly N days later.
                ${escapeHtml(data.note || '')}</div>`;

            // Headline totals per device, over mature cohorts only.
            html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem;margin-bottom:10px;">';
            ['all', 'desktop', 'phone', 'tablet'].filter(k => devices[k]).forEach(key => {
                const tot = devices[key].totals || {};
                html += `<div style="border:1px solid rgba(255,255,255,0.15);padding:0.6rem;">
                    <div style="color:var(--primary);margin-bottom:4px;">${key.toUpperCase()}</div>`;
                horizons.forEach(h => {
                    const d = tot['d' + h] || {};
                    const val = d.pct === null || d.pct === undefined ? '—' : d.pct + '%';
                    const played = d.pct_played === null || d.pct_played === undefined ? '—' : d.pct_played + '%';
                    html += `<div style="display:flex;justify-content:space-between;font-size:12px;">
                        <span style="color:var(--text-dim);">D${h} <span style="font-size:10px;">(n=${d.cohort_browsers || 0})</span></span>
                        <span>${val} <span style="color:var(--text-dim);font-size:10px;">· played ${played}</span></span></div>`;
                });
                html += '</div>';
            });
            html += '</div>';

            // Per-day cohort table for ALL devices combined.
            const cohorts = (devices.all.cohorts || []).filter(c => c.new_browsers > 0);
            if (cohorts.length) {
                html += '<table style="width:100%;border-collapse:collapse;font-size:12px;">';
                html += '<tr style="border-bottom:1px solid var(--primary);">'
                     +  '<th style="text-align:left;padding:4px;">First seen</th>'
                     +  '<th style="text-align:right;padding:4px;">New</th>'
                     +  horizons.map(h => `<th style="text-align:right;padding:4px;">D${h}</th>`).join('')
                     +  '<th style="text-align:right;padding:4px;" title="came back on any later day">Ever</th></tr>';
                cohorts.forEach(c => {
                    html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.1);">
                        <td style="padding:4px;color:var(--text-dim);white-space:nowrap;">${escapeHtml(c.day)}</td>
                        <td style="padding:4px;text-align:right;">${c.new_browsers}</td>`;
                    horizons.forEach(h => {
                        const d = c['d' + h] || {};
                        html += d.eligible
                            ? `<td style="padding:4px;text-align:right;">${d.returned} <span style="color:var(--text-dim);font-size:10px;">(${d.pct === null ? '—' : d.pct + '%'})</span></td>`
                            : '<td style="padding:4px;text-align:right;color:#555;" title="that day has not fully elapsed yet">—</td>';
                    });
                    html += `<td style="padding:4px;text-align:right;color:var(--text-dim);">${c.ever_returned}</td></tr>`;
                });
                html += '</table>';
            }
            out.innerHTML = html;
        }

        // ── Live auto-refresh ──
        // Re-pull the active tab's data every 60s so the admin view stays
        // current without manual clicks. Started only once the admin gate
        // has passed (see checkAdmin). Pauses while the tab is backgrounded
        // or the user is mid-interaction; preserves the current page and the
        // open funnel-stage sub-tabs so the view doesn't jump on each refresh.
        const AUTO_REFRESH_MS = 60000;
        let autoRefreshTimer = null;

        function startAutoRefresh() {
            if (autoRefreshTimer) return;
            autoRefreshTimer = setInterval(autoRefreshTick, AUTO_REFRESH_MS);
        }

        function userIsInteracting() {
            const el = document.activeElement;
            return !!el && ['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName);
        }

        // Capture/restore the open funnel stage per staged panel, keyed off
        // the currently-shown panel (reliable regardless of tab highlighting).
        function captureStageState() {
            const state = {};
            document.querySelectorAll('.stage-panel.active[data-group]').forEach(p => {
                state[p.getAttribute('data-group')] = p.getAttribute('data-stage');
            });
            return state;
        }
        function restoreStageState(state) {
            Object.keys(state).forEach(group => {
                const stage = state[group];
                const tabs = document.querySelector(`.stage-tabs[data-group="${group}"]`);
                if (tabs) tabs.querySelectorAll('.stage-tab').forEach(t =>
                    t.classList.toggle('active', t.getAttribute('data-stage') === stage));
                document.querySelectorAll(`.stage-panel[data-group="${group}"]`).forEach(p =>
                    p.classList.toggle('active', p.getAttribute('data-stage') === stage));
            });
        }

        async function autoRefreshTick() {
            if (document.hidden || userIsInteracting()) return;
            if (currentActiveTab === 'visits') {
                const stageState = captureStageState();
                await loadVisitStats();
                restoreStageState(stageState);
            } else if (currentActiveTab === 'recordings') {
                loadRecordingsStats();
                loadRecordings(currentRecordingsPage);
            } else if (currentActiveTab === 'bugs') {
                loadBugReports(currentBugsPage);
            }
        }

        // Returning to a backgrounded tab refreshes right away rather than
        // waiting out the rest of the interval.
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && autoRefreshTimer) autoRefreshTick();
        });

        // Init
        checkAdmin();
    </script>
</body>
</html>
