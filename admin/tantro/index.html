<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TANTЯO Admin - Official Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .stat-card {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid var(--primary);
            padding: 15px;
            text-align: center;
        }
        .stat-value {
            font-family: 'Press Start 2P', cursive;
            font-size: 16px;
            color: var(--primary);
            margin-bottom: 5px;
            line-height: 1.8;
        }
        .stat-label {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
        }
        .tab-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--primary);
            padding-bottom: 10px;
        }
        .tab-btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: transparent;
            color: #ff8c00;
            border-color: #ff8c00;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .window-tabs {
            display: flex;
            gap: 8px;
            margin: 15px 0;
        }
        .window-tab {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 14px;
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;
            cursor: pointer;
            opacity: 0.5;
        }
        .window-tab.active {
            opacity: 1;
            background: rgba(0, 255, 0, 0.15);
        }
        .bug-status {
            padding: 3px 8px;
            font-size: 9px;
            border-radius: 3px;
        }
        .bug-status.new { background: #ff6b6b; color: #fff; }
        .bug-status.reviewed { background: #ffd93d; color: #000; }
        .bug-status.fixed { background: #6bcb77; color: #000; }
        .bug-status.wontfix { background: #666; color: #fff; }
        .chart-row {
            margin: 6px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-label {
            min-width: 100px;
            white-space: nowrap;
            color: var(--text-dim);
        }
        .chart-bar-bg {
            flex: 1;
            height: 16px;
            background: rgba(255,255,255,0.05);
        }
        .chart-count {
            min-width: 100px;
            text-align: right;
            color: var(--text-dim);
            white-space: nowrap;
        }
        /* Full-width override */
        main { max-width: 100% !important; width: 100% !important; padding: 1vw 2vw !important; box-sizing: border-box; }
        .visits-two-col {
            display: flex;
            gap: 2vw;
            margin-top: 20px;
        }
        /* 45:55 split, matching the Circuitousness admin (its 2026-07-29
           user call): the right column carries the denser panels, and since
           2026-08-07 that includes Engagement and Retention. flex-grow
           ratios over a 0 basis divide the space left after the 2vw gap
           exactly 45/55; the ≤1200px media query still stacks them. */
        .visits-left {
            flex: 45 1 0;
            min-width: 0;
        }
        .visits-right {
            flex: 55 1 0;
            min-width: 0;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            align-content: start;
        }
        .visits-right > div {
            min-width: 0;
        }
        /* Panels that span the whole right column rather than sitting in
           the 3-up breakdown grid. Engagement and Retention are wide by
           construction (a device-card grid and a per-day cohort table). */
        #visitChallenges,
        #visitEngagement,
        #visitRetention {
            grid-column: 1 / -1;
        }
        @media (max-width: 1200px) {
            .visits-two-col { flex-direction: column; }
            .visits-right { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 768px) {
            .visits-right { grid-template-columns: 1fr; }
        }
        .stage-tabs {
            display: flex;
            gap: 0.3vw;
            margin-bottom: 0.8vh;
        }
        .stage-tab {
            background: rgba(0, 255, 65, 0.08);
            border: 1px solid rgba(0, 255, 65, 0.2);
            color: rgba(0, 255, 65, 0.5);
            padding: 0.3vh 0.6vw;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75em;
            transition: all 0.2s;
        }
        .stage-tab:hover {
            background: rgba(0, 255, 65, 0.15);
            color: rgba(0, 255, 65, 0.8);
        }
        .stage-tab.active {
            background: rgba(0, 255, 65, 0.2);
            border-color: var(--primary);
            color: var(--primary);
        }
        .stage-panel {
            display: none;
        }
        .stage-panel.active {
            display: block;
        }
        .rec-row {
            display: flex;
            align-items: center;
            gap: 1vw;
            padding: 0.15vh 0.8vw;
            border-bottom: 1px solid rgba(0, 255, 65, 0.07);
            font-size: 14px;
            height: 1.6em;
            line-height: 1.6em;
            overflow: visible;
        }
        .rec-row:hover {
            background: rgba(0, 255, 65, 0.05);
        }
        .rec-name {
            color: var(--primary);
            font-weight: bold;
            min-width: 12vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
        }
        .rec-score {
            color: #ffc800;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            min-width: 6vw;
            text-align: right;
        }
        .rec-detail {
            color: #aaa;
            white-space: nowrap;
            font-size: 16px;
        }
        .rec-date {
            margin-left: auto;
            min-width: 12em;
            text-align: right;
            color: #aaa;
        }
        .rec-events {
            min-width: 8em;
            white-space: nowrap;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main>
        <div class="admin-header" style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
            <h1 style="margin: 0;">> TANTЯO ADMIN</h1>
            <div class="tab-nav" id="adminTabs" style="display: none; margin: 0; border: none; padding: 0; flex: 1; justify-content: center;">
                <button class="tab-btn active" onclick="showTab('visits')"> > VISITS</button>
                <button class="tab-btn" onclick="showTab('recordings')">RECORDINGS</button>
                <button class="tab-btn" onclick="showTab('bugs')">BUG REPORTS</button>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="adminRefresh" class="btn btn-primary" style="display: none;" onclick="refreshCurrentTab()">🔄 REFRESH</button>
                <a href="/admin/" class="btn btn-primary">← ADMIN HUB</a>
                <a href="/"       class="btn btn-primary">← BACK TO SITE</a>
            </div>
        </div>
        
        <div id="message"></div>
        
        <div id="notAdmin" class="not-admin" style="display: none;">
            <h2 class="section-header">ACCESS DENIED</h2>
            <p style="margin-top: 20px;">Admin privileges required.</p>
            <a href="/" class="btn btn-primary" style="margin-top: 20px; display: inline-block;">RETURN HOME</a>
        </div>
        
        <div id="adminContent" style="display: none;">
            
            <!-- Recordings Tab -->
            <div id="recordingsTab" class="tab-content">
                
                <div id="recordingsStats" class="stats-grid" style="margin-bottom: 20px;">
                    <div class="loading">Loading stats...</div>
                </div>
                
                <div class="filters-row" style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <select id="filterPlayerType" onchange="onPlayerTypeChange()" style="padding: 8px;">
                        <option value="">All Players</option>
                        <option value="human">Human Only</option>
                        <option value="named_human">Named Human</option>
                        <option value="ai">AI Only</option>
                    </select>
                    <select id="filterPlayerName" onchange="loadRecordings()" style="padding: 8px; display: none;"></select>
                    <input type="text" id="filterUsername" placeholder="Username..." style="padding: 8px; width: 150px;">
                    <input type="number" id="filterMinScore" placeholder="Min Score" style="padding: 8px; width: 100px;">
                    <button class="btn btn-primary btn-small" onclick="loadRecordings()">FILTER</button>
                </div>
                
                <div id="recordingsList" class="posts-list">
                    <div class="loading">Loading recordings...</div>
                </div>
                
                <div id="recordingsPagination" style="margin-top: 15px; text-align: center;"></div>
            </div>
            
            <!-- Bug Reports Tab -->
            <div id="bugsTab" class="tab-content">
                
                <div class="filters-row" style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <select id="filterBugStatus" onchange="loadBugReports()" style="padding: 8px;">
                        <option value="">All Status</option>
                        <option value="new">New</option>
                        <option value="reviewed">Reviewed</option>
                        <option value="fixed">Fixed</option>
                        <option value="wontfix">Won't Fix</option>
                    </select>
                    <button class="btn btn-primary btn-small" onclick="loadBugReports()">FILTER</button>
                </div>
                
                <div id="bugsList" class="posts-list">
                    <div class="loading">Loading bug reports...</div>
                </div>
                
                <div id="bugsPagination" style="margin-top: 15px; text-align: center;"></div>
            </div>
        <!-- Visits Tab -->
            <div id="visitsTab" class="tab-content active">

                <!-- Window picker — re-renders the summary stat cards for the
                     chosen range. Charts/breakdowns stay lifetime (the API
                     scopes those itself). Mirrors the Circuitousness admin. -->
                <div class="window-tabs">
                    <button class="window-tab active" data-window="lifetime" onclick="setWindow(this, 'lifetime')">LIFETIME</button>
                    <button class="window-tab"        data-window="24h"      onclick="setWindow(this, '24h')">LAST 24H</button>
                    <button class="window-tab"        data-window="7d"       onclick="setWindow(this, '7d')">LAST 7D</button>
                    <button class="window-tab"        data-window="30d"      onclick="setWindow(this, '30d')">LAST 30D</button>
                </div>
                
                <div class="visits-two-col">
                    <div class="visits-left">
                        <div id="visitStats">
                            <div class="loading">Loading visit stats...</div>
                        </div>
                        <div id="visitChart" style="margin-top: 20px;"></div>
                        <div id="visitRecent" style="margin-top: 20px;"></div>
                        <div id="visitReferrers" style="margin-top: 20px;"></div>
                        <div id="visitLanguages" style="margin-top: 20px;"></div>
                    </div>
                    <div class="visits-right">
                        <div id="visitReturning" style="grid-column: 1 / -1;">
                            <h3 style="margin-bottom: 6px; color: var(--primary);">> Return Players Audit</h3>
                            <div style="margin-bottom:10px;">
                                <button class="btn btn-primary" style="font-size:9px;padding:2px 12px;" onclick="stepReturning(-1)" title="Previous day" aria-label="Previous day">◀</button>
                                <input type="date" id="returningDate"
                                    style="background:#000;color:var(--primary);border:1px solid var(--primary);font-family:'VT323',monospace;font-size:14px;padding:2px 6px;"
                                    onchange="loadReturning()">
                                <button class="btn btn-primary" style="font-size:9px;padding:2px 12px;" onclick="stepReturning(1)" title="Next day" aria-label="Next day">▶</button>
                            </div>
                            <div id="returningResults"><div class="loading">Loading return-player audit...</div></div>
                        </div>
                        <!-- Engagement (playtime / per-game outcome /
                             abandonment) and Retention (forward D1/D3/D7
                             cohorts). Both sit here rather than full-width
                             above the columns (where they were until
                             2026-08-07) so this page reads like the
                             Circuitousness one: retention questions grouped
                             together, with the Return Players Audit directly
                             above them answering the BACKWARD version of the
                             same question — the two are easy to confuse and
                             belong side by side, not pages apart. -->
                        <div id="visitEngagement"></div>
                        <div id="visitRetention"></div>
                        <div id="visitDevices"></div>
                        <div id="visitOS"></div>
                        <div id="visitShares"></div>
                        <div id="visitSunoClicks"></div>
                        <div id="visitDonate"></div>
                        <div id="visitDifficulty"></div>
                        <div id="visitSkillLevel"></div>
                        <div id="visitModes"></div>
                        <div id="visitPlays"></div>
                        <div id="visitChallenges"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Bug Detail Modal -->
        <div id="bugModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow: auto;">
            <div style="max-width: 800px; margin: 50px auto; padding: 20px; background: #1a1a2e; border: 2px solid var(--primary);">
                <div class="admin-header">
                    <h2>> BUG REPORT #<span id="bugModalId"></span></h2>
                    <button class="btn btn-danger" onclick="closeBugModal()">✕ CLOSE</button>
                </div>
                <div id="bugModalContent"></div>
            </div>
        </div>
    </main>
    
    <script>
        const API_URL = 'https://official-intelligence-api.onrender.com';
        const GAME_API_URL = 'https://blockchainstorm.onrender.com/api';
        let token = localStorage.getItem('oi_token');
        let currentRecordingsPage = 1;
        let currentBugsPage = 1;
        let cachedStats = null;
        let currentWindow = 'lifetime';
        
        // Tab switching
        const tabLabels = { recordings: 'RECORDINGS', bugs: 'BUG REPORTS', visits: 'VISITS' };
        let currentActiveTab = 'visits';
        
        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                const label = btn.textContent.replace(/^\s*>\s*/, '').trim();
                btn.textContent = label;
            });
            
            document.getElementById(tab + 'Tab').classList.add('active');
            event.target.classList.add('active');
            event.target.textContent = ' > ' + tabLabels[tab];
            currentActiveTab = tab;
            
            if (tab === 'recordings') {
                loadRecordingsStats();
                loadRecordings();
            }
            if (tab === 'bugs') {
                loadBugReports();
            }
            if (tab === 'visits') {
                loadVisitStats();
            }
        }
        
        function refreshCurrentTab() {
            if (currentActiveTab === 'recordings') {
                loadRecordingsStats();
                loadRecordings();
            } else if (currentActiveTab === 'bugs') {
                loadBugReports();
            } else if (currentActiveTab === 'visits') {
                loadVisitStats();
            }
        }
        
        // Check admin status
        async function checkAdmin() {
            if (!token) {
                document.getElementById('notAdmin').style.display = 'block';
                return;
            }
            
            try {
                const res = await fetch(`${API_URL}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (data.user?.is_admin) {
                    document.getElementById('adminContent').style.display = 'block';
                    document.getElementById('adminTabs').style.display = 'flex';
                    document.getElementById('adminRefresh').style.display = '';
                    loadVisitStats();
                    startAutoRefresh();
                } else {
                    document.getElementById('notAdmin').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('notAdmin').style.display = 'block';
            }
        }
        
        // ============================================
        // GAME RECORDINGS FUNCTIONS
        // ============================================
        
        async function loadRecordingsStats() {
            try {
                const res = await fetch(`${GAME_API_URL}/admin/recordings/stats`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (res.ok) {
                    document.getElementById('recordingsStats').innerHTML = `
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;">
                            <div class="stat-card">
                                <div class="stat-value">${data.total_recordings}</div>
                                <div class="stat-label">Total Recordings</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${data.human_recordings}</div>
                                <div class="stat-label">Human Games</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${data.ai_recordings}</div>
                                <div class="stat-label">AI Games</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${data.unique_players}</div>
                                <div class="stat-label">Unique Players</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${formatScore(data.human_avg_score)}</div>
                                <div class="stat-label">Human Avg</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${formatScore(data.ai_avg_score)}</div>
                                <div class="stat-label">AI Avg</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${data.last_24h}</div>
                                <div class="stat-label">Last 24h</div>
                            </div>
                        </div>
                    `;
                }
            } catch (err) {
                document.getElementById('recordingsStats').innerHTML = '<p style="color: var(--text-dim);">Failed to load stats</p>';
            }
        }
        
        async function onPlayerTypeChange() {
            const typeVal = document.getElementById('filterPlayerType').value;
            const nameDropdown = document.getElementById('filterPlayerName');
            
            if (typeVal === 'named_human') {
                await refreshNamedHumans();
                nameDropdown.style.display = '';
            } else {
                nameDropdown.style.display = 'none';
                nameDropdown.value = '';
            }
            loadRecordings();
        }

        async function refreshNamedHumans() {
            const nameDropdown = document.getElementById('filterPlayerName');
            const currentVal = nameDropdown.value;
            try {
                const res = await fetch(`${GAME_API_URL}/admin/recordings/named-humans`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                nameDropdown.innerHTML = '<option value="">All Named</option>';
                (data.players || []).forEach(p => {
                    nameDropdown.innerHTML += `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)} (${p.count})</option>`;
                });
                if (currentVal) nameDropdown.value = currentVal;
            } catch (err) {
                nameDropdown.innerHTML = '<option value="">Failed to load</option>';
            }
        }

        async function loadRecordings(page = 1) {
            currentRecordingsPage = page;
            
            const playerType = document.getElementById('filterPlayerType')?.value || '';
            const playerName = document.getElementById('filterPlayerName')?.value || '';
            const username = document.getElementById('filterUsername')?.value || '';
            const minScore = document.getElementById('filterMinScore')?.value || '';
            
            let url = `${GAME_API_URL}/admin/recordings?page=${page}&per_page=15`;
            if (playerType) url += `&player_type=${playerType}`;
            if (playerName) url += `&username=${encodeURIComponent(playerName)}&exact=1`;
            else if (username) url += `&username=${encodeURIComponent(username)}`;
            if (minScore) url += `&min_score=${minScore}`;
            
            try {
                const res = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                const container = document.getElementById('recordingsList');
                
                if (data.recordings?.length) {
                    container.innerHTML = data.recordings.map(rec => `
                        <div class="rec-row">
                            <span class="rec-name">${escapeHtml(rec.username)}</span>
                            <span class="rec-score">${formatScore(rec.score)}</span>
                            <span class="rec-events">${rec.tsunamis ? '🌊' + rec.tsunamis : ''}${rec.blackholes ? ' 🕳️' + rec.blackholes : ''}${rec.volcanoes ? ' 🌋' + rec.volcanoes : ''}${rec.strikes ? ' ⚡' + rec.strikes : ''}</span>
                            <span class="rec-detail">${rec.lines || 0}L · L${rec.level || 1}</span>
                            <span class="rec-detail">${rec.difficulty} · ${rec.skill_level}${rec.mode === 'challenge' ? ' · CH' : ''}</span>
                            <span class="rec-detail">${Math.floor(rec.duration_seconds / 60)}m${rec.duration_seconds % 60}s</span>
                            <span class="rec-detail rec-date">${new Date(rec.played_at + 'Z').toLocaleString('en-US', { timeZone: 'America/Chicago', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</span>
                            <span class="post-status ${rec.player_type === 'human' ? 'status-published' : 'status-draft'}" style="font-size:9px;padding:2px 6px;">${rec.player_type.toUpperCase()}</span>
                            <button class="btn btn-primary btn-small" onclick="downloadRecording(${rec.id})" style="padding:2px 8px;font-size:9px;">JSON</button>
                            <button class="btn btn-danger btn-small" onclick="deleteRecording(${rec.id})" style="padding:2px 8px;font-size:9px;">DEL</button>
                        </div>
                    `).join('');
                    
                    // Pagination
                    const pagination = document.getElementById('recordingsPagination');
                    let pagHtml = '';
                    if (data.pages > 1) {
                        if (page > 1) pagHtml += `<button class="btn btn-primary btn-small" onclick="loadRecordings(${page - 1})">← PREV</button> `;
                        pagHtml += `Page ${page} of ${data.pages} (${data.total} total)`;
                        if (page < data.pages) pagHtml += ` <button class="btn btn-primary btn-small" onclick="loadRecordings(${page + 1})">NEXT →</button>`;
                    } else {
                        pagHtml = `${data.total} recordings`;
                    }
                    pagination.innerHTML = pagHtml;
                } else {
                    container.innerHTML = '<p style="color: var(--text-dim);">No recordings found</p>';
                    document.getElementById('recordingsPagination').innerHTML = '';
                }
            } catch (err) {
                showMessage('Failed to load recordings', 'error');
            }
            if (document.getElementById('filterPlayerType')?.value === 'named_human') {
                refreshNamedHumans();
            }
        }
        
        async function downloadRecording(id) {
            try {
                const res = await fetch(`${GAME_API_URL}/admin/recordings/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (res.ok) {
                    const filename = `recording_${data.player_type}_${data.username}_${id}.json`;
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.click();
                    
                    URL.revokeObjectURL(url);
                } else {
                    showMessage('Failed to download recording', 'error');
                }
            } catch (err) {
                showMessage('Failed to download recording', 'error');
            }
        }
        
        async function deleteRecording(id) {
            if (!confirm('Delete this recording? This cannot be undone.')) return;
            
            try {
                const res = await fetch(`${GAME_API_URL}/admin/recordings/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    showMessage('Recording deleted', 'success');
                    loadRecordings(currentRecordingsPage);
                    loadRecordingsStats();
                } else {
                    showMessage('Failed to delete recording', 'error');
                }
            } catch (err) {
                showMessage('Failed to delete recording', 'error');
            }
        }
        
        // ============================================
        // BUG REPORTS FUNCTIONS
        // ============================================
        
        async function loadBugReports(page = 1) {
            currentBugsPage = page;
            
            const status = document.getElementById('filterBugStatus')?.value || '';
            
            let url = `${GAME_API_URL}/admin/bug-reports?page=${page}&per_page=20`;
            if (status) url += `&status=${status}`;
            
            try {
                const res = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                const container = document.getElementById('bugsList');
                
                if (data.bug_reports?.length) {
                    container.innerHTML = data.bug_reports.map(bug => `
                        <div class="post-item">
                            <div class="post-info">
                                <h3>#${bug.id} - ${escapeHtml(bug.username)}</h3>
                                <div class="post-meta">
                                    ${new Date(bug.reported_at).toLocaleString()}
                                    · ${bug.difficulty || 'unknown'}
                                    · ${bug.player_type}
                                    · Score: ${formatScore(bug.score)}
                                </div>
                                <div style="margin-top: 5px; color: var(--text-dim); font-size: 12px;">
                                    ${bug.bug_description ? escapeHtml(bug.bug_description.substring(0, 100)) + (bug.bug_description.length > 100 ? '...' : '') : '<em>No description</em>'}
                                </div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <span class="bug-status ${bug.status}">${bug.status.toUpperCase()}</span>
                                <div class="post-actions">
                                    <button class="btn btn-primary btn-small" onclick="viewBugReport(${bug.id})">VIEW</button>
                                    <select onchange="updateBugStatus(${bug.id}, this.value)" style="padding: 5px; font-size: 10px;">
                                        <option value="new" ${bug.status === 'new' ? 'selected' : ''}>New</option>
                                        <option value="reviewed" ${bug.status === 'reviewed' ? 'selected' : ''}>Reviewed</option>
                                        <option value="fixed" ${bug.status === 'fixed' ? 'selected' : ''}>Fixed</option>
                                        <option value="wontfix" ${bug.status === 'wontfix' ? 'selected' : ''}>Won't Fix</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    `).join('');
                    
                    // Pagination
                    const pagination = document.getElementById('bugsPagination');
                    let pagHtml = '';
                    if (data.pages > 1) {
                        if (page > 1) pagHtml += `<button class="btn btn-primary btn-small" onclick="loadBugReports(${page - 1})">← PREV</button> `;
                        pagHtml += `Page ${page} of ${data.pages} (${data.total} total)`;
                        if (page < data.pages) pagHtml += ` <button class="btn btn-primary btn-small" onclick="loadBugReports(${page + 1})">NEXT →</button>`;
                    } else {
                        pagHtml = `${data.total} bug reports`;
                    }
                    pagination.innerHTML = pagHtml;
                } else {
                    container.innerHTML = '<p style="color: var(--text-dim);">No bug reports found</p>';
                    document.getElementById('bugsPagination').innerHTML = '';
                }
            } catch (err) {
                showMessage('Failed to load bug reports', 'error');
            }
        }
        
        async function viewBugReport(id) {
            try {
                const res = await fetch(`${GAME_API_URL}/admin/bug-reports/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const bug = await res.json();
                
                if (res.ok) {
                    document.getElementById('bugModalId').textContent = bug.id;
                    document.getElementById('bugModalContent').innerHTML = `
                        <div style="margin-bottom: 20px;">
                            <strong>User:</strong> ${escapeHtml(bug.username)}<br>
                            <strong>Reported:</strong> ${new Date(bug.reported_at).toLocaleString()}<br>
                            <strong>Status:</strong> <span class="bug-status ${bug.status}">${bug.status.toUpperCase()}</span>
                        </div>
                        
                        <div style="margin-bottom: 20px;">
                            <strong>Game State:</strong><br>
                            Difficulty: ${bug.difficulty || 'unknown'} | Skill: ${bug.skill_level || 'unknown'}<br>
                            Mode: ${bug.mode || 'normal'} | Player: ${bug.player_type}<br>
                            Score: ${formatScore(bug.score)} | Level: ${bug.level} | Lines: ${bug.lines}
                        </div>
                        
                        <div style="margin-bottom: 20px;">
                            <strong>Description:</strong>
                            <div style="background: #0a0a1a; padding: 15px; margin-top: 5px; border: 1px solid #333; white-space: pre-wrap;">
${bug.bug_description || '<em>No description provided</em>'}
                            </div>
                        </div>
                        
                        <div>
                            <strong>Debug Log:</strong>
                            <div style="background: #0a0a1a; padding: 15px; margin-top: 5px; border: 1px solid #333; max-height: 400px; overflow: auto; font-family: monospace; font-size: 11px; white-space: pre;">
${bug.debug_log ? escapeHtml(bug.debug_log) : '<em>No debug log</em>'}
                            </div>
                        </div>
                        
                        <div style="margin-top: 20px;">
                            <button class="btn btn-primary" onclick="downloadBugLog(${bug.id})">⬇️ DOWNLOAD LOG</button>

                    `;
                    document.getElementById('bugModal').style.display = 'block';
                }
            } catch (err) {
                showMessage('Failed to load bug report', 'error');
            }
        }
        
        function closeBugModal() {
            document.getElementById('bugModal').style.display = 'none';
        }
        
        async function updateBugStatus(id, status) {
            try {
                const res = await fetch(`${GAME_API_URL}/admin/bug-reports/${id}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status })
                });
                
                if (res.ok) {
                    showMessage('Status updated', 'success');
                    loadBugReports(currentBugsPage);
                } else {
                    showMessage('Failed to update status', 'error');
                }
            } catch (err) {
                showMessage('Failed to update status', 'error');
            }
        }
        
        async function downloadBugLog(id) {
            try {
                const res = await fetch(`${GAME_API_URL}/admin/bug-reports/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const bug = await res.json();
                
                if (res.ok && bug.debug_log) {
                    const filename = `bug_${id}_${bug.username}_log.txt`;
                    const content = `Bug Report #${id}\n` +
                        `User: ${bug.username}\n` +
                        `Reported: ${bug.reported_at}\n` +
                        `Status: ${bug.status}\n` +
                        `Difficulty: ${bug.difficulty}\n` +
                        `Skill: ${bug.skill_level}\n` +
                        `Score: ${bug.score}\n` +
                        `\nDescription:\n${bug.bug_description || 'None'}\n` +
                        `\n${'='.repeat(50)}\nDEBUG LOG:\n${'='.repeat(50)}\n\n` +
                        bug.debug_log;
                    
                    const blob = new Blob([content], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.click();
                    
                    URL.revokeObjectURL(url);
                }
            } catch (err) {
                showMessage('Failed to download log', 'error');
            }
        }
        
        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        
        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => el.innerHTML = '', 3000);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function switchStageTab(btn, group) {
            document.querySelectorAll(`.stage-tab[onclick*="'${group}'"]`).forEach(t => t.classList.remove('active'));
            document.querySelectorAll(`.stage-panel[data-group="${group}"]`).forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            const stage = btn.getAttribute('data-stage');
            document.querySelector(`.stage-panel[data-group="${group}"][data-stage="${stage}"]`).classList.add('active');
        }
        
        function formatScore(score) {
            if (!score) return '₿0.0000';
            const btc = score / 10000000;
            return `₿${btc.toFixed(4)}`;
        }
        
        // Close modal on ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeBugModal();
            }
        });
        
        // ============================================
        // VISIT TRACKING FUNCTIONS
        // ============================================
        
        // Summary stat cards scoped to the selected time window. Lifetime
        // fields have no suffix; rolling windows are *_24h / *_7d / *_30d
        // (the back-end already returns all four sets). Mirrors Circuitousness.
        function renderSummary() {
            if (!cachedStats) return;
            const d = cachedStats;
            const isLifetime = currentWindow === 'lifetime';
            const suffix = '_' + currentWindow;
            const v   = isLifetime ? d.total_visits   : d['visits'      + suffix];
            const st  = isLifetime ? d.total_started  : d['started'     + suffix];
            const fi  = isLifetime ? d.total_finished : d['finished'    + suffix];
            const sh  = isLifetime ? d.total_shared   : d['shared'      + suffix];
            const sr  = isLifetime ? d.start_rate     : d['start_rate'  + suffix];
            const fr  = isLifetime ? d.finish_rate    : d['finish_rate' + suffix];
            const shr = isLifetime ? d.share_rate     : d['share_rate'  + suffix];
            document.getElementById('visitStats').innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px;">
                    <div class="stat-card"><div class="stat-value">${v}</div><div class="stat-label">Total Visits</div></div>
                    <div class="stat-card"><div class="stat-value">${st}</div><div class="stat-label">Started Game</div></div>
                    <div class="stat-card"><div class="stat-value">${fi}</div><div class="stat-label">Finished Game</div></div>
                    <div class="stat-card"><div class="stat-value">${sh}</div><div class="stat-label">Shared Game</div></div>
                    <div class="stat-card">
                        <div class="stat-value">${sr}% <span style="white-space:nowrap;">→&nbsp;${fr}%</span> <span style="white-space:nowrap;">→&nbsp;${shr}%</span></div>
                        <div class="stat-label">Start / Finish / Share Rate</div>
                    </div>
                </div>`;
        }

        function setWindow(btn, win) {
            document.querySelectorAll('.window-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentWindow = win;
            if (cachedStats) renderSummary();
            loadEngagement();   // its own query window — must re-fetch, not re-render
        }

        async function loadVisitStats() {
            // Fired in parallel rather than chained: these panels must still
            // render if the older visits/stats query fails.
            loadEngagement();
            loadRetention();   // own query window (cohort days), not the tabs
            try {
                const res = await fetch(`${GAME_API_URL}/admin/visits/stats?_=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (res.ok) {
                    // Summary stats — windowed via renderSummary (reads currentWindow).
                    cachedStats = data;
                    renderSummary();
                    
                    // Plays-per-session distribution (1/2/3/4/5+). Each
                    // bucket's bar width + trailing (x%) is its share of all
                    // sessions that started >=1 game, so the column sums to
                    // 100%. One page-load session = one "player" (the visit
                    // id isn't persisted across reloads) so this reads as
                    // games-per-sitting.
                    if (data.plays_per_session && data.plays_per_session.length > 0) {
                        const totalPlays  = data.plays_per_session.reduce((s, d) => s + d.count, 0);
                        const playsColors = { '1': '#777', '2': '#45B7D1', '3': '#52B788', '4': '#FFD93D', '5+': '#FF6B6B' };
                        let playsHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Games per Session</h3>';
                        playsHtml += '<div style="font-size: 11px; color: var(--text-dim); margin-bottom: 8px;">Share of sessions (one page-load = one player) by games played. Columns sum to 100%.</div>';
                        data.plays_per_session.forEach(d => {
                            const pct   = totalPlays > 0 ? (d.count / totalPlays * 100).toFixed(1) : '0.0';
                            const label = d.plays === '5+' ? '5+ games' : (d.plays + (d.plays === '1' ? ' game' : ' games'));
                            const color = playsColors[d.plays] || '#888';
                            playsHtml += `<div class="chart-row">
                                <span class="chart-label">${label}</span>
                                <div class="chart-bar-bg">
                                    <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                                </div>
                                <span class="chart-count">${d.count} (${pct}%)</span>
                            </div>`;
                        });
                        document.getElementById('visitPlays').innerHTML = playsHtml;
                    }

                    // Daily chart (text-based bar chart). The API returns up
                    // to 30 days ascending; show only the newest 14.
                    const dailyDays = (data.daily_visits || []).slice(-14);
                    if (dailyDays.length > 0) {
                        const maxVisits = Math.max(...dailyDays.map(d => d.visits));
                        const barWidth = maxVisits > 0 ? 100 / maxVisits : 0;

                        let chartHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Daily Visits (14 days)</h3>';
                        chartHtml += '<div style="font-family: monospace; font-size: 12px;">';
                        // Most-recent day on top (the API returns ascending by date).
                        [...dailyDays].reverse().forEach(d => {
                            const visitBar = Math.round(d.visits * barWidth);
                            const startedBar = Math.round(d.started * barWidth);
                            const finishedBar = Math.round(d.finished * barWidth);
                            const date = d.day.substring(5); // MM-DD
                            chartHtml += `<div style="margin: 2px 0; display: flex; align-items: center; gap: 8px;">
                                <span style="width: 50px; color: var(--text-dim);">${date}</span>
                                <div style="flex: 1; position: relative; height: 16px; background: rgba(255,255,255,0.05);">
                                    <div style="position: absolute; height: 100%; width: ${visitBar}%; background: rgba(0,150,255,0.4);"></div>
                                    <div style="position: absolute; height: 100%; width: ${startedBar}%; background: rgba(255,200,0,0.5);"></div>
                                    <div style="position: absolute; height: 100%; width: ${finishedBar}%; background: rgba(255,80,80,0.6);"></div>
                                    <div style="position: absolute; height: 100%; width: ${Math.round((d.shared || 0) * barWidth)}%; background: rgba(180,80,255,0.6);"></div>
                                </div>
                                <span style="width: 140px; text-align: right; color: var(--text-dim);">${d.visits}/${d.started}/${d.finished}/${d.shared || 0}</span>
                            </div>`;
                        });
                        chartHtml += '</div>';
                        chartHtml += '<div style="margin-top: 5px; font-size: 11px; color: var(--text-dim);"><span style="color: rgba(0,150,255,0.7);">■</span> Visits &nbsp; <span style="color: rgba(255,200,0,0.8);">■</span> Started &nbsp; <span style="color: rgba(255,80,80,0.8);">■</span> Finished &nbsp; <span style="color: rgba(180,80,255,0.8);">■</span> Shared</div>';
                        document.getElementById('visitChart').innerHTML = chartHtml;
                    }
                    
                    // Top referrers
                    if (data.top_referrers && data.top_referrers.length > 0) {
                        let refHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Top Referrers</h3>';
                        refHtml += '<table style="width: 100%; border-collapse: collapse;">';
                        refHtml += '<tr style="border-bottom: 1px solid var(--primary);"><th style="text-align: left; padding: 5px;">Referrer</th><th style="text-align: right; padding: 5px;">Visits</th><th style="text-align: right; padding: 5px;">Started</th><th style="text-align: right; padding: 5px;">Finished</th><th style="text-align: right; padding: 5px;">Conv%</th></tr>';
                        data.top_referrers.forEach(r => {
                            const conv = r.visits > 0 ? (r.finished / r.visits * 100).toFixed(1) : '0.0';
                            // Truncate long referrers
                            const shortRef = r.referrer.length > 60 ? r.referrer.substring(0, 60) + '...' : r.referrer;
                            refHtml += `<tr style="border-bottom: 1px solid rgba(255,255,255,0.1);"><td style="padding: 5px; color: var(--text-dim); word-break: break-all;">${escapeHtml(shortRef)}</td><td style="text-align: right; padding: 5px;">${r.visits}</td><td style="text-align: right; padding: 5px;">${r.started}</td><td style="text-align: right; padding: 5px;">${r.finished}</td><td style="text-align: right; padding: 5px;">${conv}%</td></tr>`;
                        });
                        refHtml += '</table>';
                        document.getElementById('visitReferrers').innerHTML = refHtml;
                    }
                    
                    // Top languages
                    if (data.top_languages && data.top_languages.length > 0) {
                        let langHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Top Languages</h3>';
                        langHtml += '<table style="width: 100%; border-collapse: collapse;">';
                        langHtml += '<tr style="border-bottom: 1px solid var(--primary);"><th style="text-align: left; padding: 5px;">Language</th><th style="text-align: right; padding: 5px;">Visits</th><th style="text-align: right; padding: 5px;">Started</th><th style="text-align: right; padding: 5px;">Finished</th><th style="text-align: right; padding: 5px;">Conv%</th></tr>';
                        data.top_languages.forEach(l => {
                            const conv = l.visits > 0 ? (l.finished / l.visits * 100).toFixed(1) : '0.0';
                            langHtml += `<tr style="border-bottom: 1px solid rgba(255,255,255,0.1);"><td style="padding: 5px;">${escapeHtml(l.language)}</td><td style="text-align: right; padding: 5px;">${l.visits}</td><td style="text-align: right; padding: 5px;">${l.started}</td><td style="text-align: right; padding: 5px;">${l.finished}</td><td style="text-align: right; padding: 5px;">${conv}%</td></tr>`;
                        });
                        langHtml += '</table>';
                        document.getElementById('visitLanguages').innerHTML = langHtml;
                    }

                    // Device type breakdown (per funnel stage)
                    if (data.device_breakdown) {
                        const deviceColors = { desktop: '#0096ff', tablet: '#00ff64', phone: '#ffc800' };
                        const deviceIcons = { desktop: '🖥️', tablet: '📱', phone: '📲' };
                        const stages = ['visit', 'start', 'finish', 'share'];
                        const stageLabels = { visit: 'Visit', start: 'Start', finish: 'Finish', share: 'Share' };
                        let deviceHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Devices</h3>';
                        deviceHtml += '<div class="stage-tabs" data-group="devices">';
                        stages.forEach((s, i) => {
                            deviceHtml += `<button class="stage-tab${i === 0 ? ' active' : ''}" data-stage="${s}" onclick="switchStageTab(this, 'devices')">${stageLabels[s]}</button>`;
                        });
                        deviceHtml += '</div>';
                        stages.forEach((stage, i) => {
                            const items = data.device_breakdown[stage] || [];
                            const total = items.reduce((s, d) => s + d.count, 0);
                            deviceHtml += `<div class="stage-panel${i === 0 ? ' active' : ''}" data-group="devices" data-stage="${stage}">`;
                            if (items.length === 0) {
                                deviceHtml += '<div style="color: #666; padding: 5px;">No data</div>';
                            } else {
                                items.sort((a, b) => b.count - a.count);
                                items.forEach(d => {
                                    const pct = (d.count / total * 100).toFixed(1);
                                    const color = deviceColors[d.type] || '#888';
                                    const icon = deviceIcons[d.type] || '';
                                    deviceHtml += `<div class="chart-row">
                                        <span class="chart-label">${icon} ${d.type}</span>
                                        <div class="chart-bar-bg">
                                            <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                                        </div>
                                        <span class="chart-count">${d.count} (${pct}%)</span>
                                    </div>`;
                                });
                            }
                            deviceHtml += '</div>';
                        });
                        document.getElementById('visitDevices').innerHTML = deviceHtml;
                    }

                    // OS breakdown (per funnel stage)
                    if (data.os_breakdown) {
                        const osColors = { Windows: '#0078d4', iOS: '#a2aaad', Android: '#3ddc84', macOS: '#555', Linux: '#f5a623', Other: '#888' };
                        const stages = ['visit', 'start', 'finish', 'share'];
                        const stageLabels = { visit: 'Visit', start: 'Start', finish: 'Finish', share: 'Share' };
                        let osHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Operating Systems</h3>';
                        osHtml += '<div class="stage-tabs" data-group="os">';
                        stages.forEach((s, i) => {
                            osHtml += `<button class="stage-tab${i === 0 ? ' active' : ''}" data-stage="${s}" onclick="switchStageTab(this, 'os')">${stageLabels[s]}</button>`;
                        });
                        osHtml += '</div>';
                        stages.forEach((stage, i) => {
                            const items = data.os_breakdown[stage] || [];
                            const total = items.reduce((s, o) => s + o.count, 0);
                            osHtml += `<div class="stage-panel${i === 0 ? ' active' : ''}" data-group="os" data-stage="${stage}">`;
                            if (items.length === 0) {
                                osHtml += '<div style="color: #666; padding: 5px;">No data</div>';
                            } else {
                                items.sort((a, b) => b.count - a.count);
                                items.forEach(o => {
                                    const pct = (o.count / total * 100).toFixed(1);
                                    const color = osColors[o.os] || '#888';
                                    osHtml += `<div class="chart-row">
                                        <span class="chart-label">${escapeHtml(o.os)}</span>
                                        <div class="chart-bar-bg">
                                            <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                                        </div>
                                        <span class="chart-count">${o.count} (${pct}%)</span>
                                    </div>`;
                                });
                            }
                            osHtml += '</div>';
                        });
                        document.getElementById('visitOS').innerHTML = osHtml;
                    }

                    // Share platform breakdown
                    if (data.share_breakdown && data.share_breakdown.length > 0) {
                        const totalShares = data.share_breakdown.reduce((s, d) => s + d.count, 0);
                        const shareColors = { twitter: '#1DA1F2', facebook: '#4267B2', reddit: '#FF4500', whatsapp: '#25D366', telegram: '#0088cc', copylink: '#888' };
                        const shareIcons = { twitter: '𝕏', facebook: 'f', reddit: '⬆', whatsapp: '💬', telegram: '✈', copylink: '🔗' };
                        let shareHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Share Platforms</h3>';
                        data.share_breakdown.forEach(d => {
                            const pct = (d.count / totalShares * 100).toFixed(1);
                            const color = shareColors[d.platform] || '#888';
                            const icon = shareIcons[d.platform] || '';
                            shareHtml += `<div class="chart-row">
                                <span class="chart-label">${icon} ${d.platform}</span>
                                <div class="chart-bar-bg">
                                    <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                                </div>
                                <span class="chart-count">${d.count} (${pct}%)</span>
                            </div>`;
                        });
                        document.getElementById('visitShares').innerHTML = shareHtml;
                    }

                    // Suno link click breakdown — list the raw credit-link ID
                    // itself (matches Circuitousness's Credits Link Clicks panel;
                    // no per-ID label/color/icon map to keep in sync).
                    if (data.suno_breakdown && data.suno_breakdown.length > 0) {
                        const totalSuno = data.suno_breakdown.reduce((s, d) => s + d.count, 0);
                        let sunoHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Soundtrack Link Clicks</h3>';
                        data.suno_breakdown.forEach(d => {
                            const pct = (d.count / totalSuno * 100).toFixed(1);
                            sunoHtml += `<div class="chart-row">
                                <span class="chart-label" style="width: 150px; min-width: 150px;">${escapeHtml(d.link)}</span>
                                <div class="chart-bar-bg">
                                    <div style="height: 100%; width: ${pct}%; background: #888; opacity: 0.6;"></div>
                                </div>
                                <span class="chart-count">${d.count} (${pct}%)</span>
                            </div>`;
                        });
                        document.getElementById('visitSunoClicks').innerHTML = sunoHtml;
                    }

                    // ASPCA donation link clicks (single link, so just a headline count)
                    if (data.total_aspca_clicks !== undefined && data.total_aspca_clicks !== null) {
                        document.getElementById('visitDonate').innerHTML = `
                            <h3 style="margin-bottom: 10px; color: var(--primary);">> ASPCA Donations</h3>
                            <div class="chart-row">
                                <span class="chart-label" style="width: 150px; min-width: 150px;">🐾 Donate link clicks</span>
                                <div style="flex: 1;"></div>
                                <span class="chart-count">${data.total_aspca_clicks}</span>
                            </div>`;
                    }

                    // Difficulty breakdown
                    if (data.difficulty_breakdown && data.difficulty_breakdown.length > 0) {
                        const totalDiff = data.difficulty_breakdown.reduce((s, d) => s + d.count, 0);
                        const diffColors = { drizzle: '#52B788', downpour: '#45B7D1', hailstorm: '#FFD93D', blizzard: '#FF6B6B', hurricane: '#C084FC' };
                        const diffIcons = { drizzle: '🌧️', downpour: '⛈️', hailstorm: '🌨️', blizzard: '❄️', hurricane: '🌀' };
                        let diffHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Difficulty</h3>';
                        data.difficulty_breakdown.forEach(d => {
                            const pct = (d.count / totalDiff * 100).toFixed(1);
                            const color = diffColors[d.difficulty] || '#888';
                            const icon = diffIcons[d.difficulty] || '';
                            diffHtml += `<div class="chart-row">
                                <span class="chart-label">${icon} ${d.difficulty}</span>
                                <div class="chart-bar-bg">
                                    <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                                </div>
                                <span class="chart-count">${d.count} (${pct}%)</span>
                            </div>`;
                        });
                        document.getElementById('visitDifficulty').innerHTML = diffHtml;
                    }

                    // Skill level breakdown
                    if (data.skill_breakdown && data.skill_breakdown.length > 0) {
                        const totalSkill = data.skill_breakdown.reduce((s, d) => s + d.count, 0);
                        const skillColors = { breeze: '#52B788', tempest: '#FFD93D', maelstrom: '#FF6B6B' };
                        const skillIcons = { breeze: '🌤️', tempest: '🌪️', maelstrom: '🌀' };
                        let skillHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Skill Level</h3>';
                        data.skill_breakdown.forEach(d => {
                            const pct = (d.count / totalSkill * 100).toFixed(1);
                            const color = skillColors[d.skill_level] || '#888';
                            const icon = skillIcons[d.skill_level] || '';
                            skillHtml += `<div class="chart-row">
                                <span class="chart-label">${icon} ${d.skill_level}</span>
                                <div class="chart-bar-bg">
                                    <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                                </div>
                                <span class="chart-count">${d.count} (${pct}%)</span>
                            </div>`;
                        });
                        document.getElementById('visitSkillLevel').innerHTML = skillHtml;
                    }

                    // Mode breakdown
                    if (data.mode_breakdown && data.mode_breakdown.length > 0) {
                        const totalMode = data.mode_breakdown.reduce((s, d) => s + d.count, 0);
                        const modeColors = { normal: '#45B7D1', challenge: '#FFD93D', ai: '#C084FC', 'ai-challenge': '#FF6B6B' };
                        const modeIcons = { normal: '🎮', challenge: '🏆', ai: '🤖', 'ai-challenge': '🤖🏆' };
                        let modeHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Game Mode</h3>';
                        data.mode_breakdown.forEach(d => {
                            const pct = (d.count / totalMode * 100).toFixed(1);
                            const color = modeColors[d.mode] || '#888';
                            const icon = modeIcons[d.mode] || '';
                            modeHtml += `<div class="chart-row">
                                <span class="chart-label">${icon} ${d.mode}</span>
                                <div class="chart-bar-bg">
                                    <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                                </div>
                                <span class="chart-count">${d.count} (${pct}%)</span>
                            </div>`;
                        });
                        document.getElementById('visitModes').innerHTML = modeHtml;
                    }

                    // Challenge breakdown
                    if (data.challenge_breakdown && data.challenge_breakdown.length > 0) {
                        const totalChal = data.challenge_breakdown.reduce((s, d) => s + d.count, 0);
                        const chalColors = {
                            stranger: '#FF6B6B', dyslexic: '#C084FC', phantom: '#45B7D1',
                            rubber: '#FFD93D', oz: '#52B788', thinner: '#FF8C00', thicker: '#E8596A',
                            carrie: '#DC143C', nokings: '#8B6914', longago: '#B8860B', comingsoon: '#00CED1',
                            nervous: '#FF69B4', sixseven: '#7B68EE', gremlins: '#32CD32',
                            lattice: '#DDA0DD', yesand: '#20B2AA', mercurial: '#CD853F',
                            shadowless: '#708090', sorandom: '#FF1493'
                        };
                        let chalHtml = '<h3 style="margin-bottom: 10px; color: var(--primary);">> Challenges Played</h3>';
                        data.challenge_breakdown.forEach(d => {
                            const pct = (d.count / totalChal * 100).toFixed(1);
                            const color = chalColors[d.challenge] || '#888';
                            chalHtml += `<div class="chart-row">
                                <span class="chart-label">${d.challenge}</span>
                                <div class="chart-bar-bg">
                                    <div style="height: 100%; width: ${pct}%; background: ${color}; opacity: 0.6;"></div>
                                </div>
                                <span class="chart-count">${d.count} (${pct}%)</span>
                            </div>`;
                        });
                        document.getElementById('visitChallenges').innerHTML = chalHtml;
                    }

                    renderRecentVisits();
                }
            } catch (err) {
                document.getElementById('visitStats').innerHTML = '<p style="color: var(--text-dim);">Failed to load visit stats</p>';
            } finally {
                // Return-players audit is a separate, date-scoped fetch; run it
                // on every stats load (initial + auto-refresh) so it stays
                // current. Independent of the window tabs above.
                loadReturning();
            }
        }

        // Recent individual visits — spot-check for double-counts (same
        // Session prefix on two rows = one browser reloaded/relaunched) and
        // bots (the User-Agent column). M/S/F/Sh = reached Menu / Started /
        // Finished / Shared; Tantro has no intro gate, so the Menu dot is
        // always lit — one dot alone reads "visited but never started".
        // But see startBounceExcuse: a bare ●○○○ is not automatically a
        // rejection, and rows with a known innocent explanation are tagged
        // so they don't read as one.
        // Not window-filtered — always the newest rows overall. Mirrors the
        // Circuitousness admin panel (minus its embed/redirect Src column —
        // Tantro doesn't track embedding).
        //
        // Each row expands (the ▸ caret) into one session's engagement detail.
        // That exists because the aggregate Engagement panel cannot isolate a
        // single session: it takes only ?days=N. When CrazyGames rejected the
        // 2026-08-11 submission after ONE reviewer session, the 24h window
        // held 3 visitors and 9 sessions and there was no way to say which
        // numbers were theirs. Expand their row instead.
        // Token sets from PageVisit.control_flags / .funnel_flags — union-merged
        // CSVs written by Analytics.control() / .flag(). Decoded here rather
        // than server-side so adding a token stays a front-end-only change.
        const CONTROL_SOURCES = { src_kbd: 'keyboard', src_touch: 'touch', src_btn: 'on-screen buttons' };
        // Rendered as lit/unlit dots, because the ABSENCE is the finding: a
        // session that played without ever rotating a piece never found the
        // controls. That is what a 30-second first game usually is.
        const CONTROL_ACTIONS = [['act_move', 'moved'], ['act_rot', 'rotated'], ['act_hard', 'hard-dropped']];
        const FUNNEL_LABELS = {
            intro_shown: 'first-time intro', htp: 'How to Play', lb: 'Leaderboards',
            settings: 'Settings', skill_open: 'skill picker', skill_set: 'skill chosen',
            diff_open: 'difficulty picker', diff_set: 'difficulty chosen',
            chal_open: 'challenge picker', chal_set: 'challenge chosen'
        };

        function toggleVisitDetail(i) {
            const el = document.getElementById('visitDetail' + i);
            const caret = document.getElementById('visitCaret' + i);
            if (!el) return;
            const open = el.style.display !== 'none';
            el.style.display = open ? 'none' : '';
            if (caret) caret.textContent = open ? '▸' : '▾';
        }

        // One session's engagement, read end to end. The aggregate panel below
        // cannot do this — /api/admin/engagement takes only ?days=N, so a lone
        // CrazyGames reviewer session arrives averaged in with everyone else's.
        function visitDetailHtml(r) {
            // Payloads from a back end that predates these fields have none of
            // them. Say so, rather than rendering every dot red — an absent
            // column and a player who never rotated a piece must not look alike.
            if (r.session_seconds === undefined) {
                return '<div style="padding:6px 10px 8px 22px;color:#ffaa00;font-size:11px;">'
                     + 'No engagement fields in this payload — deploy the back end (recent_visits gained them) and reload.</div>';
            }
            const dim = 'color:var(--text-dim);';
            const dot = b => b ? '<span style="color:#00ff64;">●</span>' : '<span style="color:#ff5050;">○</span>';
            const tokens = s => new Set((s || '').split(',').map(t => t.trim()).filter(Boolean));
            const ctrl = tokens(r.control_flags);
            const funnel = tokens(r.funnel_flags);

            const srcs = Object.keys(CONTROL_SOURCES).filter(k => ctrl.has(k)).map(k => CONTROL_SOURCES[k]);
            const acts = CONTROL_ACTIONS.map(([k, label]) => `${dot(ctrl.has(k))} ${label}`).join(' &nbsp;');
            const opened = Object.keys(FUNNEL_LABELS).filter(k => funnel.has(k)).map(k => FUNNEL_LABELS[k]);

            // games_started is what the CLIENT believes it began; games_recorded
            // is what actually landed. A persistent gap means lost beacons, not
            // a lost player.
            const gap = (r.games_started || 0) > (r.games_recorded || 0);
            const lines = [];
            lines.push(`On page <b>${fmtSecs(r.session_seconds)}</b> &nbsp;·&nbsp; playing <b>${fmtSecs(r.play_seconds)}</b>`
                + ` &nbsp;·&nbsp; landing screen → first game <b>${r.ttfs === null || r.ttfs === undefined ? 'never started one' : fmtSecs(r.ttfs)}</b>`);
            lines.push(`Games: <b>${r.games_started || 0}</b> started / <b>${r.games_recorded || 0}</b> recorded`
                + (gap ? ' <span style="color:#ffaa00;">← beacons lost</span>' : '')
                + (r.versions && r.versions.length ? ` &nbsp;·&nbsp; build <b>${escapeHtml(r.versions.join(' → '))}</b>` : ''));
            if (r.games_recorded) {
                lines.push(`Game 1: <b>${fmtSecs(r.first_game_seconds)}</b>, ${escapeHtml(r.first_game_end || '?')}`
                    + `, ${r.first_game_lines === null || r.first_game_lines === undefined ? '?' : r.first_game_lines} lines`
                    + (r.first_game_resumed ? ' <span style="color:#ffaa00;">(resumed — clock restarted, short is not disengagement)</span>' : '')
                    + (r.games_recorded > 1 ? ` &nbsp;·&nbsp; longest <b>${fmtSecs(r.longest_game_seconds)}</b>` : ''));
            }
            // Perf tokens (split 2026-08-19, phones-only from v4.40):
            //   perf_fired   — measured slow THIS session (fresh judgment)
            //   perf_reduced — session ran with reduced effects (fired now
            //                  OR re-applied from an earlier session's flag)
            //   perf_cap     — flat ~30fps fingerprint (Energy Saver / RDP /
            //                  30Hz display): effects kept, nothing flagged.
            // Pre-split builds only ever sent perf_reduced, so its
            // fallback wording still hedges.
            let perfNote = '';
            if (ctrl.has('perf_fired')) {
                perfNote = ' &nbsp;·&nbsp; <span style="color:#ffaa00;">effects auto-reduced — judged slow THIS session</span>';
            } else if (ctrl.has('perf_reduced')) {
                perfNote = ' &nbsp;·&nbsp; <span style="color:#ffaa00;">ran with reduced effects (flagged in an earlier session, or a pre-v4.40 build)</span>';
            }
            if (ctrl.has('perf_cap')) {
                perfNote += ' &nbsp;·&nbsp; <span style="color:#3a7bd5;">frame-rate cap detected (Energy Saver / RDP / 30Hz) — effects kept</span>';
            }
            lines.push(`Controls: ${srcs.length ? escapeHtml(srcs.join(' + ')) : '<span style="color:#ff5050;">no input source recorded</span>'} &nbsp;—&nbsp; ${acts}`
                + perfNote);
            lines.push(`Menus opened: ${opened.length ? escapeHtml(opened.join(', ')) : 'nothing'}`);

            return `<div style="padding:6px 10px 8px 22px;${dim}font-size:11px;line-height:1.7;">${lines.join('<br>')}</div>`;
        }

        // The game's OWN hostname. A referrer on this host means the previous
        // page in that tab was the game itself — a reload or a re-entry, not
        // an arrival. Matched on HOST, never on the whole URL: an itch
        // referral looks like digeratist.itch.io/tantro, with the slug in its
        // PATH, and must not be mistaken for a self-referrer.
        const SELF_HOST_RE = /^(?:[a-z0-9-]+\.)*tantro\.[a-z0-9.-]+$/i;

        // Why a ●○○○ row is NOT a rejection.
        //
        // Ported from the Circuitousness admin panel (2026-08-27), but the
        // shape it looks for is different, and the difference matters:
        //
        //   - Circuitousness has an intro gate, so its first dot is `agreed`
        //     and a REJECTION reads ○○○. Tantro has no gate — the Menu dot is
        //     hardcoded lit — so the row that reads as a rejection here is
        //     ●○○○: arrived, never started a game.
        //
        //   - Circuitousness mints a visit row on every page load,
        //     unconditionally. Tantro's `_recordVisit` (game.js) is gated on a
        //     real human interaction — mousemove / scroll / touchstart /
        //     keydown / click, and never within the first second. So Tantro
        //     does NOT accumulate phantom rows from unattended background-tab
        //     reloads the way Circuitousness does; every row here had a person
        //     on it. That makes a bare ●○○○ a STRONGER signal than its
        //     Circuitousness counterpart, and makes these tags rarer — but it
        //     is exactly why the ones that do fire are worth reading.
        //
        // Returns null when the row really does read as a rejection.
        // Ordered most-decisive first; the first match wins.
        function startBounceExcuse(r, startedSessions) {
            if (r.started) return null;   // nothing to correct — they played

            // 1. The dots are simply WRONG. The funnel booleans and the
            //    game-result rows are separate delivery paths, so a row whose
            //    detail shows a recorded game with an unlit S dot lost its
            //    writes, not its player. This is the exact row the "Repair
            //    funnel flags" button above the table rebuilds — amber, to
            //    match it, because it is a data bug and it is fixable.
            const played = (r.games_started || 0) > 0
                || (r.games_recorded || 0) > 0
                || (r.play_seconds || 0) > 0;
            if (played) {
                return { tag: 'beacons?', color: '#ffaa00', title:
                    'Dots undercount — this session recorded actual play ('
                    + (r.games_started || 0) + ' started / '
                    + (r.games_recorded || 0) + ' recorded / '
                    + fmtSecs(r.play_seconds) + ' playing) with the S dot dark. '
                    + 'The funnel flags were lost, not the player — this is what '
                    + '"Repair funnel flags" rebuilds.' };
            }

            // 2. Self-referrer: the previous page in this tab was the game.
            //    Not a phantom row (the interaction gate rules that out) but
            //    not a new visitor either — it is the same person's second
            //    row, and counting it as a fresh arrival deflates start rate.
            const refHost = (r.referrer || '').replace(/^https?:\/\//, '').split('/')[0];
            if (SELF_HOST_RE.test(refHost)) {
                return { tag: '↻reload', color: '#888', title:
                    'Referred by the game host itself (' + refHost + ') — a reload '
                    + 'or tab re-entry by someone already here, not a fresh arrival. '
                    + 'Counting it as a new visitor deflates the start rate.' };
            }

            // 3. This browser started a game on ANOTHER row in this list, so
            //    it has already converted at least once and this load is a
            //    re-open. Positive evidence only — the list is the newest 30
            //    rows, so ABSENCE here proves nothing and is never a claim.
            if (startedSessions.has(r.session)) {
                return { tag: '↩seen', color: '#888', title:
                    'This browser started a game on another row in this list — '
                    + 'it has already converted, so this load is a re-open '
                    + 'rather than someone who arrived and refused to play.' };
            }

            return null;
        }

        function renderRecentVisits() {
            const rows = (cachedStats && cachedStats.recent_visits) || [];
            const el = document.getElementById('visitRecent');
            if (!el) return;
            if (rows.length === 0) { el.innerHTML = ''; return; }
            // Count session prefixes so repeats (double-loads) can be flagged.
            const counts = {};
            rows.forEach(r => { counts[r.session] = (counts[r.session] || 0) + 1; });
            // Browsers that started a game on ANY row here — so a later
            // ●○○○ load from one of them reads as a re-open, not a refusal.
            const startedSessions = new Set(rows.filter(r => r.started).map(r => r.session));
            const flag = b => b ? '<span style="color:#00ff64;">●</span>' : '<span style="color:#444;">○</span>';
